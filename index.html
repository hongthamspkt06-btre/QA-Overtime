<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#e9ebee;
    --panel:#ffffff;
    --panel2:#f2f3f5;
    --border:#d9dce1;
    --text:#20242c;
    --sub:#68707c;
    --amber:#b45309;
    --amber-dim:#fbecd2;
    --green:#15803d;
    --green-dim:#dcf5e3;
    --red:#dc2626;
    --red-dim:#fbe1df;
    --steel:#2f6fed;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;margin:0;padding:0;}
  #app{max-width:1200px;margin:0 auto;padding:20px 18px 60px;}

  .topbar{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:18px;}
  .brand-eyebrow{font-size:11px;letter-spacing:.18em;color:var(--steel);font-weight:700;text-transform:uppercase;margin-bottom:4px;}
  .brand-title{font-size:22px;font-weight:800;letter-spacing:.01em;}
  .brand-sub{font-size:12px;color:var(--sub);margin-top:2px;}

  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);}
  input[type=date], input[type=text], input[type=password], select{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:8px 10px;font-size:13px;outline:none;font-family:inherit;
  }
  input[type=date]:focus, input[type=text]:focus, input[type=password]:focus, select:focus{border-color:var(--steel);background:#fff;}

  .btn{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);border-radius:6px;padding:8px 14px;
    font-size:12.5px;font-weight:600;cursor:pointer;letter-spacing:.02em;
    transition:all .15s ease;white-space:nowrap;
  }
  .btn:hover{border-color:var(--steel);background:#e8edfc;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-steel{background:var(--steel);border-color:var(--steel);color:#fff;}
  .btn-steel:hover{filter:brightness(1.08);}
  .btn-red{color:var(--red);}
  .btn-green{background:var(--green);border-color:var(--green);color:#fff;}
  .btn-green:hover{filter:brightness(1.08);}
  .btn-danger{background:var(--red);border-color:var(--red);color:#fff;}
  .btn-danger:hover{filter:brightness(1.08);}
  .btn-sm{padding:5px 9px;font-size:11.5px;}

  .sync-pill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);font-family:var(--mono);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
  .dot.syncing{background:var(--amber);animation:pulse 1s infinite;}
  .dot.err{background:var(--red);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,24,32,.04);}
  .panel-title{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);font-weight:700;margin-bottom:12px;}

  .entry-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .entry-row .field{flex:1;min-width:130px;}
  .entry-row .field.grow2{flex:1.6;min-width:170px;}
  .entry-row .field.small{flex:0 0 110px;min-width:100px;}

  .inline-msg{margin-top:10px;font-size:12.5px;padding:8px 12px;border-radius:6px;display:flex;align-items:flex-start;gap:8px;line-height:1.5;}
  .inline-msg.error{background:var(--red-dim);color:var(--red);}
  .inline-msg.info{background:var(--amber-dim);color:var(--amber);}
  .inline-msg code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-family:var(--mono);}

  .setup-banner{background:#fff7e6;border:1px solid #f0d19c;border-radius:10px;padding:16px 18px;margin-bottom:18px;font-size:13px;line-height:1.7;color:#7a4d09;}
  .setup-banner b{color:#5c3a06;}
  .setup-banner code{background:rgba(0,0,0,.06);padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:12px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  .table-scroll{
    overflow:auto;max-height:min(46vh, 420px);
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  thead th{
    text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--sub);border-bottom:1px solid var(--border);padding:9px 8px;font-weight:700;
    background:var(--panel2);position:sticky;top:0;z-index:5;
  }
  tbody td{padding:9px 8px;border-bottom:1px solid #eef0f2;vertical-align:middle;}
  tbody tr:hover{background:#f7f9fc;}
  tbody tr:last-child td{border-bottom:none;}
  td.num{font-family:var(--mono);color:var(--sub);}
  td.name{font-weight:600;}
  td.time{font-family:var(--mono);color:var(--steel);}
  td.by{color:var(--sub);font-size:12px;}
  .empty-state{padding:36px 10px;text-align:center;color:var(--sub);font-size:13px;}

  .status-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.03em;}
  .status-pending{background:var(--amber-dim);color:var(--amber);}
  .status-approved{background:var(--green-dim);color:var(--green);}
  .status-rejected{background:var(--red-dim);color:var(--red);}

  .approval-panel{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
  .approval-left{display:flex;align-items:center;gap:14px;}
  .sig-stamp{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;}
  .sig-stamp img{height:42px;}
  .sig-meta{font-size:11px;color:var(--sub);line-height:1.5;font-family:var(--mono);}
  .sig-meta b{color:var(--text);font-family:inherit;}

  .confirm-box{display:flex;align-items:center;gap:10px;background:var(--amber-dim);border:1px solid #f0d19c;border-radius:8px;padding:8px 12px;flex-wrap:wrap;}
  .confirm-box span{font-size:12.5px;color:var(--amber);font-weight:600;}
  .confirm-box input[type=password]{width:130px;}
  .confirm-box.reject-box{background:var(--red-dim);border-color:#f3c6c2;flex-direction:column;align-items:stretch;gap:8px;}
  .confirm-box.reject-box span{color:var(--red);}
  .confirm-box textarea{width:100%;min-height:56px;background:#fff;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12.5px;font-family:inherit;color:var(--text);resize:vertical;}
  .reject-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pw-error{font-size:11.5px;color:var(--red);font-weight:600;}

  .footer-note{font-size:11px;color:var(--sub);text-align:center;margin-top:20px;line-height:1.6;}

  .tab-bar{display:flex;gap:6px;margin-bottom:18px;}
  .tab-btn{
    padding:9px 20px;border-radius:8px 8px 0 0;border:1px solid var(--border);border-bottom:none;
    background:var(--panel2);color:var(--sub);font-size:13px;font-weight:700;letter-spacing:.03em;
    cursor:pointer;text-transform:uppercase;
  }
  .tab-btn.active{background:var(--panel);color:var(--steel);border-color:var(--steel);position:relative;top:1px;}
  .tab-btn:hover:not(.active){background:#e8edfc;}

  .autocomplete-wrap{position:relative;}
  .autocomplete-list{
    position:absolute;top:100%;left:0;right:0;z-index:50;margin-top:2px;
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
    max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    box-shadow:0 6px 18px rgba(20,24,32,.12);
  }
  .autocomplete-item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f0f1f3;}
  .autocomplete-item:last-child{border-bottom:none;}
  .autocomplete-item:hover, .autocomplete-item.hl{background:var(--panel2);}
  .autocomplete-item b{color:var(--steel);}
  .autocomplete-empty{padding:10px 12px;font-size:12.5px;color:var(--sub);}
  .count-chip{font-family:var(--mono);font-size:11px;color:var(--sub);background:var(--panel2);border:1px solid var(--border);padding:3px 9px;border-radius:20px;}

  .ds-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .ds-table th, .ds-table td{border:1px solid var(--border);padding:7px 8px;text-align:center;vertical-align:middle;}
  .ds-table thead th{background:var(--panel2);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);font-weight:700;position:sticky;top:0;z-index:5;}
  .ds-table td.ds-left{text-align:left;}
  .ds-table td.ds-factory{font-weight:700;background:#f7f9fc;}
  .ds-table .ds-input{width:100%;min-width:60px;border:1px solid transparent;background:transparent;text-align:center;font-size:12.5px;border-radius:4px;padding:4px 6px;}
  .ds-table .ds-input:hover{border-color:var(--border);}
  .ds-table .ds-input:focus{border-color:var(--steel);background:#fff;}
  .ds-table tfoot td{background:var(--panel2);font-weight:700;}
  .ds-table tfoot select{font-size:12px;padding:4px 6px;}
  .ds-table tfoot .ds-note{width:100%;min-width:140px;font-size:12px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;margin-top:4px;}

  @media (max-width:720px){
    table{font-size:12px;}
    thead th:nth-child(6), tbody td:nth-child(6){display:none;}
    .entry-row .field{min-width:100%;}
  }

  .modal-overlay{position:fixed;inset:0;background:rgba(20,24,32,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
  .modal-box{background:#fff;border-radius:12px;padding:22px 24px;max-width:320px;width:100%;text-align:center;box-shadow:0 10px 34px rgba(20,24,32,.25);}
  .modal-box p{margin:0 0 18px;font-size:14px;color:var(--text);line-height:1.5;}
  .modal-actions{display:flex;gap:10px;justify-content:center;}
  .modal-actions .btn{flex:1;justify-content:center;}

  .trend-lock{max-width:360px;margin:60px auto;text-align:center;}
  .trend-lock .lock-icon{font-size:34px;margin-bottom:10px;}
  .trend-lock h3{margin:0 0 6px;font-size:16px;}
  .trend-lock p{color:var(--sub);font-size:12.5px;margin:0 0 16px;}
  .trend-lock-row{display:flex;gap:8px;justify-content:center;}
  .trend-lock-row input{width:180px;}
  .trend-section{margin-bottom:22px;}
  .trend-section-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
  .trend-section-title{font-size:14px;font-weight:800;letter-spacing:.02em;}
  .trend-section-sub{font-size:11.5px;color:var(--sub);margin-top:2px;}
  .gran-toggle{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:3px;}
  .gran-btn{border:none;background:transparent;color:var(--sub);font-size:12px;font-weight:700;padding:6px 14px;border-radius:6px;cursor:pointer;letter-spacing:.02em;}
  .gran-btn.active{background:var(--steel);color:#fff;}
  .trend-charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .trend-charts.single{grid-template-columns:1fr;}
  .trend-charts-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .chart-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;}
  .chart-card-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:700;margin-bottom:2px;}
  .chart-card-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .chart-card-filters{display:flex;gap:6px;flex-wrap:wrap;}
  .chart-card-filters select, .chart-card-filters input[type=date]{font-size:11px;padding:5px 6px;min-width:0;}
  .chart-card-legend{font-size:11px;color:var(--sub);margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap;}
  .chart-card-legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend-swatch{width:14px;height:0;border-top:2px dashed var(--red);display:inline-block;}
  .legend-swatch.avg{border-top-color:var(--steel);}
  .chart-wrap{position:relative;height:240px;}
  .qa-detail-section-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);font-weight:700;margin:12px 0 6px;}
  .qa-detail-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
  .qa-detail-table{border-collapse:collapse;font-size:11.5px;white-space:nowrap;width:100%;}
  .qa-detail-table th, .qa-detail-table td{padding:5px 9px;border-bottom:1px solid var(--border);border-right:1px solid #f2f3f5;text-align:right;}
  .qa-detail-table thead th{background:var(--panel2);color:var(--sub);font-weight:700;font-size:10.5px;}
  .qa-detail-table th:first-child, .qa-detail-table td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);font-weight:700;z-index:1;}
  .qa-detail-table thead th:first-child{background:var(--panel2);}
  .qa-detail-sum-col{font-weight:800;border-left:2px solid var(--border);background:var(--panel2);}
  @media (max-width:820px){
    .trend-charts{grid-template-columns:1fr;}
    .trend-charts-3{grid-template-columns:1fr;}
  }
</style>

function hoursDiff(fromStr, toStr){
  const fm = /^(\d{1,2}):(\d{2})$/.exec((fromStr||'').trim());
  const tm = /^(\d{1,2}):(\d{2})$/.exec((toStr||'').trim());
  if(!fm || !tm) return 0;
  const fromMin = parseInt(fm[1],10)*60 + parseInt(fm[2],10);
  const toMin = parseInt(tm[1],10)*60 + parseInt(tm[2],10);
  const diff = (toMin - fromMin) / 60;
  return diff > 0 ? diff : 0;
}
function computeOtAmount(hours){
  const RATE = 50000;
  const halfSteps = [0.5, 1.5, 2.5, 3.5, 4.5];
  if(halfSteps.indexOf(hours) >= 0){
    return (hours + 0.5) * RATE;
  }
  return hours * RATE;
}
function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDateShort(iso){
  const [y,m,d] = (iso||'').split('-');
  if(!y||!m||!d) return '';
  return `${MONTH_ABBR[parseInt(m,10)-1]}-${d}`;
}
function fmtDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('en-GB', {hour12:false});
}
function esc(s){
  return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escXml(s){
  return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
}

/* Google Apps Script web apps occasionally answer a fresh request with a
   transient HTTP 404/500/503 (e.g. right after a redeploy, or under cold-start
   load) even though the deployment itself is fine - a straight retry a few
   hundred ms later almost always succeeds. fetchWithRetry wraps every GET/POST
   call in up to 3 attempts with exponential backoff so those blips no longer
   surface as a hard "Sync failed: HTTP 404" to the user. cache:'no-store' also
   stops the browser from serving a stale cached 404/redirect response. */
async function fetchWithRetry(url, options, attempts){
  attempts = attempts || 3;
  let lastErr;
  for(let i = 0; i < attempts; i++){
    try{
      const res = await fetch(url, Object.assign({ cache: 'no-store' }, options || {}));
      if(!res.ok){
        // 4xx other than 404/408/429 are not transient - fail fast instead of retrying.
        const retryable = res.status === 404 || res.status === 408 || res.status === 429 || res.status >= 500;
        if(!retryable || i === attempts - 1) throw new Error('HTTP ' + res.status);
        lastErr = new Error('HTTP ' + res.status);
      } else {
        return res;
      }
    }catch(e){
      lastErr = e;
      if(i === attempts - 1) throw lastErr;
    }
    await new Promise(r => setTimeout(r, 400 * Math.pow(2, i)));
  }
  throw lastErr;
}

async function apiGet(date){
  const url = APPS_SCRIPT_URL + '?date=' + encodeURIComponent(date) + '&_=' + Date.now();
  const res = await fetchWithRetry(url, { method: 'GET' });
  return await res.json();
}

async function apiSave(date, data){
  const res = await fetchWithRetry(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ date, data })
  });
  return await res.json();
}

/* Lay nhieu key trong 1 lan goi POST (dung cho tab Trend thay vi goi
   apiGet() rieng cho tung ngay). Tra ve map { key: {rows:[...]} }. */
async function apiGetBulk(keys){
  if(!keys.length) return {};
  const res = await fetchWithRetry(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'getBulk', keys })
  });
  return await res.json();
}

async function loadData(showSyncDot){
  if(NOT_CONFIGURED){ state.loading = false; render(); return; }
  const skipRender = !showSyncDot && (isFormFocused() || state.confirmingSign || state.confirmingUnlock || state.confirmingReject);
  if(showSyncDot){ state.syncing = true; if(!skipRender) render(); }
  try{
    const result = await apiGet(storageDateKey());
    state.data = result && result.rows ? result : { rows: [], approved:false, approvedAt:null, approvedBy:null, rejected:false, rejectedAt:null, rejectedBy:null, rejectComment:'' };
    state.syncError = '';
  }catch(e){
    console.error(e);
    state.syncError = 'Sync failed: ' + e.message;
  }
  state.loading = false;
  state.syncing = false;
  state.lastSync = new Date();
  if(!skipRender) render();
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(()=>{
    if(state.category === 'DailySummary') loadDailySummary(false);
    else if(state.category === 'WeeklySummary') loadWeeklySummary(false);
    else if(state.category === 'Trend') { /* no auto-poll: trend data is cached and fetched on demand */ }

  }, 8000);
}

const WEEKDAY_LABELS = ['Mon','Tue','Wed','Thu','Fri','Sat'];

function buildWeeklySummaryRows(){
  const days = weeklyDayList();
  const ws = state.weeklySummary;
  const byEmp = {};
  days.forEach((d, dayIdx) => {
    (ws.staffByDate[d] || []).forEach(r => {
      const key = (r.idCode && r.idCode.trim()) ? r.idCode.trim() : ('__' + (r.fullName||'').trim());
      if(!byEmp[key]){
        byEmp[key] = {
          idCode: r.idCode || '',
          fullName: r.fullName || '',
          ownTeam: r.ownTeam || '',
          dayTo: ['', '', '', '', '', ''],
          hourTotal: 0,
          amountTotal: 0
        };
      }
      const emp = byEmp[key];
      if(!emp.ownTeam && r.ownTeam) emp.ownTeam = r.ownTeam;
      const h = hoursDiff(r.otFrom, r.otTo);
      emp.hourTotal += h;
      emp.amountTotal += computeOtAmount(h);
      emp.dayTo[dayIdx] = emp.dayTo[dayIdx] ? (emp.dayTo[dayIdx] + ', ' + (r.otTo||'')) : (r.otTo || '');
    });
  });
  const rows = Object.values(byEmp);
  rows.sort((a,b) => {
    const t = (a.ownTeam||'').localeCompare(b.ownTeam||'');
    if(t !== 0) return t;
    return (a.fullName||'').localeCompare(b.fullName||'');
  });
  return rows;
}

function buildWeeklyDayTotals(){
  const days = weeklyDayList();
  const ws = state.weeklySummary;
  return days.map(d => {
    const dayRows = ws.staffByDate[d] || [];
    let hourSum = 0, amountSum = 0;
    dayRows.forEach(r => {
      const h = hoursDiff(r.otFrom, r.otTo);
      hourSum += h;
      amountSum += computeOtAmount(h);
    });
    return { hourSum, amountSum };
  });
}

/* ====== Trend tab: date-range helpers, fetch/aggregate helpers ====== */

function mondayOfWeekContaining(iso){
  const d = new Date(iso + 'T00:00:00');
  const day = d.getDay(); // 0=Sun..6=Sat
  const diffToMonday = (day === 0) ? -6 : (1 - day);
  d.setDate(d.getDate() + diffToMonday);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

/* Every date list below is capped at "today" - future dates are simply
   skipped since there is no OT data for them yet. */
function trendDatesInRange(from, to){
  const today = todayStr();
  if(!from || !to) return [];
  let start = from, end = to;
  if(start > end){ const tmp = start; start = end; end = tmp; }
  const dates = [];
  let d = start;
  let guard = 0;
  while(d <= end && guard < 400){ // guard: sane upper bound on manual From/To range
    if(d <= today) dates.push(d);
    d = addDaysStr(d, 1);
    guard++;
  }
  return dates;
}

function trendDatesInMonth(year, month){
  const today = todayStr();
  const daysInMonth = new Date(year, month, 0).getDate();
  const dates = [];
  for(let day = 1; day <= daysInMonth; day++){
    const ds = year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
    if(ds > today) break;
    dates.push(ds);
  }
  return dates;
}

function trendDatesInYear(year){
  const today = todayStr();
  const curYear = Number(today.slice(0, 4));
  const maxMonth = (year === curYear) ? Number(today.slice(5, 7)) : 12;
  let dates = [];
  for(let m = 1; m <= maxMonth; m++) dates = dates.concat(trendDatesInMonth(year, m));
  return dates;
}

/* month is 1-12, or '' / falsy to aggregate the whole year. */
function trendDatesForYearMonth(year, month){
  return month ? trendDatesInMonth(year, Number(month)) : trendDatesInYear(year);
}

/* Gop toan bo ngay con thieu (ca Staff lan Worker) thanh 1 lan goi POST
   duy nhat (apiGetBulk) thay vi goi apiGet() rieng cho tung ngay. Day la
   nguyen nhan chinh khien tab Trend truoc day mat toi 10 phut: xem ca nam
   co the phai goi GAS toi ~730 lan (365 ngay x 2 category). */
async function fetchAllTrendDates(dates, onDone){
  const missingStaff = dates.filter(d => trendCache.Staff[d] === undefined);
  const missingWorker = dates.filter(d => trendCache.Worker[d] === undefined);
  const keys = missingStaff.map(d => 'Staff::' + d)
    .concat(missingWorker.map(d => 'Worker::' + d));
  if(keys.length){
    const bulk = await apiGetBulk(keys);
    missingStaff.forEach(d => {
      const res = bulk['Staff::' + d];
      // Rejected dates are excluded from Trend entirely — only Pending
      // (not yet signed) or Done (approved) data counts toward the charts.
      trendCache.Staff[d] = (res && res.rows && !res.rejected) ? res.rows : [];
      if(trendCache.Staff[d].length) trendKnownYears.add(Number(d.slice(0,4)));
    });
    missingWorker.forEach(d => {
      const res = bulk['Worker::' + d];
      trendCache.Worker[d] = (res && res.rows && !res.rejected) ? res.rows : [];
      if(trendCache.Worker[d].length) trendKnownYears.add(Number(d.slice(0,4)));
    });
  }
  if(onDone) onDone();
}

/* Loads whatever daily data every visible Trend box currently needs (union of
   the 5 independent filter boxes below), then caches it in trendCache so
   switching a single box's Year/Month/Week filter re-renders instantly
   without a full refetch. */
function trendAllNeededDates(){
  const tr = state.trend;
  const sets = [
    trendDatesForYearMonth(tr.staffPeriod.year, tr.staffPeriod.month),
    trendDatesInYear(tr.staffDetail.year), // covers both its day-in-month and month-in-year rows
    trendDatesInRange(tr.workerWeek.from, tr.workerWeek.to),
    trendDatesForYearMonth(tr.workerMonth.year, tr.workerMonth.month),
    trendDatesInYear(tr.workerYear.year),
    trendDatesInYear(tr.workerDetail.year) // covers both its day-in-month and month-in-year rows
  ];
  return Array.from(new Set(sets.flat()));
}

async function loadTrendData(){
  const tr = state.trend;

  tr.loadProgress = null;

/* Team-name normalization for the Staff Trend charts: some teams are split
   across factories/brands in the raw data (e.g. "MW Lab" vs "F7 Lab", or
   "MW Colorist" vs "F6/F7 Colorist") but should be reported as one combined
   team ("Lab" / "Colorist") rather than as separate bars. */
function normalizeTeamName(team){
  const t = (team || '').trim();
  if(!t) return '(No team)';
  if(/colorist/i.test(t)) return 'Colorist';
  if(/\blab\b/i.test(t)) return 'Lab';
  return t;
}

/* Fixed x-axis order for the "Average Hour & Amount by Team" chart, per the
   business-requested layout (support teams first, then factory teams, then
   Colorist/Lab/Office). Teams not found in this list (shouldn't normally
   happen) are appended alphabetically after it, so nothing silently
   disappears from the chart. */
const STAFF_AVERAGE_TEAM_ORDER = ['A&F', 'AEO', 'CostCo', 'Cotton On', 'Pink', 'Target', 'Wal-Mart', 'F6 Uniqlo', 'F7 Uniqlo', 'Colorist', 'Lab', 'Office'];
function staffAverageTeamSort(a, b){
  const ia = STAFF_AVERAGE_TEAM_ORDER.indexOf(a);
  const ib = STAFF_AVERAGE_TEAM_ORDER.indexOf(b);
  if(ia === -1 && ib === -1) return a.localeCompare(b);
  if(ia === -1) return 1;
  if(ib === -1) return -1;
  return ia - ib;
}

/* Position normalization for QA(Worker): each Worker's Own Team string
   encodes a factory prefix plus a position (e.g. "F6/F7 PSC", "F1/F2 PSC",
   "F6 FQC", "F7 SOP") - the QA(Worker) Detail box filters by the position
   only (PSC / SOP / FQC), regardless of which factory it's paired with. */
function normalizeWorkerPosition(team){
  const t = (team || '').trim();
  if(!t) return '(No position)';
  if(/PSC/i.test(t)) return 'PSC';
  if(/SOP/i.test(t)) return 'SOP';
  if(/FQC/i.test(t)) return 'FQC';
  return t;
}

/* Aggregates QA(Staff) rows across `dates`, grouped by team. metric is
   'hour' or 'amount'. Returns series sorted by value desc for charting.

   Quy tắc chung (giống buildDailySummaryGroups): khi nhân viên chọn Support
   Team (requestedBy) khác với Own Team gốc của họ và khác "Own", thì OT đó
   được TÍNH vào team hỗ trợ (Support Team), không phải Own Team gốc. Nếu
   requestedBy trống hoặc bằng "Own" (hoặc trùng Own Team gốc), thì lấy theo
   Own Team như bình thường. */
function buildStaffTeamSeries(dates, metric){
  const cache = trendCache.Staff;
  const map = new Map();
  dates.forEach(d => (cache[d] || []).forEach(r => {
    const originalOwnTeam = (r.ownTeam || '').trim();
    const requestedBy = (r.requestedBy || '').trim();
    const effectiveTeam = (requestedBy && requestedBy !== 'Own' && requestedBy !== originalOwnTeam)
      ? requestedBy
      : originalOwnTeam;
    const team = normalizeTeamName(effectiveTeam);
    const h = hoursDiff(r.otFrom, r.otTo);
    const val = metric === 'hour' ? h : computeOtAmount(h);
    map.set(team, (map.get(team) || 0) + val);
  }));
  return Array.from(map.entries())
    .map(([label, value]) => ({ label, value }))
    .sort((a, b) => b.value - a.value);
}

/* Số lượt người tăng ca theo từng team trong `dates` (mỗi dòng OT = 1 lượt),
   dùng cùng quy tắc gom team (effectiveTeam) như buildStaffTeamSeries, để có
   thể ghép 1-1 với series đó theo team label. */
function buildStaffTeamTurnCounts(dates){
  const cache = trendCache.Staff;
  const map = new Map();
  (dates || []).forEach(d => (cache[d] || []).forEach(r => {
    const originalOwnTeam = (r.ownTeam || '').trim();
    const requestedBy = (r.requestedBy || '').trim();
    const effectiveTeam = (requestedBy && requestedBy !== 'Own' && requestedBy !== originalOwnTeam)
      ? requestedBy
      : originalOwnTeam;
    const team = normalizeTeamName(effectiveTeam);
    map.set(team, (map.get(team) || 0) + 1);
  }));
  return map;
}

/* Giờ (hoặc Amount) trung bình / 1 lượt người tăng ca, theo TỪNG team:
     = Tổng số giờ (hoặc Amount) tăng ca của team / Σ(Số người tăng ca của team đó từng ngày)
   Trả về mảng song song với `series` (cùng thứ tự team), mỗi phần tử là số
   trung bình của team đó, hoặc null nếu team không có lượt nào. */
function trendAveragePerTurnByTeam(series, dates){
  const turnCounts = buildStaffTeamTurnCounts(dates);
  return series.map(s => {
    const cnt = turnCounts.get(s.label) || 0;
    return cnt ? s.value / cnt : null;
  });
}

/* Weighted overall average per turn (hour or amount) across ALL teams
   combined - i.e. total value / total turns for every team together -
   using the exact same "total / turns" method as trendAveragePerTurnByTeam
   above, just summed over the whole population instead of one team. Used
   for the black dashed "Average of All Teams" reference line on the
   Average Hour chart. */
function trendOverallAveragePerTurn(series, dates){
  const totalValue = series.reduce((s, x) => s + x.value, 0);
  const turnCounts = buildStaffTeamTurnCounts(dates);
  const totalTurns = Array.from(turnCounts.values()).reduce((s, x) => s + x, 0);
  return totalTurns ? totalValue / totalTurns : null;
}

/* Builds the per-team Average Hour and Average Amount series for the
   "Average Hour & Amount by Team" chart, which now has its own single
   Year/Month filter (hourSeries/amountSeries are built from the same
   dates). Kept as two separate series/dates parameters since the
   underlying per-team average math is identical either way; the team list
   is the union of both, in the fixed STAFF_AVERAGE_TEAM_ORDER order, with a
   team missing from one side getting a null (no point/bar drawn) there. */
function buildStaffAverageByTeam(hourSeries, hourDates, amountSeries, amountDates){
  const hourAvgs = trendAveragePerTurnByTeam(hourSeries, hourDates);
  const amountAvgs = trendAveragePerTurnByTeam(amountSeries, amountDates);
  const hourMap = new Map(hourSeries.map((s, i) => [s.label, hourAvgs[i]]));
  const amountMap = new Map(amountSeries.map((s, i) => [s.label, amountAvgs[i]]));
  const teams = Array.from(new Set([...hourMap.keys(), ...amountMap.keys()])).sort(staffAverageTeamSort);
  return {
    teams,
    hourValues: teams.map(t => hourMap.has(t) ? hourMap.get(t) : null),
    amountValues: teams.map(t => amountMap.has(t) ? amountMap.get(t) : null)
  };
}

/* Aggregates QA(Worker) hours across `dates`, grouped by person (keyed by
   Emp ID when available, to keep two same-named workers separate) but
   labeled by Full Name for display, falling back to Emp ID only if the name
   is blank. Returns series sorted by value desc. */
function buildWorkerEmpSeries(dates){
  const cache = trendCache.Worker;
  const map = new Map();
  dates.forEach(d => (cache[d] || []).forEach(r => {
    const idCode = (r.idCode || '').trim();
    const fullName = (r.fullName || '').trim();
    const key = idCode || ('__' + fullName);
    const label = fullName || idCode || '?';
    const h = hoursDiff(r.otFrom, r.otTo);
    if(!map.has(key)) map.set(key, { label, value: 0 });
    map.get(key).value += h;
  }));
  return Array.from(map.values()).sort((a, b) => b.value - a.value);
}

/* Aggregates one person's OT for a QA Detail box: hour+amount for every day
   of `month` in `year` (capped at today), and hour+amount for every month of
   `year` (capped at the current month if `year` is this year). A day or
   month that hasn't happened yet is `null` (rendered as "-") rather than 0,
   to distinguish "no OT" from "not reached yet". personKey matches the same
   Emp ID / Full Name key scheme used by buildWorkerEmpSeries. `cache` is
   either trendCache.Staff or trendCache.Worker, so this same helper backs
   both the QA(Staff) and QA(Worker) Detail boxes. */
function buildPersonDetailData(cache, personKey, year, month){
  const today = todayStr();
  const curYear = Number(today.slice(0, 4));

  function sumForDate(ds){
    let hour = 0, amount = 0;
    (cache[ds] || []).forEach(r => {
      const idCode = (r.idCode || '').trim();
      const fullName = (r.fullName || '').trim();
      const key = idCode || ('__' + fullName);
      if(key !== personKey) return;
      const h = hoursDiff(r.otFrom, r.otTo);
      hour += h;
      amount += computeOtAmount(h);
    });
    return { hour, amount };
  }

  const daysInMonth = new Date(year, month, 0).getDate();
  const dayHours = [], dayAmounts = [];
  for(let day = 1; day <= daysInMonth; day++){
    const ds = year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
    if(ds > today){ dayHours.push(null); dayAmounts.push(null); continue; }
    const r = sumForDate(ds);
    dayHours.push(r.hour);
    dayAmounts.push(r.amount);
  }

  const maxMonth = year < curYear ? 12 : (year === curYear ? Number(today.slice(5, 7)) : 0);
  const monthHours = [], monthAmounts = [];
  for(let m = 1; m <= 12; m++){
    if(m > maxMonth){ monthHours.push(null); monthAmounts.push(null); continue; }
    let hour = 0, amount = 0;
    const dim = new Date(year, m, 0).getDate();
    for(let day = 1; day <= dim; day++){
      const ds = year + '-' + String(m).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      if(ds > today) break;
      const r = sumForDate(ds);
      hour += r.hour;
      amount += r.amount;
    }
    monthHours.push(hour);
    monthAmounts.push(amount);
  }

  return {
    dayHours, dayAmounts, monthHours, monthAmounts,
    daySumHour: sumOrNull(dayHours), daySumAmount: sumOrNull(dayAmounts),
    monthSumHour: sumOrNull(monthHours), monthSumAmount: sumOrNull(monthAmounts)
  };
}

/* QA(Staff) Detail box: same as buildPersonDetailData, fixed to the Staff cache. */
function buildStaffDetailData(personKey, year, month){
  return buildPersonDetailData(trendCache.Staff, personKey, year, month);
}

/* QA(Worker) Detail box: same as buildPersonDetailData, fixed to the Worker cache. */
function buildWorkerDetailData(personKey, year, month){
  return buildPersonDetailData(trendCache.Worker, personKey, year, month);
}

/* Sums an array of numbers/nulls (skipping nulls, i.e. days/months not yet
   reached). Returns null only when every entry is null (nothing to sum). */
function sumOrNull(arr){
  const vals = arr.filter(v => v !== null && v !== undefined);
  if(!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0);
}

async function fetchLatest(){
  try{
    const result = await apiGet(storageDateKey());
    if(result && result.rows) return result;
  }catch(e){ console.error(e); }
  return state.data || { rows: [], approved:false, approvedAt:null, approvedBy:null, rejected:false, rejectedAt:null, rejectedBy:null, rejectComment:'' };
}

async function persist(newData){
  state.syncing = true; state.formError=''; render();
  try{
    await apiSave(storageDateKey(), newData);
    state.data = newData;
    state.syncError = '';
  }catch(e){
    console.error('Save error', e);
    state.formError = 'Could not save: ' + e.message + ' (check your internet connection or the backend URL setup)';
  }
  state.syncing = false;
  state.lastSync = new Date();
  render();
}

/* ---------- Excel export: fills the official company template ---------- */

function b64ToUint8(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

function excelDateSerial(dateStr){
  const d = new Date(dateStr + 'T00:00:00Z');
  const epoch = Date.UTC(1899,11,30);
  return Math.round((d.getTime() - epoch) / 86400000);
}

function timeToExcelFraction(hhmm){
  const m = /^(\d{1,2}):(\d{2})$/.exec((hhmm||'').trim());
  if(!m) return null;
  const h = parseInt(m[1],10), mi = parseInt(m[2],10);
  return (h*60+mi)/1440;
}

function setCellXml(xml, ref, buildCellTag, fallbackAttrs){
  const rowNum = ref.match(/\d+/)[0];

  const re = new RegExp('<c r="' + ref + '"([^/>]*)/>');
  if(re.test(xml)) return xml.replace(re, (m, attrs) => buildCellTag(attrs));

  const re2 = new RegExp('<c r="' + ref + '"([^>]*)>.*?</c>');
  if(re2.test(xml)) return xml.replace(re2, (m, attrs) => buildCellTag(attrs));

  // Ô chưa tồn tại trong template -> tạo mới, dùng fallbackAttrs (định dạng giờ) nếu có
  const cellTag = buildCellTag(fallbackAttrs || '');
  const rowSelfClose = new RegExp('<row r="' + rowNum + '"([^/>]*)/>');
  if(rowSelfClose.test(xml)) return xml.replace(rowSelfClose, (m, attrs) => `<row r="${rowNum}"${attrs}>${cellTag}</row>`);

  const rowOpenClose = new RegExp('(<row r="' + rowNum + '"[^>]*>)([\\s\\S]*?)(</row>)');
  if(rowOpenClose.test(xml)) return xml.replace(rowOpenClose, (m, open, inner, close) => `${open}${inner}${cellTag}${close}`);

  return xml;
}

function setInlineStrCell(xml, ref, value){
  return setCellXml(xml, ref, (attrs) => `<c r="${ref}"${attrs} t="inlineStr"><is><t>${escXml(value)}</t></is></c>`);
}

function setNumberCell(xml, ref, num, forcedStyleId){
  return setCellXml(xml, ref, (attrs) => {
    let newAttrs = attrs || '';
    if(forcedStyleId){
      if(/\ss="\d+"/.test(newAttrs)){
        newAttrs = newAttrs.replace(/\ss="\d+"/, ' s="' + forcedStyleId + '"');
      } else {
        newAttrs = newAttrs + ' s="' + forcedStyleId + '"';
      }
    }
    return `<c r="${ref}"${newAttrs}><v>${num}</v></c>`;
  });
}

async function exportExcel(){
  state.exporting = true; state.exportMsg = ''; render();
  try{
    const rows = (state.data.rows || []).slice(0, TEMPLATE_MAX_ROWS);
    const overflow = (state.data.rows || []).length - rows.length;

    const zip = await JSZip.loadAsync(b64ToUint8(TEMPLATE_B64));
    let sheetXml = await zip.file('xl/worksheets/sheet1.xml').async('string');

    // Widen column B (Emp/ID Code) so codes like "USV000026" are not clipped
    sheetXml = sheetXml.replace(
      /<col min="2" max="2" width="[\d.]+"/,
      '<col min="2" max="2" width="14"'
    );
// Widen column C (Full Name) so Vietnamese names with diacritics are not clipped
sheetXml = sheetXml.replace(
  /<col min="3" max="3" width="[\d.]+"/,
  '<col min="3" max="3" width="32"'
);

    // Date (J8)
    sheetXml = setNumberCell(sheetXml, 'J8', excelDateSerial(state.date));
// Lấy đúng style-index (định dạng giờ h:mm) từ dòng mẫu chuẩn STT 1 (E11/F11),
// rồi ép áp dụng style này cho MỌI dòng, kể cả dòng vốn có định dạng sai sẵn trong template
function getStyleId(xml, ref){
  const re = new RegExp('<c r="' + ref + '"[^/>]*?\\ss="(\\d+)"');
  const m = re.exec(xml);
  return m ? m[1] : null;
}
const styleIdE = getStyleId(sheetXml, 'E11');
const styleIdF = getStyleId(sheetXml, 'F11');

    // Data rows -> template rows 11..70
    rows.forEach((r, i) => {
      const rn = 11 + i;
      sheetXml = setInlineStrCell(sheetXml, 'B'+rn, r.idCode || '');
      const fromFrac = timeToExcelFraction(r.otFrom);
      const toFrac = timeToExcelFraction(r.otTo);
      if(fromFrac !== null) sheetXml = setNumberCell(sheetXml, 'E'+rn, fromFrac, styleIdE);
      if(toFrac !== null) sheetXml = setNumberCell(sheetXml, 'F'+rn, toFrac, styleIdF);
      sheetXml = setInlineStrCellStyled(sheetXml, 'H'+rn, r.requestedBy || '', '14');
      sheetXml = setInlineStrCellStyled(sheetXml, 'J'+rn, r.remark || '', '17');
    });
    function setInlineStrCellStyled(xml, ref, value, forcedStyleId){
  return setCellXml(xml, ref, (attrs) => {
    let newAttrs = attrs || '';
    if(/\ss="\d+"/.test(newAttrs)){
      newAttrs = newAttrs.replace(/\ss="\d+"/, ' s="' + forcedStyleId + '"');
    } else {
      newAttrs = newAttrs + ' s="' + forcedStyleId + '"';
    }
    return `<c r="${ref}"${newAttrs} t="inlineStr"><is><t>${escXml(value)}</t></is></c>`;
  });
}
// Sửa lại công thức Total (G71): file mẫu gốc chỉ SUM(G41:G70), thiếu STT 1-30 (dòng 11-40)
sheetXml = sheetXml.replace(
  /<c r="G71"([^>]*)><f>SUM\(G41:G70\)<\/f>/,
  '<c r="G71"$1><f>SUM(G11:G70)</f>'
);

    // Worker tab: remove the Recheck (column G) formula entirely across all
    // template rows. Staff tab keeps the original formula untouched.
    if(state.category === 'Worker'){
      for(let rn = 11; rn <= 70; rn++){
        const reG = new RegExp('<c r="G' + rn + '"([^>]*)>.*?</c>');
        sheetXml = sheetXml.replace(reG, (m, attrs) => `<c r="G${rn}"${attrs}/>`);
      }
    }

    // Signed caption text in I84 (cell value, separate from the floating signature image)
    if(state.data.approved){
      const signedText = 'Signed ' + fmtDateTime(state.data.approvedAt);
      sheetXml = setInlineStrCell(sheetXml, 'I84', signedText);
    }

    zip.file('xl/worksheets/sheet1.xml', sheetXml);

    // Increase row 83's height so the enlarged signature image fits without
    // overlapping the "Signed ..." text on row 84
    let sheetXml2 = await zip.file('xl/worksheets/sheet1.xml').async('string');
    sheetXml2 = sheetXml2.replace(/<row r="83"([^>]*)ht="15"([^>]*)>/, '<row r="83"$1ht="44" customHeight="1"$2>');
    zip.file('xl/worksheets/sheet1.xml', sheetXml2);

    // Force Excel to recalculate all formulas (C, D, G columns) automatically on open,
    // instead of showing stale/blank cached formula results
    let workbookXml = await zip.file('xl/workbook.xml').async('string');
    const calcStart = workbookXml.indexOf('<calcPr');
    if(calcStart >= 0){
      const calcEnd = workbookXml.indexOf('/>', calcStart) + 2;
      workbookXml = workbookXml.slice(0, calcStart) + '<calcPr calcId="162913" fullCalcOnLoad="1" forceFullCalc="1"/>' + workbookXml.slice(calcEnd);
    } else {
      workbookXml = workbookXml.replace('</workbook>', '<calcPr calcId="162913" fullCalcOnLoad="1" forceFullCalc="1"/></workbook>');
    }
    zip.file('xl/workbook.xml', workbookXml);

    // Signature image, only if signed off - placed just above I84 (row 83) so the
    // "Signed ..." text in I84 stays visible underneath/beside it
    if(state.data.approved){
      const sigBytes = b64ToUint8(SIG_IMG.split(',')[1]);
      zip.file('xl/media/image2.png', sigBytes);

      let rels = await zip.file('xl/drawings/_rels/drawing1.xml.rels').async('string');
      rels = rels.replace('</Relationships>',
        '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image2.png"/></Relationships>');
      zip.file('xl/drawings/_rels/drawing1.xml.rels', rels);

      let drawingXml = await zip.file('xl/drawings/drawing1.xml').async('string');
      const anchor = '<xdr:oneCellAnchor>'
        + '<xdr:from><xdr:col>8</xdr:col><xdr:colOff>15000</xdr:colOff><xdr:row>82</xdr:row><xdr:rowOff>4000</xdr:rowOff></xdr:from>'
        + '<xdr:ext cx="990000" cy="540000"/>'
        + '<xdr:pic>'
        + '<xdr:nvPicPr><xdr:cNvPr id="99" name="ChuKyDienTu" descr="ChuKyDienTu"/>'
        + '<xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>'
        + '<xdr:blipFill><a:blip xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:embed="rId2" cstate="print"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>'
        + '<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="990000" cy="540000"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr>'
        + '</xdr:pic><xdr:clientData/></xdr:oneCellAnchor>';
      drawingXml = drawingXml.replace('</xdr:wsDr>', anchor + '</xdr:wsDr>');
      zip.file('xl/drawings/drawing1.xml', drawingXml);
    }

    // Build the filled xlsx in-memory (not downloaded directly) then send it to
    // the Apps Script backend, which uploads it to Google Sheets (so formulas
    // are actually calculated) and converts it to a locked, non-editable PDF.
    state.exportMsg = 'Filling template, calculating formulas and generating PDF (may take a few seconds)...';
    render();

    const outBase64 = await zip.generateAsync({ type: 'base64' });

    const pdfRes = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'exportPdf',
        fileName: 'Overtime_Form_' + state.category + '_' + state.date + '.xlsx',
        fileBase64: outBase64
      })
    });
    if(!pdfRes.ok) throw new Error('HTTP ' + pdfRes.status);
    const pdfResult = await pdfRes.json();
    if(!pdfResult.success) throw new Error(pdfResult.error || 'PDF conversion failed on the server');

    const pdfBytes = b64ToUint8(pdfResult.pdfBase64);
    const pdfBlob = new Blob([pdfBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(pdfBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Overtime_Form_' + state.category + '_' + state.date + '.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);

    state.exportMsg = overflow > 0
      ? `Exported as PDF. Note: this date has ${state.data.rows.length} entries but the template only fits ${TEMPLATE_MAX_ROWS} rows — the last ${overflow} were not included.`
      : 'Exported successfully as a non-editable PDF in the official company format.';
  }catch(e){
    console.error(e);
    state.exportMsg = 'Export failed: ' + e.message;
  }
  state.exporting = false;
  render();
}

function buildDailySummaryGroups(){
  // Tag each row with its source category so Staff and Worker can be kept in
  // separate blocks (Staff on top, Worker below) within the same Factory,
  // even when both categories share the same Own Team name.
  const staffRows = (state.dailySummary.staffRows || []).map(r => Object.assign({}, r, { _cat: 'Staff' }));
  const workerRows = (state.dailySummary.workerRows || []).map(r => Object.assign({}, r, { _cat: 'Worker' }));
  const allRows = staffRows.concat(workerRows);

  // Quy tắc chung: khi nhân viên chọn Support Team (requestedBy) khác với Own Team gốc của họ (không phải "Own"),
  // thì OT đó được TÍNH vào Own Team = Support Team đã chọn (đội được hỗ trợ),
  // còn cột Support Team sẽ hiển thị Own Team gốc của nhân viên đó, và tách thành 1 dòng riêng.
  // (Ví dụ: Nguyễn Thị Ngọc Mai (CostCo) chọn Support Team = Target -> Own Team hiển thị Target, Support Team hiển thị CostCo)
  const adjustedRows = allRows.map(r => {
    const originalOwnTeam = (r.ownTeam || '').trim();
    const requestedBy = (r.requestedBy || '').trim();
    if(requestedBy && requestedBy !== 'Own' && requestedBy !== originalOwnTeam){
      return Object.assign({}, r, { ownTeam: requestedBy, requestedBy: originalOwnTeam || '(Không có)' });
    }
    return r;
  });

  function buildTeams(rowsForCat){
    const teamNames = Array.from(new Set(rowsForCat.map(r => r.ownTeam || '(Chưa có Own Team)'))).sort((a,b)=>a.localeCompare(b));
    return teamNames.map(ownTeam => {
      const teamRows = rowsForCat.filter(r => (r.ownTeam || '(Chưa có Own Team)') === ownTeam);
      const supportKeys = Array.from(new Set(teamRows.map(r => r.requestedBy || '(Không có)'))).sort((a,b)=>{
        if(a === 'Own' && b !== 'Own') return -1;
        if(b === 'Own' && a !== 'Own') return 1;
        return a.localeCompare(b);
      });
      const supportGroups = supportKeys.map(supportTeam => {
        const subRows = teamRows.filter(r => (r.requestedBy || '(Không có)') === supportTeam);
        // Tách OT ra nhiều dòng, mỗi dòng liệt kê 1 giá trị OT khác nhau
        const otKeys = Array.from(new Set(subRows.map(r => r.otTo).filter(Boolean))).sort((a,b)=>a.localeCompare(b));
        let otRows = otKeys.map(ot => {
          const otSubRows = subRows.filter(r => r.otTo === ot);
          const reasonVals = Array.from(new Set(otSubRows.map(r => r.remark).filter(Boolean)));
          return { ot, qty: otSubRows.length, reason: reasonVals.join(', ') };
        });
        if(otRows.length === 0){
          const reasonVals = Array.from(new Set(subRows.map(r => r.remark).filter(Boolean)));
          otRows = [{ ot: '', qty: subRows.length, reason: reasonVals.join(', ') }];
        }
        const qty = subRows.length;
        const reasonVals = Array.from(new Set(subRows.map(r => r.remark).filter(Boolean)));
        return { supportTeam, qty, otRows, reason: reasonVals.join(', ') };
      });
      const total = supportGroups.reduce((s,g)=>s+g.qty, 0);
      const distinctReasons = Array.from(new Set(supportGroups.map(g=>g.reason)));
      const mergedReason = distinctReasons.length === 1 ? distinctReasons[0] : null;
      return { ownTeam, supportGroups, total, mergedReason };
    });
  }

  const factories = FACTORY_LIST.filter(f => adjustedRows.some(r => (r.factory || '') === f));
  return factories.map(factory => {
    const factoryRows = adjustedRows.filter(r => (r.factory || '') === factory);
    const staffTeams = buildTeams(factoryRows.filter(r => r._cat === 'Staff'));
    const workerTeams = buildTeams(factoryRows.filter(r => r._cat === 'Worker'));
    // Staff teams first, Worker teams below, within the same Factory block.
    const teams = staffTeams.concat(workerTeams);
    return { factory, teams };
  });
}


function syncLabel(){
  if(state.syncing) return 'Syncing...';
  if(state.syncError) return state.syncError;
  if(!state.lastSync) return '';
  const secs = Math.floor((Date.now() - state.lastSync.getTime())/1000);
  if(secs < 3) return 'Just synced';
  return 'Synced ' + secs + 's ago';
}

function empSuggestListHtml(){
  const q = (state.form.idCode || '').trim().toLowerCase();
  let matches = empListForTab();
  if(q){
    matches = matches.filter(e => e.id.toLowerCase().indexOf(q) >= 0 || e.name.toLowerCase().indexOf(q) >= 0);
  }
  matches = matches.slice(0, 100);
  if(matches.length === 0){
    return '<div class="autocomplete-empty">No matching Emp ID</div>';
  }
  return matches.map(e => `<div class="autocomplete-item empSuggestItem" data-id="${esc(e.id)}" data-name="${esc(e.name)}">${esc(e.id)} — ${esc(e.name)}</div>`).join('');
}

      // reset to the start of the field (which previously caused newly
      // typed digits to be inserted before existing ones, e.g. typing

      const el = document.getElementById('f_idCode');

      // restore the caret. Without this guard, that programmatic focus()
      // would re-trigger this onfocus handler, which would render() again
      // and call focus() a second time WITHOUT restoring the caret -
      // silently snapping the cursor back to position 0 after every
      // keystroke (this was the real cause of digits appearing reversed /
      // the cursor jumping to the front of the field while typing).
      if(state.empSuggestOpen) return;
      state.empSuggestOpen = true;

    const id = state.confirmingDeleteId;
    state.confirmingDeleteId = null;
    state.confirmingDeleteName = '';

    if(id) await deleteRow(id);
  };
  const delNo = document.getElementById('deleteNoBtn');
  if(delNo) delNo.onclick = ()=>{
    state.confirmingDeleteId = null;
    state.confirmingDeleteName = '';
    render();
  };

  const sob = document.getElementById('signOffBtn');
  if(sob) sob.onclick = ()=>{ state.showSignOffActions = true; render(); };

  const sb = document.getElementById('signBtn');
  if(sb) sb.onclick = askSignConfirm;
  const sy = document.getElementById('signYes');
  if(sy) sy.onclick = doSignApprove;
  const sn = document.getElementById('signNo');
  if(sn) sn.onclick = cancelSignConfirm;
  const pwf = document.getElementById('pwField');
  if(pwf){ pwf.oninput = (e)=>{ state.pwInput = e.target.value; }; pwf.onkeydown = (e)=>{ if(e.key==='Enter') doSignApprove(); }; }

  const rjb = document.getElementById('rejectBtn');
  if(rjb) rjb.onclick = askRejectConfirm;
  const rjy = document.getElementById('rejectYes');
  if(rjy) rjy.onclick = doRejectApprove;
  const rjn = document.getElementById('rejectNo');
  if(rjn) rjn.onclick = cancelRejectConfirm;
  const rjc = document.getElementById('rejectCommentField');
  if(rjc){ rjc.oninput = (e)=>{ state.rejectComment = e.target.value; }; }
  const pwfr = document.getElementById('pwFieldReject');
  if(pwfr){ pwfr.oninput = (e)=>{ state.pwInput = e.target.value; }; pwfr.onkeydown = (e)=>{ if(e.key==='Enter' && e.ctrlKey) doRejectApprove(); }; }

  const ub = document.getElementById('unlockBtn');
  if(ub) ub.onclick = askUnlockConfirm;
  const uy = document.getElementById('unlockYes');
  if(uy) uy.onclick = doUnlockApprove;
  const un = document.getElementById('unlockNo');
  if(un) un.onclick = cancelUnlockConfirm;
  const pwfu = document.getElementById('pwFieldUnlock');
  if(pwfu){ pwfu.oninput = (e)=>{ state.pwInput = e.target.value; }; pwfu.onkeydown = (e)=>{ if(e.key==='Enter') doUnlockApprove(); }; }

  restoreScrollPositions();
}

function computeDailyAutoOverlap(){
  const allRows = (state.dailySummary.staffRows || []).concat(state.dailySummary.workerRows || []);
  const counts = {};
  allRows.forEach(r => {
    const id = (r.idCode || '').trim();
    if(!id) return;
    counts[id] = (counts[id] || 0) + 1;
  });
  const dupIds = Object.keys(counts).filter(id => counts[id] > 1).sort();
  const extra = dupIds.reduce((s, id) => s + (counts[id] - 1), 0);
  return { dupIds, extra };
}

  const ds = state.dailySummary;

  if(groups.length === 0){
    return `<div class="panel"><div class="empty-state">Chưa có dữ liệu OT (Staff/Worker) cho ngày ${fmtDate(state.date)}.</div></div>`;
  }

  let bodyHtml = '';
  let grandQty = 0;

  groups.forEach(g => {
    const meta = ds.meta[g.factory] || {};
    const factoryRowSpan = g.teams.reduce((s,t)=>s+t.supportGroups.reduce((s2,sg)=>s2+Math.max(sg.otRows.length,1), 0), 0);
    let isFactoryFirstRow = true;

    g.teams.forEach(t => {
      const teamRowSpan = t.supportGroups.reduce((s2,sg)=>s2+Math.max(sg.otRows.length,1), 0);
      let isTeamFirstRow = true;

      t.supportGroups.forEach(sg => {
        const otRows = sg.otRows.length ? sg.otRows : [{ ot:'', qty: sg.qty, reason: sg.reason }];

        otRows.forEach((otRow, idx) => {
          grandQty += otRow.qty;
          bodyHtml += '<tr>';

          if(isFactoryFirstRow){
            bodyHtml += `<td class="ds-factory" rowspan="${factoryRowSpan}">${esc(g.factory)}</td>`;
            bodyHtml += `<td rowspan="${factoryRowSpan}"><input type="text" class="ds-input" data-factory="${esc(g.factory)}" data-field="majorFacOT" value="${esc(meta.majorFacOT||'')}" placeholder="-"></td>`;
            bodyHtml += `<td rowspan="${factoryRowSpan}"><input type="text" class="ds-input" data-factory="${esc(g.factory)}" data-field="maxFacOT" value="${esc(meta.maxFacOT||'')}" placeholder="-"></td>`;
          }

          if(isTeamFirstRow){
            bodyHtml += `<td class="ds-left" rowspan="${teamRowSpan}">${esc(t.ownTeam)}</td>`;
          }

          if(idx === 0){
            bodyHtml += `<td class="ds-left" rowspan="${otRows.length}">${esc(sg.supportTeam)}</td>`;
          }

          if(isTeamFirstRow){
            const picVal = (meta.picByTeam && meta.picByTeam[t.ownTeam]) || '';
            bodyHtml += `<td rowspan="${teamRowSpan}"><input type="text" class="ds-input" data-factory="${esc(g.factory)}" data-team="${esc(t.ownTeam)}" data-field="pic" value="${esc(picVal)}" placeholder="-"></td>`;
          }

          bodyHtml += `<td>${esc(otRow.ot)}</td>`;
          bodyHtml += `<td>${otRow.qty}</td>`;

          if(isTeamFirstRow){
            bodyHtml += `<td rowspan="${teamRowSpan}">${t.total}</td>`;
          }

          if(t.mergedReason !== null){
            if(isTeamFirstRow){
              bodyHtml += `<td class="ds-left" rowspan="${teamRowSpan}">${esc(t.mergedReason)}</td>`;
            }
          } else {
            bodyHtml += `<td class="ds-left">${esc(otRow.reason)}</td>`;
          }

          bodyHtml += '</tr>';
          isFactoryFirstRow = false;
          isTeamFirstRow = false;
        });
      });
    });
  });

  const { extra: autoExtra } = computeDailyAutoOverlap();
  const autoTotal = grandQty - autoExtra;

  return `
    <div class="panel" style="padding:0;overflow:hidden;">
      <div style="padding:14px 16px 6px;">
        <div class="panel-title" style="margin-bottom:0;">Overtime Status &mdash; ${fmtDate(state.date)}</div>
      </div>
      <div class="table-scroll">
      <table class="ds-table" id="dsTable">
        <thead><tr>
          <th>Factory</th>
          <th>Major Fac OT</th>
          <th>Max Fac OT</th>
          <th>Own Team</th>
          <th>Support Team</th>
          <th>PIC</th>
          <th>OT</th>
          <th>Q'ty</th>
          <th>Total</th>
          <th>Reason</th>
        </tr></thead>
        <tbody>${bodyHtml}</tbody>
        <tfoot>
          <tr>
            <td colspan="7">Total</td>
            <td>${grandQty}</td>
            <td>${autoTotal}</td>
            <td class="ds-left">${autoExtra > 0 ? `${autoExtra}* Overlap` : ''}</td>
          </tr>
        </tfoot>
      </table>
      </div>
    </div>
  `;
}

function exportDailySummaryExcel(){
  const groups = buildDailySummaryGroups();
  if(groups.length === 0){ alert('Chưa có dữ liệu để xuất Excel.'); return; }
  const ds = state.dailySummary;

  const aoa = [['Factory','Major Fac OT','Max Fac OT','Own Team','Support Team','PIC','OT',"Q'ty",'Total','Reason']];
  const merges = [];
  let rowIdx = 1; // row 0 = header
  let grandQty = 0;

  groups.forEach(g => {
    const meta = ds.meta[g.factory] || {};
    const factoryRowSpan = g.teams.reduce((s,t)=>s+t.supportGroups.reduce((s2,sg)=>s2+Math.max(sg.otRows.length,1), 0), 0);
    const factoryStartRow = rowIdx;

    g.teams.forEach(t => {
      const teamRowSpan = t.supportGroups.reduce((s2,sg)=>s2+Math.max(sg.otRows.length,1), 0);
      const teamStartRow = rowIdx;
      const picVal = (meta.picByTeam && meta.picByTeam[t.ownTeam]) || '';

      t.supportGroups.forEach(sg => {
        const otRows = sg.otRows.length ? sg.otRows : [{ ot:'', qty: sg.qty, reason: sg.reason }];
        const sgStartRow = rowIdx;

        otRows.forEach(otRow => {
          grandQty += otRow.qty;
          aoa.push([
            g.factory,
            meta.majorFacOT || '',
            meta.maxFacOT || '',
            t.ownTeam,
            sg.supportTeam,
            picVal,
            otRow.ot,
            otRow.qty,
            t.total,
            t.mergedReason !== null ? t.mergedReason : otRow.reason
          ]);
          rowIdx++;
        });

        if(otRows.length > 1){
          merges.push({ s:{r:sgStartRow,c:4}, e:{r:sgStartRow+otRows.length-1,c:4} }); // Support Team
        }
      });

      if(teamRowSpan > 1){
        merges.push({ s:{r:teamStartRow,c:3}, e:{r:teamStartRow+teamRowSpan-1,c:3} }); // Own Team
        merges.push({ s:{r:teamStartRow,c:5}, e:{r:teamStartRow+teamRowSpan-1,c:5} }); // PIC
        merges.push({ s:{r:teamStartRow,c:8}, e:{r:teamStartRow+teamRowSpan-1,c:8} }); // Total
        if(t.mergedReason !== null){
          merges.push({ s:{r:teamStartRow,c:9}, e:{r:teamStartRow+teamRowSpan-1,c:9} }); // Reason
        }
      }
    });

    if(factoryRowSpan > 1){
      merges.push({ s:{r:factoryStartRow,c:0}, e:{r:factoryStartRow+factoryRowSpan-1,c:0} }); // Factory
      merges.push({ s:{r:factoryStartRow,c:1}, e:{r:factoryStartRow+factoryRowSpan-1,c:1} }); // Major Fac OT
      merges.push({ s:{r:factoryStartRow,c:2}, e:{r:factoryStartRow+factoryRowSpan-1,c:2} }); // Max Fac OT
    }
  });

  const { extra } = computeDailyAutoOverlap();
  const autoTotal = grandQty - extra;
  const totalRowIdx = aoa.length;
  aoa.push(['Total', '', '', '', '', '', '', grandQty, autoTotal, extra > 0 ? (extra + '* Overlap') : '']);
  merges.push({ s:{r:totalRowIdx,c:0}, e:{r:totalRowIdx,c:6} }); // "Total" label spans Factory..Q'ty

  const wsSheet = XLSX.utils.aoa_to_sheet(aoa);
  wsSheet['!merges'] = merges;
  wsSheet['!cols'] = [{wch:14},{wch:12},{wch:12},{wch:14},{wch:14},{wch:14},{wch:8},{wch:6},{wch:8},{wch:28}];
  wsSheet['!rows'] = aoa.map(()=>({hpt:20}));

  const leftCols = new Set([0,3,4,5,9]);
  const thinBorder = { style:'thin', color:{ rgb:'FFD9DEE8' } };
  const range = XLSX.utils.decode_range(wsSheet['!ref']);
  for(let r = range.s.r; r <= range.e.r; r++){
    for(let c = range.s.c; c <= range.e.c; c++){
      const ref = XLSX.utils.encode_cell({ r, c });
      if(!wsSheet[ref]) continue;
      const isHeader = r === 0;
      const isTotal = r === totalRowIdx;
      wsSheet[ref].s = {
        font: { bold: isHeader || isTotal, color: isHeader ? { rgb:'FFFFFFFF' } : { rgb:'FF1A1A1A' } },
        fill: isHeader ? { patternType:'solid', fgColor:{ rgb:'FF2F6FED' } } : (isTotal ? { patternType:'solid', fgColor:{ rgb:'FFEAF0FF' } } : undefined),
        alignment: { horizontal: (isHeader || isTotal) ? 'center' : (leftCols.has(c) ? 'left' : 'center'), vertical:'center', wrapText:true },
        border: { top:thinBorder, bottom:thinBorder, left:thinBorder, right:thinBorder }
      };
    }
  }

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsSheet, 'Daily Summary');
  XLSX.writeFile(wb, 'Daily_Summary_' + state.date + '.xlsx');
}

function renderWeeklySummary(app){
  const ws = state.weeklySummary;

  app.innerHTML = `
    <div class="tab-bar">
      <button class="tab-btn" id="tabStaff">Staff</button>
      <button class="tab-btn" id="tabWorker">Worker</button>
      <button class="tab-btn" id="tabDailySummary">Daily</button>
      <button class="tab-btn active" id="tabWeeklySummary">Weekly</button>
      <button class="tab-btn" id="tabTrend">Trend</button>
    </div>
    <div class="topbar">
      <div>
        <div class="brand-eyebrow">Hansoll Textile &middot; Unisoll Vina &middot; QA</div>
        <div class="brand-title">Weekly Summary</div>
      </div>
      <div class="topbar-right">
        <div class="field">
          <label>From (Mon)</label>
          <input type="date" id="wsFrom" value="${ws.from}">
        </div>
        <div class="field">
          <label>To (Sat)</label>
          <input type="date" id="wsTo" value="${ws.to}" disabled>
        </div>
        <div class="sync-pill"><span class="dot ${ws.syncing?'syncing':(ws.syncError?'err':'')}"></span>${ws.syncing?'Syncing...':(ws.syncError||'')}</div>
        <button class="btn" id="refreshBtn">&#8635; Refresh</button>
        <button class="btn btn-steel" id="wsExportBtn">&#8681; Export PDF</button>
      </div>
    </div>

    ${ws.loading ? '<div class="empty-state">Loading data...</div>' : renderWeeklySummaryTable()}
  `;

  function switchTab(cat){
    if(state.category === cat) return;
    state.category = cat;
    state.confirmingSign = false;
    state.confirmingUnlock = false;
    state.confirmingReject = false;
    state.showSignOffActions = false;
    state.exportMsg = '';
    state.formError = '';
    state.form = { idCode:'', fullName:'', otFrom:'', otTo:'', requestedBy:'', remark:'', factory:'', ownTeam:'' };
    state.empSuggestOpen = false;
    if(cat === 'DailySummary'){
      state.dailySummary.loading = true;
      loadDailySummary(false);
    } else if(cat === 'WeeklySummary'){
      state.weeklySummary.loading = true;
      loadWeeklySummary(false);
    } else if(cat === 'Trend'){
      // Moi lan mo lai tab Trend: coi du lieu hom nay la co the da cu (vd
      // vua nhap/sua OT o tab khac), nen xoa cache cua hom nay va load lai -
      // cac ngay khac van dung cache san co nen khong bi cham lai nhu truoc.
      if(state.trend.unlocked){
        invalidateTrendCacheForToday();
        loadTrendData();
      } else {
        render();
      }
    } else {
      state.loading = true;
      loadData(false);
    }
  }
  const tabStaff = document.getElementById('tabStaff');
  if(tabStaff) tabStaff.onclick = ()=>switchTab('Staff');
  const tabWorker = document.getElementById('tabWorker');
  if(tabWorker) tabWorker.onclick = ()=>switchTab('Worker');
  const tabDailySummary = document.getElementById('tabDailySummary');
  if(tabDailySummary) tabDailySummary.onclick = ()=>switchTab('DailySummary');
  const tabTrendWs = document.getElementById('tabTrend');
  if(tabTrendWs) tabTrendWs.onclick = ()=>switchTab('Trend');

  const fromEl = document.getElementById('wsFrom');
  if(fromEl) fromEl.onchange = (e) => {
    state.weeklySummary.from = e.target.value;
    state.weeklySummary.to = addDaysStr(e.target.value, 5);
    state.weeklySummary.loading = true;
    loadWeeklySummary(false);
  };

  const rb = document.getElementById('refreshBtn');
  if(rb) rb.onclick = ()=>loadWeeklySummary(true);

  const exb = document.getElementById('wsExportBtn');
  if(exb) exb.onclick = exportWeeklySummaryPdf;
}

function renderWeeklySummaryTable(){
  const rows = buildWeeklySummaryRows();
  const ws = state.weeklySummary;
  const dayHeaders = weeklyDayList().map(d => fmtDateShort(d));

  if(rows.length === 0){
    return `<div class="panel"><div class="empty-state">Chưa có dữ liệu OT (Staff) từ ${fmtDate(ws.from)} đến ${fmtDate(ws.to)}.</div></div>`;
  }

  let totalHour = 0, totalAmount = 0;
  const bodyHtml = rows.map((r, i) => {
    totalHour += r.hourTotal;
    totalAmount += r.amountTotal;
    return `<tr>
      <td>${i+1}</td>
      <td class="ds-left">${esc(r.ownTeam)}</td>
      <td>${esc(r.idCode)}</td>
      <td class="ds-left">${esc(r.fullName)}</td>
      <td>${r.hourTotal % 1 === 0 ? r.hourTotal : r.hourTotal.toFixed(1)}</td>
      <td>${r.amountTotal.toLocaleString('en-US')}</td>
      ${r.dayTo.map(v => `<td>${esc(v)}</td>`).join('')}
    </tr>`;
  }).join('');

  const dayTotals = buildWeeklyDayTotals();
  const dayTotalsHtml = dayTotals.map(dt => `<td>${dt.hourSum % 1 === 0 ? dt.hourSum : dt.hourSum.toFixed(1)}h<br><span style="font-size:10px;color:var(--sub);font-weight:400;">${dt.amountSum.toLocaleString('en-US')}</span></td>`).join('');

  return `
    <div class="panel" style="padding:0;overflow:hidden;">
      <div style="padding:14px 16px 6px;">
        <div class="panel-title" style="margin-bottom:0;">Weekly OT Summary &mdash; ${fmtDate(ws.from)} → ${fmtDate(ws.to)}</div>
      </div>
      <div class="table-scroll">
      <table class="ds-table" id="wsTable">
        <thead><tr>
          <th>No.</th>
          <th>Own Team</th>
          <th>EMP ID</th>
          <th>Full Name</th>
          <th>Hour(Week)</th>
          <th>Amount(Week)</th>
          ${dayHeaders.map(h => `<th>${esc(h)}</th>`).join('')}
        </tr></thead>
        <tbody>${bodyHtml}</tbody>
        <tfoot>
          <tr>
            <td colspan="4">Total</td>
            <td>${totalHour % 1 === 0 ? totalHour : totalHour.toFixed(1)}</td>
            <td>${totalAmount.toLocaleString('en-US')}</td>
            ${dayTotalsHtml}
          </tr>
        </tfoot>
      </table>
      </div>
    </div>
  `;
}
