<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#e9ebee;
    --panel:#ffffff;
    --panel2:#f2f3f5;
    --border:#d9dce1;
    --text:#20242c;
    --sub:#68707c;
    --amber:#b45309;
    --amber-dim:#fbecd2;
    --green:#15803d;
    --green-dim:#dcf5e3;
    --red:#dc2626;
    --red-dim:#fbe1df;
    --steel:#2f6fed;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;margin:0;padding:0;}
  #app{max-width:1200px;margin:0 auto;padding:20px 18px 60px;}

  .topbar{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:18px;}
  .brand-eyebrow{font-size:11px;letter-spacing:.18em;color:var(--steel);font-weight:700;text-transform:uppercase;margin-bottom:4px;}
  .brand-title{font-size:22px;font-weight:800;letter-spacing:.01em;}
  .brand-sub{font-size:12px;color:var(--sub);margin-top:2px;}

  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);}
  input[type=date], input[type=text], input[type=password], select{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:8px 10px;font-size:13px;outline:none;font-family:inherit;
  }
  input[type=date]:focus, input[type=text]:focus, input[type=password]:focus, select:focus{border-color:var(--steel);background:#fff;}

  .btn{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);border-radius:6px;padding:8px 14px;
    font-size:12.5px;font-weight:600;cursor:pointer;letter-spacing:.02em;
    transition:all .15s ease;white-space:nowrap;
  }
  .btn:hover{border-color:var(--steel);background:#e8edfc;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-steel{background:var(--steel);border-color:var(--steel);color:#fff;}
  .btn-steel:hover{filter:brightness(1.08);}
  .btn-red{color:var(--red);}
  .btn-sm{padding:5px 9px;font-size:11.5px;}

  .sync-pill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);font-family:var(--mono);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
  .dot.syncing{background:var(--amber);animation:pulse 1s infinite;}
  .dot.err{background:var(--red);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,24,32,.04);}
  .panel-title{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);font-weight:700;margin-bottom:12px;}

  .entry-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .entry-row .field{flex:1;min-width:130px;}
  .entry-row .field.grow2{flex:1.6;min-width:170px;}
  .entry-row .field.small{flex:0 0 110px;min-width:100px;}

  .inline-msg{margin-top:10px;font-size:12.5px;padding:8px 12px;border-radius:6px;display:flex;align-items:flex-start;gap:8px;line-height:1.5;}
  .inline-msg.error{background:var(--red-dim);color:var(--red);}
  .inline-msg.info{background:var(--amber-dim);color:var(--amber);}
  .inline-msg code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-family:var(--mono);}

  .setup-banner{background:#fff7e6;border:1px solid #f0d19c;border-radius:10px;padding:16px 18px;margin-bottom:18px;font-size:13px;line-height:1.7;color:#7a4d09;}
  .setup-banner b{color:#5c3a06;}
  .setup-banner code{background:rgba(0,0,0,.06);padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:12px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  .table-scroll{
    overflow:auto;max-height:min(46vh, 420px);
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  thead th{
    text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--sub);border-bottom:1px solid var(--border);padding:9px 8px;font-weight:700;
    background:var(--panel2);position:sticky;top:0;z-index:5;
  }
  tbody td{padding:9px 8px;border-bottom:1px solid #eef0f2;vertical-align:middle;}
  tbody tr:hover{background:#f7f9fc;}
  tbody tr:last-child td{border-bottom:none;}
  td.num{font-family:var(--mono);color:var(--sub);}
  td.name{font-weight:600;}
  td.time{font-family:var(--mono);color:var(--steel);}
  td.by{color:var(--sub);font-size:12px;}
  .empty-state{padding:36px 10px;text-align:center;color:var(--sub);font-size:13px;}

  .status-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.03em;}
  .status-pending{background:var(--amber-dim);color:var(--amber);}
  .status-approved{background:var(--green-dim);color:var(--green);}

  .approval-panel{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
  .approval-left{display:flex;align-items:center;gap:14px;}
  .sig-stamp{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;}
  .sig-stamp img{height:42px;}
  .sig-meta{font-size:11px;color:var(--sub);line-height:1.5;font-family:var(--mono);}
  .sig-meta b{color:var(--text);font-family:inherit;}

  .confirm-box{display:flex;align-items:center;gap:10px;background:var(--amber-dim);border:1px solid #f0d19c;border-radius:8px;padding:8px 12px;flex-wrap:wrap;}
  .confirm-box span{font-size:12.5px;color:var(--amber);font-weight:600;}
  .confirm-box input[type=password]{width:130px;}
  .pw-error{font-size:11.5px;color:var(--red);font-weight:600;}

  .footer-note{font-size:11px;color:var(--sub);text-align:center;margin-top:20px;line-height:1.6;}

  .tab-bar{display:flex;gap:6px;margin-bottom:18px;}
  .tab-btn{
    padding:9px 20px;border-radius:8px 8px 0 0;border:1px solid var(--border);border-bottom:none;
    background:var(--panel2);color:var(--sub);font-size:13px;font-weight:700;letter-spacing:.03em;
    cursor:pointer;text-transform:uppercase;
  }
  .tab-btn.active{background:var(--panel);color:var(--steel);border-color:var(--steel);position:relative;top:1px;}
  .tab-btn:hover:not(.active){background:#e8edfc;}

  .autocomplete-wrap{position:relative;}
  .autocomplete-list{
    position:absolute;top:100%;left:0;right:0;z-index:50;margin-top:2px;
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
    max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    box-shadow:0 6px 18px rgba(20,24,32,.12);
  }
  .autocomplete-item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f0f1f3;}
  .autocomplete-item:last-child{border-bottom:none;}
  .autocomplete-item:hover, .autocomplete-item.hl{background:var(--panel2);}
  .autocomplete-item b{color:var(--steel);}
  .autocomplete-empty{padding:10px 12px;font-size:12.5px;color:var(--sub);}
  .count-chip{font-family:var(--mono);font-size:11px;color:var(--sub);background:var(--panel2);border:1px solid var(--border);padding:3px 9px;border-radius:20px;}

  @media (max-width:720px){
    table{font-size:12px;}
    thead th:nth-child(6), tbody td:nth-child(6){display:none;}
    .entry-row .field{min-width:100%;}
  }
</style>

function todayStr(){

}
function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function fmtDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('en-GB', {hour12:false});
}
function esc(s){
  return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

}

function isFormFocused(){
  const el = document.activeElement;

async function apiGet(date){
  const url = APPS_SCRIPT_URL + '?date=' + encodeURIComponent(date) + '&_=' + Date.now();
  const res = await fetch(url, { method: 'GET' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

async function apiSave(date, data){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ date, data })
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

async function loadData(showSyncDot){
  if(NOT_CONFIGURED){ state.loading = false; render(); return; }
  const skipRender = !showSyncDot && isFormFocused();
  if(showSyncDot){ state.syncing = true; if(!skipRender) render(); }
  try{
    const result = await apiGet(storageDateKey());
    state.data = result && result.rows ? result : { rows: [], approved:false, approvedAt:null, approvedBy:null };
    state.syncError = '';
  }catch(e){
    console.error(e);
    state.syncError = 'Sync failed: ' + e.message;
  }
  state.loading = false;
  state.syncing = false;
  state.lastSync = new Date();
  if(!skipRender) render();
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(()=>loadData(false), 8000);
}

async function fetchLatest(){
  try{
    const result = await apiGet(storageDateKey());
    if(result && result.rows) return result;
  }catch(e){ console.error(e); }
  return state.data || { rows: [], approved:false, approvedAt:null, approvedBy:null };
}

async function persist(newData){
  state.syncing = true; state.formError=''; render();
  try{
    await apiSave(storageDateKey(), newData);
    state.data = newData;
    state.syncError = '';
  }catch(e){
    console.error('Save error', e);
    state.formError = 'Could not save: ' + e.message + ' (check your internet connection or the backend URL setup)';
  }
  state.syncing = false;
  state.lastSync = new Date();
  render();
}

async function addRow(){
  state.formError = '';
  if(!state.enteredBy.trim()){ state.formError = 'Please enter your name in "Entered by" (top right) before adding a row.'; render(); return; }
  if(!state.form.fullName.trim()){ state.formError = 'Please select an Emp ID or enter a Full Name.'; render(); return; }
  const latest = await fetchLatest();
  const newRow = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
    idCode: state.form.idCode.trim(),
    fullName: state.form.fullName.trim(),
    otFrom: state.form.otFrom.trim(),
    otTo: state.form.otTo.trim(),
    requestedBy: state.form.requestedBy.trim(),
    remark: state.form.remark.trim(),
    enteredBy: state.enteredBy.trim(),

  const updated = Object.assign({}, latest, { rows: (latest.rows||[]).concat([newRow]) });

  state.empSuggestOpen = false;
  await persist(updated);
}

/* ---------- Excel export: fills the official company template ---------- */

function b64ToUint8(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

function excelDateSerial(dateStr){
  const d = new Date(dateStr + 'T00:00:00Z');
  const epoch = Date.UTC(1899,11,30);
  return Math.round((d.getTime() - epoch) / 86400000);
}

function timeToExcelFraction(hhmm){
  const m = /^(\d{1,2}):(\d{2})$/.exec((hhmm||'').trim());
  if(!m) return null;
  const h = parseInt(m[1],10), mi = parseInt(m[2],10);
  return (h*60+mi)/1440;
}

function setCellXml(xml, ref, buildCellTag){
  const rowNum = ref.match(/\d+/)[0];

  const re = new RegExp('<c r="' + ref + '"([^/>]*)/>');
  if(re.test(xml)) return xml.replace(re, (m, attrs) => buildCellTag(attrs));

  const re2 = new RegExp('<c r="' + ref + '"([^>]*)>.*?</c>');
  if(re2.test(xml)) return xml.replace(re2, (m, attrs) => buildCellTag(attrs));

  // Cell does not exist at all in this row (e.g. a fully empty row) - inject it
  const cellTag = buildCellTag('');
  const rowSelfClose = new RegExp('<row r="' + rowNum + '"([^/>]*)/>');
  if(rowSelfClose.test(xml)) return xml.replace(rowSelfClose, (m, attrs) => `<row r="${rowNum}"${attrs}>${cellTag}</row>`);

  const rowOpenClose = new RegExp('(<row r="' + rowNum + '"[^>]*>)([\\s\\S]*?)(</row>)');
  if(rowOpenClose.test(xml)) return xml.replace(rowOpenClose, (m, open, inner, close) => `${open}${inner}${cellTag}${close}`);

  return xml; // row not found at all - leave unchanged
}

function setInlineStrCell(xml, ref, value){
  return setCellXml(xml, ref, (attrs) => `<c r="${ref}"${attrs} t="inlineStr"><is><t>${escXml(value)}</t></is></c>`);
}

function setNumberCell(xml, ref, num){
  return setCellXml(xml, ref, (attrs) => `<c r="${ref}"${attrs}><v>${num}</v></c>`);
}

async function exportExcel(){
  state.exporting = true; state.exportMsg = ''; render();
  try{
    const rows = (state.data.rows || []).slice(0, TEMPLATE_MAX_ROWS);
    const overflow = (state.data.rows || []).length - rows.length;

    const zip = await JSZip.loadAsync(b64ToUint8(TEMPLATE_B64));
    let sheetXml = await zip.file('xl/worksheets/sheet1.xml').async('string');

    // Widen column B (Emp/ID Code) so codes like "USV000026" are not clipped
    sheetXml = sheetXml.replace(
      /<col min="2" max="2" width="[\d.]+"/,
      '<col min="2" max="2" width="14"'
    );

    // Date (J8)
    sheetXml = setNumberCell(sheetXml, 'J8', excelDateSerial(state.date));

    // Data rows -> template rows 11..70
    rows.forEach((r, i) => {
      const rn = 11 + i;
      sheetXml = setInlineStrCell(sheetXml, 'B'+rn, r.idCode || '');
      const fromFrac = timeToExcelFraction(r.otFrom);
      const toFrac = timeToExcelFraction(r.otTo);
      if(fromFrac !== null) sheetXml = setNumberCell(sheetXml, 'E'+rn, fromFrac);
      if(toFrac !== null) sheetXml = setNumberCell(sheetXml, 'F'+rn, toFrac);
      sheetXml = setInlineStrCell(sheetXml, 'H'+rn, r.requestedBy || '');
      sheetXml = setInlineStrCell(sheetXml, 'J'+rn, r.remark || '');
    });

    // Worker tab: remove the Recheck (column G) formula entirely across all
    // template rows. Staff tab keeps the original formula untouched.
    if(state.category === 'Worker'){
      for(let rn = 11; rn <= 70; rn++){
        const reG = new RegExp('<c r="G' + rn + '"([^>]*)>.*?</c>');
        sheetXml = sheetXml.replace(reG, (m, attrs) => `<c r="G${rn}"${attrs}/>`);
      }
    }

    // Signed caption text in I84 (cell value, separate from the floating signature image)
    if(state.data.approved){
      const signedText = 'Signed ' + fmtDateTime(state.data.approvedAt);
      sheetXml = setInlineStrCell(sheetXml, 'I84', signedText);
    }

    zip.file('xl/worksheets/sheet1.xml', sheetXml);

    // Increase row 83's height so the enlarged signature image fits without
    // overlapping the "Signed ..." text on row 84
    let sheetXml2 = await zip.file('xl/worksheets/sheet1.xml').async('string');
    sheetXml2 = sheetXml2.replace(/<row r="83"([^>]*)ht="15"([^>]*)>/, '<row r="83"$1ht="44" customHeight="1"$2>');
    zip.file('xl/worksheets/sheet1.xml', sheetXml2);

    // Force Excel to recalculate all formulas (C, D, G columns) automatically on open,
    // instead of showing stale/blank cached formula results
    let workbookXml = await zip.file('xl/workbook.xml').async('string');
    const calcStart = workbookXml.indexOf('<calcPr');
    if(calcStart >= 0){
      const calcEnd = workbookXml.indexOf('/>', calcStart) + 2;
      workbookXml = workbookXml.slice(0, calcStart) + '<calcPr calcId="162913" fullCalcOnLoad="1" forceFullCalc="1"/>' + workbookXml.slice(calcEnd);
    } else {
      workbookXml = workbookXml.replace('</workbook>', '<calcPr calcId="162913" fullCalcOnLoad="1" forceFullCalc="1"/></workbook>');
    }
    zip.file('xl/workbook.xml', workbookXml);

    // Signature image, only if signed off - placed just above I84 (row 83) so the
    // "Signed ..." text in I84 stays visible underneath/beside it
    if(state.data.approved){
      const sigBytes = b64ToUint8(SIG_IMG.split(',')[1]);
      zip.file('xl/media/image2.png', sigBytes);

      let rels = await zip.file('xl/drawings/_rels/drawing1.xml.rels').async('string');
      rels = rels.replace('</Relationships>',
        '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image2.png"/></Relationships>');
      zip.file('xl/drawings/_rels/drawing1.xml.rels', rels);

      let drawingXml = await zip.file('xl/drawings/drawing1.xml').async('string');
      const anchor = '<xdr:oneCellAnchor>'
        + '<xdr:from><xdr:col>8</xdr:col><xdr:colOff>15000</xdr:colOff><xdr:row>82</xdr:row><xdr:rowOff>4000</xdr:rowOff></xdr:from>'
        + '<xdr:ext cx="990000" cy="540000"/>'
        + '<xdr:pic>'
        + '<xdr:nvPicPr><xdr:cNvPr id="99" name="ChuKyDienTu" descr="ChuKyDienTu"/>'
        + '<xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>'
        + '<xdr:blipFill><a:blip xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:embed="rId2" cstate="print"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>'
        + '<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="990000" cy="540000"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr>'
        + '</xdr:pic><xdr:clientData/></xdr:oneCellAnchor>';
      drawingXml = drawingXml.replace('</xdr:wsDr>', anchor + '</xdr:wsDr>');
      zip.file('xl/drawings/drawing1.xml', drawingXml);
    }

    // Build the filled xlsx in-memory (not downloaded directly) then send it to
    // the Apps Script backend, which uploads it to Google Sheets (so formulas
    // are actually calculated) and converts it to a locked, non-editable PDF.
    state.exportMsg = 'Filling template, calculating formulas and generating PDF (may take a few seconds)...';
    render();

    const outBase64 = await zip.generateAsync({ type: 'base64' });

    const pdfRes = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'exportPdf',
        fileName: 'Overtime_Form_' + state.category + '_' + state.date + '.xlsx',
        fileBase64: outBase64
      })
    });
    if(!pdfRes.ok) throw new Error('HTTP ' + pdfRes.status);
    const pdfResult = await pdfRes.json();
    if(!pdfResult.success) throw new Error(pdfResult.error || 'PDF conversion failed on the server');

    const pdfBytes = b64ToUint8(pdfResult.pdfBase64);
    const pdfBlob = new Blob([pdfBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(pdfBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Overtime_Form_' + state.category + '_' + state.date + '.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);

    state.exportMsg = overflow > 0
      ? `Exported as PDF. Note: this date has ${state.data.rows.length} entries but the template only fits ${TEMPLATE_MAX_ROWS} rows — the last ${overflow} were not included.`
      : 'Exported successfully as a non-editable PDF in the official company format.';
  }catch(e){
    console.error(e);
    state.exportMsg = 'Export failed: ' + e.message;
  }
  state.exporting = false;
  render();
}

function syncLabel(){
  if(state.syncing) return 'Syncing...';
  if(state.syncError) return state.syncError;
  if(!state.lastSync) return '';
  const secs = Math.floor((Date.now() - state.lastSync.getTime())/1000);
  if(secs < 3) return 'Just synced';
  return 'Synced ' + secs + 's ago';
}

function optionsHtml(list, selected){
  return '<option value="">-- Select --</option>' + list.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('');
}

function empSuggestListHtml(){
  const q = (state.form.idCode || '').trim().toLowerCase();
  let matches = EMP_LIST;
  if(q){
    matches = EMP_LIST.filter(e => e.id.toLowerCase().indexOf(q) >= 0 || e.name.toLowerCase().indexOf(q) >= 0);
  }
  matches = matches.slice(0, 100);
  if(matches.length === 0){
    return '<div class="autocomplete-empty">No matching Emp ID</div>';
  }
  return matches.map(e => `<div class="autocomplete-item empSuggestItem" data-id="${esc(e.id)}" data-name="${esc(e.name)}">${esc(e.id)} — ${esc(e.name)}</div>`).join('');
}

function render(){
  const app = document.getElementById('app');
  const d = state.data;
  const rows = d.rows || [];
  const approved = !!d.approved;

  const prevScroll = document.querySelector('.table-scroll');
  const savedScrollTop = prevScroll ? prevScroll.scrollTop : null;

  const prevSuggestScroll = document.querySelector('.autocomplete-list');
  const savedSuggestScrollTop = prevSuggestScroll ? prevSuggestScroll.scrollTop : null;

  if(NOT_CONFIGURED){
    app.innerHTML = `
      <div class="topbar">
        <div>
          <div class="brand-eyebrow">Hansoll Textile &middot; Unisoll Vina &middot; QA</div>
          <div class="brand-title">Overtime Request Form</div>
        </div>
      </div>
      <div class="setup-banner">
        <b>Setup needed:</b> this form is not connected to a shared backend yet.
        Edit the <code>APPS_SCRIPT_URL</code> constant near the top of the script.
      </div>
    `;
    return;
  }

  app.innerHTML = `
    <div class="tab-bar">
      <button class="tab-btn ${state.category==='Staff'?'active':''}" id="tabStaff">Staff</button>
      <button class="tab-btn ${state.category==='Worker'?'active':''}" id="tabWorker">Worker</button>
    </div>
    <div class="topbar">
      <div>
        <div class="brand-eyebrow">Hansoll Textile &middot; Unisoll Vina &middot; QA</div>
        <div class="brand-title">Overtime Request Form &mdash; ${esc(state.category)}</div>
        <div class="brand-sub">Shared data entry for multiple users &middot; Sign directly on the web</div>
      </div>
      <div class="topbar-right">
        <div class="field">
          <label>Date</label>
          <input type="date" id="datePicker" value="${state.date}">
        </div>
        <div class="field">
          <label>Entered by</label>
          <input type="text" id="enteredByInput" placeholder="Your name" value="${esc(state.enteredBy)}" style="width:130px;">
        </div>
        <div class="sync-pill"><span class="dot ${state.syncing?'syncing':(state.syncError?'err':'')}"></span>${syncLabel()}</div>
        <button class="btn" id="refreshBtn">&#8635; Refresh</button>
        <button class="btn btn-steel" id="exportBtn" ${state.exporting?'disabled':''}>&#8681; ${state.exporting?'Exporting...':'Export PDF'}</button>
      </div>
    </div>

    ${state.loading ? '<div class="empty-state">Loading data...</div>' : `

    <div class="panel">
      <div class="panel-title">Add overtime request</div>
      <div class="entry-row">
        <div class="field grow2 autocomplete-wrap">
          <label>Emp ID</label>
          <input type="text" id="f_idCode" autocomplete="off" placeholder="Select or type Emp ID" value="${esc(state.form.idCode)}" ${approved?'disabled':''}>
          ${(state.empSuggestOpen && !approved) ? `<div class="autocomplete-list" id="empSuggestList">${empSuggestListHtml()}</div>` : ''}
        </div>
        <div class="field grow2">
          <label>Full Name *</label>
          <input type="text" id="f_fullName" value="${esc(state.form.fullName)}" ${approved?'disabled':''}>
        </div>
        <div class="field small">
          <label>From</label>
          <select id="f_otFrom" ${approved?'disabled':''}>${optionsHtml(FROM_LIST, state.form.otFrom)}</select>
        </div>
        <div class="field small">
          <label>To</label>
          <select id="f_otTo" ${approved?'disabled':''}>${optionsHtml(TO_LIST, state.form.otTo)}</select>
        </div>
        <div class="field">
          <label>Requested by</label>
          <input type="text" id="f_requestedBy" value="${esc(state.form.requestedBy)}" ${approved?'disabled':''}>
        </div>
        <div class="field grow2">
          <label>Remark</label>
          <select id="f_remark" ${approved?'disabled':''}>${optionsHtml(REMARK_LIST, state.form.remark)}</select>
        </div>
        <button class="btn btn-steel" id="addBtn" ${approved?'disabled':''}>+ Add</button>
      </div>
      ${state.formError ? `<div class="inline-msg error">&#9888; ${esc(state.formError)}</div>` : ''}
      ${state.exportMsg ? `<div class="inline-msg ${state.exportMsg.indexOf('failed')>=0?'error':'info'}">${esc(state.exportMsg)}</div>` : ''}
      ${approved ? '<div class="inline-msg info">This form has been signed off &mdash; no further changes allowed. Click "Unlock / Edit" below to make changes.</div>' : ''}
    </div>

    <div class="panel" style="padding:0;overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;">
        <div class="panel-title" style="margin-bottom:0;">Request list &mdash; ${fmtDate(state.date)}</div>
        <span class="count-chip">${rows.length} ${rows.length===1?'person':'people'}</span>
      </div>
      ${rows.length === 0 ? '<div class="empty-state">No entries yet for this date. Add the first row above.</div>' : `
      <div class="table-scroll">
      <table>
        <thead><tr>
          <th style="width:36px;">No.</th>
          <th>Emp ID</th>
          <th>Full Name</th>
          <th>From</th>
          <th>To</th>
          <th>Requested by</th>
          <th>Remark</th>
          <th>Entered by</th>
          <th style="width:36px;"></th>
        </tr></thead>
        <tbody>
          ${rows.map((r,i)=>`
            <tr>
              <td class="num">${i+1}</td>
              <td class="num">${esc(r.idCode)}</td>
              <td class="name">${esc(r.fullName)}</td>
              <td class="time">${esc(r.otFrom)}</td>
              <td class="time">${esc(r.otTo)}</td>
              <td>${esc(r.requestedBy)}</td>
              <td class="by">${esc(r.remark)}</td>
              <td class="by">${esc(r.enteredBy)}</td>
              <td>${approved ? '' : `<button class="btn btn-sm btn-red delRowBtn" data-id="${r.id}" title="Delete">&times;</button>`}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
      `}
    </div>

    <div class="panel approval-panel">
      <div class="approval-left">
        ${approved ? `
          <span class="status-badge status-approved">&#10003; SIGNED OFF</span>
          <div class="sig-stamp">
            <img src="${SIG_IMG}" alt="Signature">
            <div class="sig-meta"><b>Kim Joo Shik</b><br>${fmtDateTime(d.approvedAt)}</div>
          </div>
        ` : `
          <span class="status-badge status-pending">&#9679; PENDING SIGN-OFF</span>
          <span style="font-size:12px;color:var(--sub);">Production Manager: Kim Joo Shik</span>
        `}
      </div>
      <div>
        ${approved
          ? (state.confirmingUnlock
              ? `<div class="confirm-box">
                   <span>Password to unlock:</span>
                   <input type="password" id="pwFieldUnlock" value="${esc(state.pwInput)}" placeholder="Password">
                   <button class="btn btn-sm btn-steel" id="unlockYes">Confirm</button>
                   <button class="btn btn-sm" id="unlockNo">Cancel</button>
                   ${state.pwError ? `<span class="pw-error">${esc(state.pwError)}</span>` : ''}
                 </div>`
              : `<button class="btn btn-sm" id="unlockBtn">&#128274; Unlock / Edit</button>`)
          : (state.confirmingSign
              ? `<div class="confirm-box">
                   <span>Password to sign off:</span>
                   <input type="password" id="pwField" value="${esc(state.pwInput)}" placeholder="Password">
                   <button class="btn btn-sm btn-steel" id="signYes">Confirm</button>
                   <button class="btn btn-sm" id="signNo">Cancel</button>
                   ${state.pwError ? `<span class="pw-error">${esc(state.pwError)}</span>` : ''}
                 </div>`
              : `<button class="btn btn-steel" id="signBtn" style="padding:12px 22px;font-size:14px;" ${rows.length===0?'disabled':''}>&#9998; SIGN OFF (Kim Joo Shik)</button>`)
        }
      </div>
    </div>

    <div class="footer-note">Data is stored in a shared Google Sheet and auto-synced every ~8 seconds &middot; Export fills the official company Excel template</div>
    `}
  `;

  function switchTab(cat){
    if(state.category === cat) return;
    state.category = cat;
    state.loading = true;
    state.confirmingSign = false;
    state.confirmingUnlock = false;
    state.exportMsg = '';
    state.formError = '';
    state.form = { idCode:'', fullName:'', otFrom:'', otTo:'', requestedBy:'', remark:'' };
    state.empSuggestOpen = false;
    loadData(false);
  }
  const tabStaff = document.getElementById('tabStaff');
  if(tabStaff) tabStaff.onclick = ()=>switchTab('Staff');
  const tabWorker = document.getElementById('tabWorker');
  if(tabWorker) tabWorker.onclick = ()=>switchTab('Worker');

  const dp = document.getElementById('datePicker');
  if(dp) dp.onchange = (e)=>{ state.date = e.target.value; state.loading = true; state.confirmingSign=false; state.confirmingUnlock=false; state.exportMsg=''; loadData(false); };

  const eb = document.getElementById('enteredByInput');
  if(eb) eb.oninput = (e)=>{ state.enteredBy = e.target.value; };

  const rb = document.getElementById('refreshBtn');
  if(rb) rb.onclick = ()=>loadData(true);

  const exb = document.getElementById('exportBtn');
  if(exb) exb.onclick = exportExcel;

  const idCodeEl = document.getElementById('f_idCode');
  if(idCodeEl){
    idCodeEl.oninput = (e)=>{
      const val = e.target.value;
      state.form.idCode = val;
      state.empSuggestOpen = true;
      if(EMP_MAP[val]){
        state.form.fullName = EMP_MAP[val];
      }
      render();
      const el = document.getElementById('f_idCode');
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    };
    idCodeEl.onfocus = ()=>{ state.empSuggestOpen = true; render(); const el=document.getElementById('f_idCode'); if(el) el.focus(); };
  }
  document.querySelectorAll('.empSuggestItem').forEach(item=>{
    item.onmousedown = (e)=>{
      e.preventDefault();
      const id = item.getAttribute('data-id');
      const name = item.getAttribute('data-name');
      state.form.idCode = id;
      state.form.fullName = name;
      state.empSuggestOpen = false;
      render();
    };
  });

  const fullNameEl = document.getElementById('f_fullName');
  if(fullNameEl) fullNameEl.oninput = (e)=>{ state.form.fullName = e.target.value; };

  const fromEl = document.getElementById('f_otFrom');
  if(fromEl) fromEl.onchange = (e)=>{ state.form.otFrom = e.target.value; };

  const toEl = document.getElementById('f_otTo');
  if(toEl) toEl.onchange = (e)=>{ state.form.otTo = e.target.value; };

  const reqByEl = document.getElementById('f_requestedBy');
  if(reqByEl) reqByEl.oninput = (e)=>{ state.form.requestedBy = e.target.value; };

  const remarkEl = document.getElementById('f_remark');
  if(remarkEl) remarkEl.onchange = (e)=>{ state.form.remark = e.target.value; };

  const ab = document.getElementById('addBtn');
  if(ab) ab.onclick = addRow;

  document.querySelectorAll('.delRowBtn').forEach(btn=>{
    btn.onclick = ()=>deleteRow(btn.getAttribute('data-id'));
  });

  const sb = document.getElementById('signBtn');
  if(sb) sb.onclick = askSignConfirm;
  const sy = document.getElementById('signYes');
  if(sy) sy.onclick = doSignApprove;
  const sn = document.getElementById('signNo');
  if(sn) sn.onclick = cancelSignConfirm;
  const pwf = document.getElementById('pwField');
  if(pwf){ pwf.oninput = (e)=>{ state.pwInput = e.target.value; }; pwf.onkeydown = (e)=>{ if(e.key==='Enter') doSignApprove(); }; }

  const ub = document.getElementById('unlockBtn');
  if(ub) ub.onclick = askUnlockConfirm;
  const uy = document.getElementById('unlockYes');
  if(uy) uy.onclick = doUnlockApprove;
  const un = document.getElementById('unlockNo');
  if(un) un.onclick = cancelUnlockConfirm;
  const pwfu = document.getElementById('pwFieldUnlock');
  if(pwfu){ pwfu.oninput = (e)=>{ state.pwInput = e.target.value; }; pwfu.onkeydown = (e)=>{ if(e.key==='Enter') doUnlockApprove(); }; }

  if(savedScrollTop !== null){
    const newScroll = document.querySelector('.table-scroll');
    if(newScroll) newScroll.scrollTop = savedScrollTop;
  }
  if(savedSuggestScrollTop !== null){
    const newSuggestScroll = document.querySelector('.autocomplete-list');
    if(newSuggestScroll) newSuggestScroll.scrollTop = savedSuggestScrollTop;
  }
}

document.addEventListener('click', (e)=>{
  if(state.empSuggestOpen && !e.target.closest('.autocomplete-wrap')){
    state.empSuggestOpen = false;
    render();
  }
});
document.addEventListener('touchend', (e)=>{
  if(state.empSuggestOpen && !e.target.closest('.autocomplete-wrap')){
    state.empSuggestOpen = false;
    render();
  }
});

render();
loadData(false);
startPolling();
</script>
