let pdfFontRegistered = false;
function registerPdfFont(doc){
  if(!pdfFontRegistered){
    doc.addFileToVFS('Arimo-Regular.ttf', ARIMO_REGULAR_B64);
    doc.addFont('Arimo-Regular.ttf', 'Arimo', 'normal');
    doc.addFileToVFS('Arimo-Bold.ttf', ARIMO_BOLD_B64);
    doc.addFont('Arimo-Bold.ttf', 'Arimo', 'bold');
    pdfFontRegistered = true;
  }
  doc.setFont('Arimo', 'normal');
}

function exportWeeklySummaryPdf(){
  const rows = buildWeeklySummaryRows();
  const ws = state.weeklySummary;
  if(rows.length === 0){ alert('Chưa có dữ liệu để xuất PDF.'); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
  registerPdfFont(doc);

  doc.setFontSize(13);
  doc.text('Weekly OT Summary  ' + fmtDate(ws.from) + '  ->  ' + fmtDate(ws.to), 40, 30);

  let totalHour = 0, totalAmount = 0;
  const body = rows.map((r, i) => {
    totalHour += r.hourTotal;
    totalAmount += r.amountTotal;
    return [
      i+1,
      r.ownTeam,
      r.idCode,
      r.fullName,
      r.hourTotal % 1 === 0 ? r.hourTotal : r.hourTotal.toFixed(1),
      r.amountTotal.toLocaleString('en-US'),
      ...r.dayTo
    ];
  });

  const dayTotals = buildWeeklyDayTotals();
  body.push([
    '', '', '', 'Total',
    totalHour % 1 === 0 ? totalHour : totalHour.toFixed(1),
    totalAmount.toLocaleString('en-US'),
    ...dayTotals.map(dt => (dt.hourSum % 1 === 0 ? dt.hourSum : dt.hourSum.toFixed(1)) + 'h / ' + dt.amountSum.toLocaleString('en-US'))
  ]);

  const dayHeaders = weeklyDayList().map(d => fmtDateShort(d));

  doc.autoTable({
    startY: 45,
    head: [['No.', 'Own Team', 'EMP ID', 'Full Name', 'Hour(Week)', 'Amount(Week)', ...dayHeaders]],
    body: body,
    styles: { font: 'Arimo', fontStyle: 'normal', fontSize: 8, cellPadding: 4, halign: 'center' },
    columnStyles: { 1: { halign: 'left' }, 3: { halign: 'left' } },
    headStyles: { font: 'Arimo', fontStyle: 'bold', fillColor: [47,111,237] }
  });

  doc.save('Weekly_Summary_' + ws.from + '_to_' + ws.to + '.pdf');
}

/* ====== Trend tab: password-gated OT trend charts ====== */

/* Fixed OT-hour ceilings for the QA(Worker) trend charts - always drawn as a
   dashed red reference line regardless of what the actual data shows. */
const TREND_WORKER_MAX = { week: 12, month: 40, year: 300 };

/* Average of the entered values in a Trend series (used for the QA(Staff)
   dashed black average line). Returns null when there is no data, so the
   caller can skip drawing the reference line entirely. */
function trendAverage(series){
  const vals = (series || []).map(s => s.value).filter(v => v !== null && v !== undefined && isFinite(v));
  if(!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function drawTrendChart(canvasId, series, valueKey, opts){
  const canvasEl = document.getElementById(canvasId);
  if(!canvasEl || typeof Chart === 'undefined') return;
  if(trendCharts[canvasId]){ trendCharts[canvasId].destroy(); delete trendCharts[canvasId]; }

  const labels = series.map(s => s.label);
  const data = series.map(s => s[valueKey]);
  const refValue = opts.refValue;
  const hasRef = refValue !== null && refValue !== undefined && isFinite(refValue);
  // Per-bar reference values (e.g. average / turn of EACH team), drawn as a
  // short bold segment across that bar's own width instead of one line
  // spanning the whole chart. Parallel array to `series`.
  const refValues = opts.refValues;
  const hasPerBarRef = Array.isArray(refValues);
  const finitePerBarRefs = hasPerBarRef ? refValues.filter(v => v !== null && v !== undefined && isFinite(v)) : [];
  const maxPerBarRef = finitePerBarRefs.length ? Math.max(...finitePerBarRefs) : 0;
  // Ensure the axis always extends past the reference value so the dashed
  // line (e.g. the Worker max) stays visible even when every bar sits well
  // below it, instead of being clipped off the top of the chart.
  const maxData = data.length ? Math.max(...data.filter(v => v !== null && v !== undefined && isFinite(v)), 0) : 0;
  const refCeil = hasRef ? refValue : (finitePerBarRefs.length ? maxPerBarRef : 0);
  const suggestedMax = (hasRef || finitePerBarRefs.length) ? Math.max(maxData, refCeil) * 1.15 : undefined;

  const refLinePlugin = {
    id: 'refLine_' + canvasId,
    afterDraw(chart){
      if(!hasRef) return;
      const { ctx, chartArea, scales } = chart;
      if(!chartArea || !scales.y) return;
      const yPos = scales.y.getPixelForValue(refValue);
      if(yPos < chartArea.top - 1 || yPos > chartArea.bottom + 1) return;
      ctx.save();
      ctx.beginPath();
      ctx.setLineDash([6, 4]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = opts.refColor || '#dc2626';
      ctx.moveTo(chartArea.left, yPos);
      ctx.lineTo(chartArea.right, yPos);
      ctx.stroke();

      if(opts.refLabelFormat){
        const label = opts.refLabelFormat(refValue);
        ctx.setLineDash([]);
        ctx.font = '700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';
        const textW = ctx.measureText(label).width;
        const padX = 4, padY = 2;
        const boxX = chartArea.right - textW - padX * 2 - 2;
        // Keep the label's box just above the line unless that would push it
        // off the top of the chart area, in which case drop it below instead.
        const above = (yPos - 14 - padY * 2) >= chartArea.top;
        const boxY = above ? (yPos - 14 - padY * 2) : (yPos + 4);
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fillRect(boxX, boxY, textW + padX * 2, 12 + padY * 2);
        ctx.fillStyle = opts.refColor || '#dc2626';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(label, boxX + padX, boxY + padY);
      }
      ctx.restore();
    }
  };

  // Draws each team's own average as a short, bold, solid black segment that
  // spans only that bar's width (not a line across the whole chart), with a
  // small data label above it - e.g. the "Giờ trung bình / 1 lượt" average
  // per team on the Hour/Amount by Team charts.
  const perBarRefPlugin = {
    id: 'perBarRef_' + canvasId,
    afterDatasetsDraw(chart){
      if(!hasPerBarRef) return;
      const { ctx, chartArea, scales } = chart;
      if(!chartArea || !scales.y) return;
      const meta = chart.getDatasetMeta(0);
      ctx.save();
      meta.data.forEach((bar, i) => {
        const rv = refValues[i];
        if(rv === null || rv === undefined || !isFinite(rv)) return;
        const yPos = scales.y.getPixelForValue(rv);
        if(yPos < chartArea.top - 1 || yPos > chartArea.bottom + 1) return;
        const halfW = (bar.width || 24) / 2;
        const x1 = bar.x - halfW;
        const x2 = bar.x + halfW;

        ctx.beginPath();
        ctx.setLineDash([]);
        ctx.lineWidth = opts.refLineWidth || 3;
        ctx.strokeStyle = opts.refColor || '#000000';
        ctx.lineCap = 'butt';
        ctx.moveTo(x1, yPos);
        ctx.lineTo(x2, yPos);
        ctx.stroke();

        if(opts.refLabelFormat){
          const label = opts.refLabelFormat(rv);
          ctx.font = '700 9px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';
          const textW = ctx.measureText(label).width;
          const padX = 3, padY = 1;
          // Keep the label just above its own segment unless that would push
          // it off the top of the chart area, in which case drop it below.
          const above = (yPos - 12 - padY * 2) >= chartArea.top;
          const boxY = above ? (yPos - 12 - padY * 2) : (yPos + 3);
          const boxX = bar.x - (textW + padX * 2) / 2;
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.fillRect(boxX, boxY, textW + padX * 2, 10 + padY * 2);
          ctx.fillStyle = opts.refColor || '#000000';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillText(label, boxX + padX, boxY + padY);
        }
      });
      ctx.restore();
    }
  };

  const dataLabelPlugin = {
    id: 'dataLabels_' + canvasId,
    afterDatasetsDraw(chart){
      const { ctx } = chart;
      const meta = chart.getDatasetMeta(0);
      ctx.save();
      ctx.font = '600 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';
      ctx.fillStyle = '#20242c';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      meta.data.forEach((bar, i) => {
        const val = data[i];
        if(val === undefined || val === null || !isFinite(val)) return;
        // Data labels always show a plain number (no unit suffix like "h"),
        // independent of the tooltip's formatting.
        const label = opts.dataLabelFormat ? opts.dataLabelFormat(val) : (Math.round(val * 10) / 10);
        ctx.fillText(label, bar.x, bar.y - 4);
      });
      ctx.restore();
    }
  };

  trendCharts[canvasId] = new Chart(canvasEl, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: opts.label || '',
        data,
        backgroundColor: opts.color || 'rgba(47,111,237,0.65)',
        borderRadius: 3,
        maxBarThickness: 34
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 250 },
      layout: { padding: { top: 18 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label(item){ return opts.tooltipFormat ? opts.tooltipFormat(item.parsed.y) : item.parsed.y; }
          }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10 } } },
        y: { beginAtZero: true, suggestedMax, grid: { color: '#eef0f2' }, ticks: { font: { size: 10 }, maxTicksLimit: 5, callback: opts.yTickFormat ? (v => opts.yTickFormat(v)) : undefined } }
      }
    },
    plugins: [refLinePlugin, perBarRefPlugin, dataLabelPlugin]
  });
}

/* Compact display for the "Total Amount by Team" chart, expressed in
   millions with one decimal, e.g. 4200000 -> "4.2m", 950000 -> "1.0m". */
function formatAmountM(v){
  const m = v / 1000000;
  return m.toFixed(1) + 'm';
}

function trendPeriodLabel(year, month){
  return month ? (MONTH_ABBR[Number(month) - 1] + ' ' + year) : ('Year ' + year);
}

/* Year options only ever list years for which OT data has actually been
   found (trendKnownYears), instead of a fixed trailing range - e.g. today
   only "2026" shows up until data exists in another year. The current year
   is always present since trendKnownYears is seeded with it at startup. */
function trendYearOptions(){
  return Array.from(trendKnownYears).sort((a, b) => b - a);
}

function trendMonthSelectHtml(id, selectedMonth, disabled){
  const opts = ['<option value="">All months</option>']
    .concat(MONTH_ABBR.map((m, i) => `<option value="${i+1}" ${Number(selectedMonth)===i+1?'selected':''}>${m}</option>`));
  return `<select id="${id}" ${disabled?'disabled':''}>${opts.join('')}</select>`;
}

/* Same as trendMonthSelectHtml but always requires one specific month picked
   (no "All months" option) - used by the QA Detail box, whose day-by-day row
   needs exactly one month to enumerate days for. */
function trendMonthSelectHtmlRequired(id, selectedMonth, disabled){
  const opts = MONTH_ABBR.map((m, i) => `<option value="${i+1}" ${Number(selectedMonth)===i+1?'selected':''}>${m}</option>`);
  return `<select id="${id}" ${disabled?'disabled':''}>${opts.join('')}</select>`;
}

function trendYearSelectHtml(id, selectedYear, disabled){
  const opts = trendYearOptions().map(y => `<option value="${y}" ${Number(selectedYear)===y?'selected':''}>${y}</option>`);
  return `<select id="${id}" ${disabled?'disabled':''}>${opts.join('')}</select>`;
}

/* Fixed, alphabetically-sorted list of the 12 QA(Staff) teams (Own Team,
   normalized so MW Colorist/F6-F7 Colorist -> "Colorist" and MW Lab/F7 Lab
   -> "Lab"), derived from Emp IDs whose EMP_LIST category is "Staff" only -
   Worker-only teams (PSC/SOP/FQC groups) are excluded. Used to populate the
   QA Detail Team dropdown. */
function staffDetailTeamOptions(){
  const teams = new Set();
  EMP_LIST.filter(e => e.category === 'Staff').forEach(e => {
    teams.add(normalizeTeamName(TEAM_MAP[e.id] || ''));
  });
  return Array.from(teams).sort((a, b) => a.localeCompare(b));
}

/* Deduped, name-sorted list of QA(Staff) people (by Emp ID) for the QA Detail
   Full Name filter, optionally narrowed to one normalized Own Team. Keyed the
   same way as buildStaffDetailData/buildWorkerEmpSeries. */
function staffDetailPeopleOptions(team){
  const seen = new Map();
  EMP_LIST.filter(e => e.category === 'Staff').forEach(e => {
    if(team && normalizeTeamName(TEAM_MAP[e.id] || '') !== team) return;
    const key = (e.id || '').trim() || ('__' + (e.name || '').trim());
    if(!seen.has(key)) seen.set(key, e.name || e.id);
  });
  return Array.from(seen.entries())
    .map(([key, name]) => ({ key, name }))
    .sort((a, b) => a.name.localeCompare(b.name));
}

/* Sorted list of the QA(Worker) positions (PSC / SOP / FQC, normalized from
   their Own Team string), derived from Emp IDs whose EMP_LIST category is
   "Worker" only. Used to populate the QA(Worker) Detail Position dropdown. */
function workerDetailPositionOptions(){
  const positions = new Set();
  EMP_LIST.filter(e => e.category === 'Worker').forEach(e => {
    positions.add(normalizeWorkerPosition(TEAM_MAP[e.id] || ''));
  });
  return Array.from(positions).sort((a, b) => a.localeCompare(b));
}

/* Deduped, name-sorted list of QA(Worker) people (by Emp ID) for the
   QA(Worker) Detail Full Name filter, optionally narrowed to one Position.
   Keyed the same way as buildWorkerEmpSeries/buildWorkerDetailData. */
function workerDetailPeopleOptions(position){
  const seen = new Map();
  EMP_LIST.filter(e => e.category === 'Worker').forEach(e => {
    if(position && normalizeWorkerPosition(TEAM_MAP[e.id] || '') !== position) return;
    const key = (e.id || '').trim() || ('__' + (e.name || '').trim());
    if(!seen.has(key)) seen.set(key, e.name || e.id);
  });
  return Array.from(seen.entries())
    .map(([key, name]) => ({ key, name }))
    .sort((a, b) => a.name.localeCompare(b.name));
}

/* Renders one numeric row-table for the QA Detail box: a header row of column
   labels (days or months) plus an Hour row and an Amount row. Missing values
   (day/month not reached yet) render as "-". When sumHour/sumAmount are
   passed, an extra "Sum" column is appended after the last day/month column. */
function qaDetailTableHtml(colLabel, headers, hourRow, amountRow, sumHour, sumAmount){
  const fmtH = v => v === null ? '-' : v.toFixed(1);
  const fmtA = v => v === null ? '-' : Math.round(v).toLocaleString('en-US');
  const hasSum = sumHour !== undefined;
  const sumHeaderCell = hasSum ? `<th class="qa-detail-sum-col">Sum</th>` : '';
  const sumHourCell = hasSum ? `<td class="qa-detail-sum-col">${fmtH(sumHour)}</td>` : '';
  const sumAmountCell = hasSum ? `<td class="qa-detail-sum-col">${fmtA(sumAmount)}</td>` : '';
  return `
    <div class="qa-detail-scroll">
      <table class="qa-detail-table">
        <thead><tr><th>${esc(colLabel)}</th>${headers.map(h => `<th>${esc(String(h))}</th>`).join('')}${sumHeaderCell}</tr></thead>
        <tbody>
          <tr><td>Hour</td>${hourRow.map(v => `<td>${fmtH(v)}</td>`).join('')}${sumHourCell}</tr>
          <tr><td>Amount</td>${amountRow.map(v => `<td>${fmtA(v)}</td>`).join('')}${sumAmountCell}</tr>
        </tbody>
      </table>
    </div>
  `;
}

    if(state.category === cat) return;

    state.confirmingReject = false;
    state.showSignOffActions = false;
    state.exportMsg = '';
    state.formError = '';
    state.form = { idCode:'', fullName:'', otFrom:'', otTo:'', requestedBy:'', remark:'', factory:'', ownTeam:'' };
    state.empSuggestOpen = false;
    if(cat === 'DailySummary'){
      state.dailySummary.loading = true;
      loadDailySummary(false);
    } else if(cat === 'WeeklySummary'){
      state.weeklySummary.loading = true;
      loadWeeklySummary(false);
    } else if(cat === 'Trend'){
      // Moi lan mo lai tab Trend: coi du lieu hom nay la co the da cu (vd
      // vua nhap/sua OT o tab khac), nen xoa cache cua hom nay va load lai -
      // cac ngay khac van dung cache san co nen khong bi cham lai nhu truoc.
      if(state.trend.unlocked){
        invalidateTrendCacheForToday();

      } else {
        render();

      state.loading = true;
      loadData(false);

  };

  if(tr.loading) return;

  const staffPeriodYearSel = document.getElementById('staffPeriodYearSel');
  if(staffPeriodYearSel) staffPeriodYearSel.onchange = (e)=>{ tr.staffPeriod.year = Number(e.target.value); loadTrendData(); };
  const staffPeriodMonthSel = document.getElementById('staffPeriodMonthSel');
  if(staffPeriodMonthSel) staffPeriodMonthSel.onchange = (e)=>{ tr.staffPeriod.month = e.target.value ? Number(e.target.value) : ''; loadTrendData(); };

  const staffDetailYearSel = document.getElementById('staffDetailYearSel');
  if(staffDetailYearSel) staffDetailYearSel.onchange = (e)=>{ tr.staffDetail.year = Number(e.target.value); loadTrendData(); };
  const staffDetailMonthSel = document.getElementById('staffDetailMonthSel');
  if(staffDetailMonthSel) staffDetailMonthSel.onchange = (e)=>{ tr.staffDetail.month = Number(e.target.value); loadTrendData(); };
  const staffDetailTeamSel = document.getElementById('staffDetailTeamSel');
  if(staffDetailTeamSel) staffDetailTeamSel.onchange = (e)=>{
    tr.staffDetail.team = e.target.value || '';
    // Clear the selected person if they don't belong to the newly picked team.
    const stillValid = staffDetailPeopleOptions(tr.staffDetail.team).some(p => p.key === tr.staffDetail.fullName);
    if(!stillValid) tr.staffDetail.fullName = '';
    render();
  };
  const staffDetailNameSel = document.getElementById('staffDetailNameSel');
  if(staffDetailNameSel) staffDetailNameSel.onchange = (e)=>{ tr.staffDetail.fullName = e.target.value || ''; render(); };

  const workerWeekFromSel = document.getElementById('workerWeekFromSel');
  if(workerWeekFromSel) workerWeekFromSel.onchange = (e)=>{ if(e.target.value){ tr.workerWeek.from = e.target.value; loadTrendData(); } };
  const workerWeekToSel = document.getElementById('workerWeekToSel');
  if(workerWeekToSel) workerWeekToSel.onchange = (e)=>{ if(e.target.value){ tr.workerWeek.to = e.target.value; loadTrendData(); } };

  const workerMonthYearSel = document.getElementById('workerMonthYearSel');
  if(workerMonthYearSel) workerMonthYearSel.onchange = (e)=>{ tr.workerMonth.year = Number(e.target.value); loadTrendData(); };
  const workerMonthMonthSel = document.getElementById('workerMonthMonthSel');
  if(workerMonthMonthSel) workerMonthMonthSel.onchange = (e)=>{ tr.workerMonth.month = e.target.value ? Number(e.target.value) : ''; loadTrendData(); };

  const workerYearYearSel = document.getElementById('workerYearYearSel');
  if(workerYearYearSel) workerYearYearSel.onchange = (e)=>{ tr.workerYear.year = Number(e.target.value); loadTrendData(); };

  const workerDetailYearSel = document.getElementById('workerDetailYearSel');
  if(workerDetailYearSel) workerDetailYearSel.onchange = (e)=>{ tr.workerDetail.year = Number(e.target.value); loadTrendData(); };
  const workerDetailMonthSel = document.getElementById('workerDetailMonthSel');
  if(workerDetailMonthSel) workerDetailMonthSel.onchange = (e)=>{ tr.workerDetail.month = Number(e.target.value); loadTrendData(); };
  const workerDetailPositionSel = document.getElementById('workerDetailPositionSel');
  if(workerDetailPositionSel) workerDetailPositionSel.onchange = (e)=>{
    tr.workerDetail.position = e.target.value || '';
    // Clear the selected person if they don't belong to the newly picked position.
    const stillValid = workerDetailPeopleOptions(tr.workerDetail.position).some(p => p.key === tr.workerDetail.fullName);
    if(!stillValid) tr.workerDetail.fullName = '';
    render();
  };
  const workerDetailNameSel = document.getElementById('workerDetailNameSel');
  if(workerDetailNameSel) workerDetailNameSel.onchange = (e)=>{ tr.workerDetail.fullName = e.target.value || ''; render(); };

  if(showCharts){
    drawTrendChart('trendStaffHourChart', staffHourSeries, 'value', {
      label: 'Hours',
      color: 'rgba(47,111,237,0.65)',
      tooltipFormat: v => v.toFixed(1) + 'h',
      dataLabelFormat: v => v.toFixed(1),
      refValue: staffHourTeamAvg,
      refColor: '#000000',
      refLabelFormat: v => 'Avg ' + v.toFixed(1) + 'h'
    });
    drawTrendChart('trendStaffAmountChart', staffAmountSeries, 'value', {
      label: 'Amount',
      color: 'rgba(21,128,61,0.65)',
      tooltipFormat: v => Math.round(v).toLocaleString('en-US'),
      dataLabelFormat: v => formatAmountM(v),
      yTickFormat: v => formatAmountM(v),
      refValue: staffAmountTeamAvg,
      refColor: '#000000',
      refLabelFormat: v => 'Avg ' + formatAmountM(v)
    });
    drawTrendChart('trendStaffAverageChart', staffAverageSeries, 'value', {
      label: 'Average Hour',
      color: 'rgba(47,111,237,0.65)',
      tooltipFormat: v => v.toFixed(1) + 'h',
      dataLabelFormat: v => v.toFixed(1),
      refValue: staffOverallHourPerTurn,
      refColor: '#000000',
      refLabelFormat: v => 'Avg ' + v.toFixed(1) + 'h'
    });
    drawTrendChart('trendWorkerWeekChart', workerWeekSeries, 'value', {
      label: 'Hours',
      color: 'rgba(253,186,116,0.8)',
      tooltipFormat: v => v.toFixed(1) + 'h',
      dataLabelFormat: v => v.toFixed(1),
      refValue: TREND_WORKER_MAX.week,
      refColor: '#dc2626',
      refLabelFormat: v => 'Max ' + v + 'h'
    });
    drawTrendChart('trendWorkerMonthChart', workerMonthSeries, 'value', {
      label: 'Hours',
      color: 'rgba(249,115,22,0.8)',
      tooltipFormat: v => v.toFixed(1) + 'h',
      dataLabelFormat: v => v.toFixed(1),
      refValue: TREND_WORKER_MAX.month,
      refColor: '#dc2626',
      refLabelFormat: v => 'Max ' + v + 'h'
    });
    drawTrendChart('trendWorkerYearChart', workerYearSeries, 'value', {
      label: 'Hours',
      color: 'rgba(154,52,18,0.85)',
      tooltipFormat: v => v.toFixed(1) + 'h',
      dataLabelFormat: v => v.toFixed(1),
      refValue: TREND_WORKER_MAX.year,
      refColor: '#dc2626',
      refLabelFormat: v => 'Max ' + v + 'h'
    });
  } else if(!tr.loaded && !tr.loading){
    loadTrendData();
  }
}

document.addEventListener('click', (e)=>{
  if(state.empSuggestOpen && !e.target.closest('.autocomplete-wrap')){
    state.empSuggestOpen = false;
    render();
  }
});
document.addEventListener('touchend', (e)=>{
  if(state.empSuggestOpen && !e.target.closest('.autocomplete-wrap')){
    state.empSuggestOpen = false;
    render();
  }
});

render();
loadData(false);
startPolling();
</script>
