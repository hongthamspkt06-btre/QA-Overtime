  if(rb) rb.onclick = ()=>runManualRefresh(state, ()=>loadData(true));

  const exb = document.getElementById('exportBtn');
  if(exb) exb.onclick = exportExcel;

  const idCodeEl = document.getElementById('f_idCode');
  if(idCodeEl){
    idCodeEl.oninput = (e)=>{
      const val = e.target.value;
      const caretPos = e.target.selectionStart;
      state.form.idCode = val;
      state.empSuggestOpen = true;
      if(EMP_MAP[val]){
        state.form.fullName = EMP_MAP[val];
      }
      state.form.ownTeam = TEAM_MAP[val] || '';
      render();
      // Restore caret synchronously (same tick as render) so fast typing
      // can never race with a deferred setTimeout and get the cursor
      // reset to the start of the field (which previously caused newly
      // typed digits to be inserted before existing ones, e.g. typing
      // "56" would end up showing "65").
      const el = document.getElementById('f_idCode');
      if(el){ el.focus(); el.setSelectionRange(caretPos, caretPos); }
    };
    idCodeEl.onfocus = ()=>{
      // Guard: our own oninput handler already sets empSuggestOpen=true and
      // calls render() before programmatically re-focusing the field to
      // restore the caret. Without this guard, that programmatic focus()
      // would re-trigger this onfocus handler, which would render() again
      // and call focus() a second time WITHOUT restoring the caret -
      // silently snapping the cursor back to position 0 after every
      // keystroke (this was the real cause of digits appearing reversed /
      // the cursor jumping to the front of the field while typing).
      if(state.empSuggestOpen) return;
      state.empSuggestOpen = true;
      render();
      const el = document.getElementById('f_idCode');
      if(el){ el.focus(); const p = el.value.length; el.setSelectionRange(p, p); }
    };
  }
  document.querySelectorAll('.empSuggestItem').forEach(item=>{
    item.onmousedown = (e)=>{
      e.preventDefault();

      state.form.fullName = name;
      state.form.ownTeam = TEAM_MAP[id] || '';
      state.empSuggestOpen = false;
      render();
    };
  });

  const fullNameEl = document.getElementById('f_fullName');
  if(fullNameEl) fullNameEl.oninput = (e)=>{ state.form.fullName = e.target.value; };

  const fromEl = document.getElementById('f_otFrom');

  const toEl = document.getElementById('f_otTo');
  if(toEl) toEl.onchange = (e)=>{ state.form.otTo = e.target.value; };

  const factoryEl = document.getElementById('f_factory');
  if(factoryEl) factoryEl.onchange = (e)=>{ state.form.factory = e.target.value; };

  const reqByEl = document.getElementById('f_requestedBy');
  if(reqByEl) reqByEl.onchange = (e)=>{ state.form.requestedBy = e.target.value; };

  const remarkEl = document.getElementById('f_remark');
  if(remarkEl) remarkEl.onchange = (e)=>{ state.form.remark = e.target.value; };

  const ab = document.getElementById('addBtn');
  if(ab) ab.onclick = addRow;

  document.querySelectorAll('.delRowBtn').forEach(btn=>{
    btn.onclick = ()=>{
      state.confirmingDeleteId = btn.getAttribute('data-id');
      state.confirmingDeleteName = btn.getAttribute('data-name') || '';
      render();
    };
  });

  const delYes = document.getElementById('deleteYesBtn');
  if(delYes) delYes.onclick = async ()=>{
    const id = state.confirmingDeleteId;
    state.confirmingDeleteId = null;
    state.confirmingDeleteName = '';
    render();
    if(id) await deleteRow(id);
  };
  const delNo = document.getElementById('deleteNoBtn');
  if(delNo) delNo.onclick = ()=>{
    state.confirmingDeleteId = null;
    state.confirmingDeleteName = '';
    render();
  };

  const sob = document.getElementById('signOffBtn');
  if(sob) sob.onclick = askSignConfirm;

  const sy = document.getElementById('signYes');
  if(sy) sy.onclick = confirmSignPassword;
  const sn = document.getElementById('signNo');
  if(sn) sn.onclick = cancelSignConfirm;
  const pwf = document.getElementById('pwField');
  if(pwf){ pwf.oninput = (e)=>{ state.pwInput = e.target.value; }; pwf.onkeydown = (e)=>{ if(e.key==='Enter') confirmSignPassword(); }; }

  const apb = document.getElementById('approveBtn');
  if(apb) apb.onclick = doSignApprove;
  const nsb = document.getElementById('notSignBtn');
  if(nsb) nsb.onclick = askRejectConfirm;
  const cab = document.getElementById('cancelActionBtn');
  if(cab) cab.onclick = cancelSignOffActions;

  const rjy = document.getElementById('rejectYes');
  if(rjy) rjy.onclick = doRejectApprove;
  const rjcb = document.getElementById('rejectCancelBtn');
  if(rjcb) rjcb.onclick = cancelRejectConfirm;
  const rjc = document.getElementById('rejectCommentField');
  if(rjc){ rjc.oninput = (e)=>{ state.rejectComment = e.target.value; }; }

  const ub = document.getElementById('unlockBtn');
  if(ub) ub.onclick = askUnlockConfirm;
  const uy = document.getElementById('unlockYes');
  if(uy) uy.onclick = doUnlockApprove;
  const un = document.getElementById('unlockNo');

  if(pwfu){ pwfu.oninput = (e)=>{ state.pwInput = e.target.value; }; pwfu.onkeydown = (e)=>{ if(e.key==='Enter') doUnlockApprove(); }; }

  restoreScrollPositions();
}

function computeDailyAutoOverlap(){
  const allRows = (state.dailySummary.staffRows || []).concat(state.dailySummary.workerRows || []);
  const counts = {};
  allRows.forEach(r => {
    const id = (r.idCode || '').trim();
    if(!id) return;
    counts[id] = (counts[id] || 0) + 1;
  });
  const dupIds = Object.keys(counts).filter(id => counts[id] > 1).sort();
  const extra = dupIds.reduce((s, id) => s + (counts[id] - 1), 0);
  return { dupIds, extra };
}

function renderDailySummaryTable(){
  const groups = buildDailySummaryGroups();
  const ds = state.dailySummary;

  if(groups.length === 0){
    return `<div class="panel"><div class="empty-state">Chưa có dữ liệu OT (Staff/Worker) cho ngày ${fmtDate(state.date)}.</div></div>`;
  }

  let bodyHtml = '';
  let grandQty = 0;

  groups.forEach(g => {
    const meta = ds.meta[g.factory] || {};
    const factoryRowSpan = g.teams.reduce((s,t)=>s+t.supportGroups.reduce((s2,sg)=>s2+Math.max(sg.otRows.length,1), 0), 0);
    let isFactoryFirstRow = true;

    g.teams.forEach(t => {
      const teamRowSpan = t.supportGroups.reduce((s2,sg)=>s2+Math.max(sg.otRows.length,1), 0);
      let isTeamFirstRow = true;

      t.supportGroups.forEach(sg => {
        const otRows = sg.otRows.length ? sg.otRows : [{ ot:'', qty: sg.qty, reason: sg.reason }];

        otRows.forEach((otRow, idx) => {
          grandQty += otRow.qty;
          bodyHtml += '<tr>';

          if(isFactoryFirstRow){
            bodyHtml += `<td class="ds-factory" rowspan="${factoryRowSpan}">${esc(g.factory)}</td>`;
            bodyHtml += `<td rowspan="${factoryRowSpan}"><input type="text" class="ds-input" data-factory="${esc(g.factory)}" data-field="majorFacOT" value="${esc(meta.majorFacOT||'')}" placeholder="-"></td>`;
            bodyHtml += `<td rowspan="${factoryRowSpan}"><input type="text" class="ds-input" data-factory="${esc(g.factory)}" data-field="maxFacOT" value="${esc(meta.maxFacOT||'')}" placeholder="-"></td>`;
          }

          if(isTeamFirstRow){
            bodyHtml += `<td class="ds-left" rowspan="${teamRowSpan}">${esc(t.ownTeam)}</td>`;
          }

          if(idx === 0){
            bodyHtml += `<td class="ds-left" rowspan="${otRows.length}">${esc(sg.supportTeam)}</td>`;
          }

          if(isTeamFirstRow){
            const picVal = (meta.picByTeam && meta.picByTeam[t.ownTeam]) || '';
            bodyHtml += `<td rowspan="${teamRowSpan}"><input type="text" class="ds-input" data-factory="${esc(g.factory)}" data-team="${esc(t.ownTeam)}" data-field="pic" value="${esc(picVal)}" placeholder="-"></td>`;
          }

          bodyHtml += `<td>${esc(otRow.ot)}</td>`;
          bodyHtml += `<td>${otRow.qty}</td>`;

          if(isTeamFirstRow){
            bodyHtml += `<td rowspan="${teamRowSpan}">${t.total}</td>`;
          }

          if(t.mergedReason !== null){
            if(isTeamFirstRow){
              bodyHtml += `<td class="ds-left" rowspan="${teamRowSpan}">${esc(t.mergedReason)}</td>`;
            }
          } else {
            bodyHtml += `<td class="ds-left">${esc(otRow.reason)}</td>`;
          }

          bodyHtml += '</tr>';
          isFactoryFirstRow = false;
          isTeamFirstRow = false;
        });
      });
    });
  });

  const { extra: autoExtra } = computeDailyAutoOverlap();
  const autoTotal = grandQty - autoExtra;

  return `
    <div class="panel" style="padding:0;overflow:hidden;">
      <div style="padding:14px 16px 6px;">
        <div class="panel-title" style="margin-bottom:0;">Overtime Status &mdash; ${fmtDate(state.date)}</div>
      </div>
      <div class="table-scroll">
      <table class="ds-table" id="dsTable">
        <thead><tr>
          <th>Factory</th>
          <th>Major Fac OT</th>
          <th>Max Fac OT</th>
          <th>Own Team</th>
          <th>Support Team</th>
          <th>PIC</th>
          <th>OT</th>
          <th>Q'ty</th>
          <th>Total</th>
          <th>Reason</th>
        </tr></thead>
        <tbody>${bodyHtml}</tbody>
        <tfoot>
          <tr>
            <td colspan="7">Total</td>
            <td>${grandQty}</td>
            <td>${autoTotal}</td>
            <td class="ds-left">${autoExtra > 0 ? `${autoExtra}* Overlap` : ''}</td>
          </tr>
        </tfoot>
      </table>
      </div>
    </div>
  `;
}

function exportDailySummaryExcel(){
  const groups = buildDailySummaryGroups();
  if(groups.length === 0){ alert('Chưa có dữ liệu để xuất Excel.'); return; }
  const ds = state.dailySummary;

  const aoa = [['Factory','Major Fac OT','Max Fac OT','Own Team','Support Team','PIC','OT',"Q'ty",'Total','Reason']];
  const merges = [];
  let rowIdx = 1; // row 0 = header
  let grandQty = 0;

  groups.forEach(g => {
    const meta = ds.meta[g.factory] || {};
    const factoryRowSpan = g.teams.reduce((s,t)=>s+t.supportGroups.reduce((s2,sg)=>s2+Math.max(sg.otRows.length,1), 0), 0);
    const factoryStartRow = rowIdx;

    g.teams.forEach(t => {
      const teamRowSpan = t.supportGroups.reduce((s2,sg)=>s2+Math.max(sg.otRows.length,1), 0);
      const teamStartRow = rowIdx;
      const picVal = (meta.picByTeam && meta.picByTeam[t.ownTeam]) || '';

      t.supportGroups.forEach(sg => {
        const otRows = sg.otRows.length ? sg.otRows : [{ ot:'', qty: sg.qty, reason: sg.reason }];
        const sgStartRow = rowIdx;

        otRows.forEach(otRow => {
          grandQty += otRow.qty;
          aoa.push([
            g.factory,
            meta.majorFacOT || '',
            meta.maxFacOT || '',
            t.ownTeam,
            sg.supportTeam,
            picVal,
            otRow.ot,
            otRow.qty,
            t.total,
            otRow.reason
          ]);
          rowIdx++;
        });

        if(otRows.length > 1){
          merges.push({ s:{r:sgStartRow,c:4}, e:{r:sgStartRow+otRows.length-1,c:4} }); // Support Team
        }
      });

      if(teamRowSpan > 1){
        merges.push({ s:{r:teamStartRow,c:3}, e:{r:teamStartRow+teamRowSpan-1,c:3} }); // Own Team
        merges.push({ s:{r:teamStartRow,c:5}, e:{r:teamStartRow+teamRowSpan-1,c:5} }); // PIC
        merges.push({ s:{r:teamStartRow,c:8}, e:{r:teamStartRow+teamRowSpan-1,c:8} }); // Total
        // Reason column (9) is intentionally never merged — each row keeps its own value.
      }
    });

    if(factoryRowSpan > 1){
      merges.push({ s:{r:factoryStartRow,c:0}, e:{r:factoryStartRow+factoryRowSpan-1,c:0} }); // Factory
      merges.push({ s:{r:factoryStartRow,c:1}, e:{r:factoryStartRow+factoryRowSpan-1,c:1} }); // Major Fac OT
      merges.push({ s:{r:factoryStartRow,c:2}, e:{r:factoryStartRow+factoryRowSpan-1,c:2} }); // Max Fac OT
    }
  });

  const { extra } = computeDailyAutoOverlap();
  const autoTotal = grandQty - extra;
  const totalRowIdx = aoa.length;
  aoa.push(['Total', '', '', '', '', '', '', grandQty, autoTotal, extra > 0 ? (extra + '* Overlap') : '']);
  merges.push({ s:{r:totalRowIdx,c:0}, e:{r:totalRowIdx,c:6} }); // "Total" label spans Factory..Q'ty

  const wsSheet = XLSX.utils.aoa_to_sheet(aoa);
  wsSheet['!merges'] = merges;
  wsSheet['!cols'] = [{wch:14},{wch:12},{wch:12},{wch:14},{wch:14},{wch:14},{wch:8},{wch:6},{wch:8},{wch:28}];
  wsSheet['!rows'] = aoa.map(()=>({hpt:20}));

  // "All Borders" style (Excel default): solid black thin border on every cell.
  const thinBorder = { style:'thin', color:{ rgb:'FF000000' } };
  const range = XLSX.utils.decode_range(wsSheet['!ref']);
  for(let r = range.s.r; r <= range.e.r; r++){
    for(let c = range.s.c; c <= range.e.c; c++){
      const ref = XLSX.utils.encode_cell({ r, c });
      if(!wsSheet[ref]) continue;
      const isHeader = r === 0;
      const isTotal = r === totalRowIdx;
      wsSheet[ref].s = {
        font: { bold: isHeader || isTotal, color: isHeader ? { rgb:'FFFFFFFF' } : { rgb:'FF1A1A1A' } },
        fill: isHeader ? { patternType:'solid', fgColor:{ rgb:'FF2F6FED' } } : (isTotal ? { patternType:'solid', fgColor:{ rgb:'FFEAF0FF' } } : undefined),
        alignment: { horizontal:'center', vertical:'center', wrapText:true },
        border: { top:thinBorder, bottom:thinBorder, left:thinBorder, right:thinBorder }
      };
    }
  }

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsSheet, 'Daily Summary');
  XLSX.writeFile(wb, 'Daily_Summary_' + state.date + '.xlsx');
}

function exportWeeklySummaryExcel(){

    totalHour += r.hourTotal;

  });

  const dayTotals = buildWeeklyDayTotals();
  const totalRowIdx = aoa.length;
  aoa.push(['Total', '', '', '', r1(totalHour), Math.round(totalAmount),
    ...dayTotals.map(dt => r1(dt.hourSum) + 'h / ' + Math.round(dt.amountSum).toLocaleString('en-US'))]);

  const wsSheet = XLSX.utils.aoa_to_sheet(aoa);
  wsSheet['!merges'] = [{ s:{r:totalRowIdx,c:0}, e:{r:totalRowIdx,c:3} }];
  wsSheet['!cols'] = [{wch:6},{wch:16},{wch:12},{wch:30},{wch:12},{wch:15},{wch:14},{wch:14},{wch:14},{wch:14},{wch:14},{wch:14}];

  const thin = { style:'thin', color:{ rgb:'FF000000' } };

  for(let r = range.s.r; r <= range.e.r; r++){
    for(let c = range.s.c; c <= range.e.c; c++){
      const ref = XLSX.utils.encode_cell({ r, c });
      if(!wsSheet[ref]) wsSheet[ref] = { t:'s', v:'' };
      const isHeader = r === 0;
      const isTotal = r === totalRowIdx;
      const leftAlign = !isHeader && !isTotal && (c === 1 || c === 3);
      if(!isHeader && c === 5 && typeof wsSheet[ref].v === 'number') wsSheet[ref].z = '#,##0';
      wsSheet[ref].s = {
        font: { bold: isHeader || isTotal, color: isHeader ? { rgb:'FFFFFFFF' } : { rgb:'FF1A1A1A' } },
        fill: isHeader ? { patternType:'solid', fgColor:{ rgb:'FF2F6FED' } } : (isTotal ? { patternType:'solid', fgColor:{ rgb:'FFEAF0FF' } } : undefined),
        alignment: { horizontal: leftAlign ? 'left' : 'center', vertical:'center', wrapText:true },
        border: { top:thin, bottom:thin, left:thin, right:thin }
      };
    }
  }

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsSheet, 'Weekly Summary');
  XLSX.writeFile(wb, 'Weekly_Summary_' + ws.from + '_to_' + ws.to + '.xlsx');
}

/* ====== Trend tab: password-gated OT trend charts ====== */

/* Fixed OT-hour ceilings for the QA(Worker) trend charts - always drawn as a
   dashed red reference line regardless of what the actual data shows. */
const TREND_WORKER_MAX = { week: 12, month: 40, year: 300 };

/* Average of the entered values in a Trend series (used for the QA(Staff)
   dashed black average line). Returns null when there is no data, so the
   caller can skip drawing the reference line entirely. */
function trendAverage(series){
  const vals = (series || []).map(s => s.value).filter(v => v !== null && v !== undefined && isFinite(v));
  if(!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function drawTrendChart(canvasId, series, valueKey, opts){
  const canvasEl = document.getElementById(canvasId);
  if(!canvasEl || typeof Chart === 'undefined') return;
  if(trendCharts[canvasId]){ trendCharts[canvasId].destroy(); delete trendCharts[canvasId]; }

  const labels = series.map(s => s.shortLabel || s.label);
  const hasShort = series.some(s => s.shortLabel);
  const data = series.map(s => s[valueKey]);
  const refValue = opts.refValue;
  const hasRef = refValue !== null && refValue !== undefined && isFinite(refValue);
  // Per-bar reference values (e.g. average / turn of EACH team), drawn as a
  // short bold segment across that bar's own width instead of one line
  // spanning the whole chart. Parallel array to `series`.
  const refValues = opts.refValues;
  const hasPerBarRef = Array.isArray(refValues);
  const finitePerBarRefs = hasPerBarRef ? refValues.filter(v => v !== null && v !== undefined && isFinite(v)) : [];
  const maxPerBarRef = finitePerBarRefs.length ? Math.max(...finitePerBarRefs) : 0;
  // Ensure the axis always extends past the reference value so the dashed
  // line (e.g. the Worker max) stays visible even when every bar sits well
  // below it, instead of being clipped off the top of the chart.
  const maxData = data.length ? Math.max(...data.filter(v => v !== null && v !== undefined && isFinite(v)), 0) : 0;
  const refCeil = hasRef ? refValue : (finitePerBarRefs.length ? maxPerBarRef : 0);
  const suggestedMax = (hasRef || finitePerBarRefs.length) ? Math.max(maxData, refCeil) * 1.15 : undefined;

  const refLinePlugin = {
    id: 'refLine_' + canvasId,
    afterDraw(chart){
      if(!hasRef) return;
      const { ctx, chartArea, scales } = chart;
      if(!chartArea || !scales.y) return;
      const yPos = scales.y.getPixelForValue(refValue);
      if(yPos < chartArea.top - 1 || yPos > chartArea.bottom + 1) return;
      ctx.save();
      ctx.beginPath();
      ctx.setLineDash([6, 4]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = opts.refColor || '#dc2626';
      ctx.moveTo(chartArea.left, yPos);
      ctx.lineTo(chartArea.right, yPos);
      ctx.stroke();

      if(opts.refLabelFormat){
        const label = opts.refLabelFormat(refValue);
        ctx.setLineDash([]);
        ctx.font = '700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';
        const textW = ctx.measureText(label).width;
        const padX = 4, padY = 2;
        const boxX = chartArea.right - textW - padX * 2 - 2;
        // Keep the label's box just above the line unless that would push it
        // off the top of the chart area, in which case drop it below instead.
        const above = (yPos - 14 - padY * 2) >= chartArea.top;
        const boxY = above ? (yPos - 14 - padY * 2) : (yPos + 4);
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fillRect(boxX, boxY, textW + padX * 2, 12 + padY * 2);
        ctx.fillStyle = opts.refColor || '#dc2626';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(label, boxX + padX, boxY + padY);
      }
      ctx.restore();
    }
  };

  // Draws each team's own average as a short, bold, solid black segment that
  // spans only that bar's width (not a line across the whole chart), with a
  // small data label above it - e.g. the "Giờ trung bình / 1 lượt" average
  // per team on the Hour/Amount by Team charts.
  const perBarRefPlugin = {
    id: 'perBarRef_' + canvasId,
    afterDatasetsDraw(chart){
      if(!hasPerBarRef) return;
      const { ctx, chartArea, scales } = chart;
      if(!chartArea || !scales.y) return;
      const meta = chart.getDatasetMeta(0);
      ctx.save();
      meta.data.forEach((bar, i) => {
        const rv = refValues[i];
        if(rv === null || rv === undefined || !isFinite(rv)) return;
        const yPos = scales.y.getPixelForValue(rv);
        if(yPos < chartArea.top - 1 || yPos > chartArea.bottom + 1) return;
        const halfW = (bar.width || 24) / 2;
        const x1 = bar.x - halfW;
        const x2 = bar.x + halfW;

        ctx.beginPath();
        ctx.setLineDash([]);
        ctx.lineWidth = opts.refLineWidth || 3;
        ctx.strokeStyle = opts.refColor || '#000000';
        ctx.lineCap = 'butt';
        ctx.moveTo(x1, yPos);
        ctx.lineTo(x2, yPos);
        ctx.stroke();

        if(opts.refLabelFormat){
          const label = opts.refLabelFormat(rv);
          ctx.font = '700 9px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';
          const textW = ctx.measureText(label).width;
          const padX = 3, padY = 1;
          // Keep the label just above its own segment unless that would push
          // it off the top of the chart area, in which case drop it below.
          const above = (yPos - 12 - padY * 2) >= chartArea.top;
          const boxY = above ? (yPos - 12 - padY * 2) : (yPos + 3);
          const boxX = bar.x - (textW + padX * 2) / 2;
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.fillRect(boxX, boxY, textW + padX * 2, 10 + padY * 2);
          ctx.fillStyle = opts.refColor || '#000000';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'top';
          ctx.fillText(label, boxX + padX, boxY + padY);
        }
      });
      ctx.restore();
    }
  };

  const dataLabelPlugin = {
    id: 'dataLabels_' + canvasId,
    afterDatasetsDraw(chart){
      const { ctx } = chart;
      const meta = chart.getDatasetMeta(0);
      ctx.save();
      ctx.font = '600 ' + (opts.dataLabelFontSize || 10) + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';
      ctx.fillStyle = '#20242c';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      meta.data.forEach((bar, i) => {
        const val = data[i];
        if(val === undefined || val === null || !isFinite(val)) return;
        // Data labels always show a plain number (no unit suffix like "h"),
        // independent of the tooltip's formatting.
        const label = opts.dataLabelFormat ? opts.dataLabelFormat(val) : (Math.round(val * 10) / 10);
        ctx.fillText(label, bar.x, bar.y - 4);
      });
      ctx.restore();
    }
  };

  trendCharts[canvasId] = new Chart(canvasEl, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: opts.label || '',
        data,
        backgroundColor: opts.color || 'rgba(47,111,237,0.65)',
        borderRadius: 3,
        maxBarThickness: 34
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 250 },
      layout: { padding: { top: 18 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title(items){ const sr = series[items[0].dataIndex]; return sr ? sr.label : ''; },
            label(item){ return opts.tooltipFormat ? opts.tooltipFormat(item.parsed.y) : item.parsed.y; }
          }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: hasShort ? { font: { size: 9 }, maxRotation: 0, minRotation: 0, autoSkip: false } : { font: { size: 10 } } },
        y: { beginAtZero: true, min: (opts.yMax !== undefined ? 0 : undefined), max: opts.yMax, suggestedMax: (opts.yMax !== undefined ? undefined : suggestedMax), grid: { color: '#eef0f2' }, ticks: { font: { size: 10 }, maxTicksLimit: 5, stepSize: opts.yStep, callback: opts.yTickFormat ? (v => opts.yTickFormat(v)) : undefined } }
      }
    },
    plugins: [refLinePlugin, perBarRefPlugin, dataLabelPlugin]
  });
}

/* Compact display for the "Total Amount by Team" chart, expressed in
   millions with one decimal, e.g. 4200000 -> "4.2m", 950000 -> "1.0m". */
function formatAmountM(v){
  const m = v / 1000000;
  return m.toFixed(1) + 'm';
}

function trendPeriodLabel(year, month){
  return month ? (MONTH_ABBR[Number(month) - 1] + ' ' + year) : ('Year ' + year);
}

/* Year options only ever list years for which OT data has actually been
   found (trendKnownYears), instead of a fixed trailing range - e.g. today
   only "2026" shows up until data exists in another year. The current year
   is always present since trendKnownYears is seeded with it at startup. */
function trendYearOptions(){
  return Array.from(trendKnownYears).sort((a, b) => b - a);
}

/* Fixed, alphabetically-sorted list of the 12 QA(Staff) teams (Own Team,
   normalized so MW Colorist/F6-F7 Colorist -> "Colorist" and MW Lab/F7 Lab
   -> "Lab"), derived from Emp IDs whose EMP_LIST category is "Staff" only -
   Worker-only teams (PSC/SOP/FQC groups) are excluded. Used to populate the
   QA Detail Team dropdown. */
function staffDetailTeamOptions(){
  const teams = new Set();
  EMP_LIST.filter(e => e.category === 'Staff').forEach(e => {
    teams.add(normalizeTeamName(TEAM_MAP[e.id] || ''));
  });
  return Array.from(teams).sort((a, b) => a.localeCompare(b));
}

/* Deduped, name-sorted list of QA(Staff) people (by Emp ID) for the QA Detail
   Full Name filter, optionally narrowed to one normalized Own Team. Keyed the
   same way as buildStaffDetailData/buildWorkerEmpSeries. */
function staffDetailPeopleOptions(team){
  const seen = new Map();
  EMP_LIST.filter(e => e.category === 'Staff').forEach(e => {
    if(team && normalizeTeamName(TEAM_MAP[e.id] || '') !== team) return;
    const key = (e.id || '').trim() || ('__' + (e.name || '').trim());
    if(!seen.has(key)) seen.set(key, e.name || e.id);
  });
  return Array.from(seen.entries())
    .map(([key, name]) => ({ key, name }))
    .sort((a, b) => a.name.localeCompare(b.name));
}

/* Sorted list of the QA(Worker) positions (PSC / SOP / FQC, normalized from
   their Own Team string), derived from Emp IDs whose EMP_LIST category is
   "Worker" only. Used to populate the QA(Worker) Detail Position dropdown. */
function workerDetailPositionOptions(){
  const positions = new Set();
  EMP_LIST.filter(e => e.category === 'Worker').forEach(e => {
    positions.add(normalizeWorkerPosition(TEAM_MAP[e.id] || ''));
  });
  return Array.from(positions).sort((a, b) => a.localeCompare(b));
}

/* Deduped, name-sorted list of QA(Worker) people (by Emp ID) for the
   QA(Worker) Detail Full Name filter, optionally narrowed to one Position.
   Keyed the same way as buildWorkerEmpSeries/buildWorkerDetailData. */
function workerDetailPeopleOptions(position){
  const seen = new Map();
  EMP_LIST.filter(e => e.category === 'Worker').forEach(e => {
    if(position && normalizeWorkerPosition(TEAM_MAP[e.id] || '') !== position) return;
    const key = (e.id || '').trim() || ('__' + (e.name || '').trim());
    if(!seen.has(key)) seen.set(key, e.name || e.id);
  });
  return Array.from(seen.entries())
    .map(([key, name]) => ({ key, name }))
    .sort((a, b) => a.name.localeCompare(b.name));
}

/* Renders one numeric row-table for the QA Detail box: a header row of column
   labels (days or months) plus an Hour row and an Amount row. Missing values
   (day/month not reached yet) render as "-". When sumHour/sumAmount are
   passed, an extra "Sum" column is appended after the last day/month column. */
function qaDetailTableHtml(colLabel, headers, hourRow, amountRow, sumHour, sumAmount){
  const fmtH = v => v === null ? '-' : v.toFixed(1);
  const fmtA = v => v === null ? '-' : Math.round(v).toLocaleString('en-US');
  const hasSum = sumHour !== undefined;
  const sumHeaderCell = hasSum ? `<th class="qa-detail-sum-col">Sum</th>` : '';
  const sumHourCell = hasSum ? `<td class="qa-detail-sum-col">${fmtH(sumHour)}</td>` : '';
  const sumAmountCell = hasSum ? `<td class="qa-detail-sum-col">${fmtA(sumAmount)}</td>` : '';
  return `
    <div class="qa-detail-scroll">
      <table class="qa-detail-table">
        <thead><tr><th>${esc(colLabel)}</th>${headers.map(h => `<th>${esc(String(h))}</th>`).join('')}${sumHeaderCell}</tr></thead>
        <tbody>
          <tr><td>Hour</td>${hourRow.map(v => `<td>${fmtH(v)}</td>`).join('')}${sumHourCell}</tr>
          ${amountRow ? `<tr><td>Amount</td>${amountRow.map(v => `<td>${fmtA(v)}</td>`).join('')}${sumAmountCell}</tr>` : ''}
        </tbody>
      </table>
    </div>
  `;
}

    state.empSuggestOpen = false;
    if(cat === 'DailySummary'){
      state.dailySummary.loading = true;
      loadDailySummary(false);
    } else if(cat === 'WeeklySummary'){
      state.weeklySummary.loading = true;
      loadWeeklySummary(false);
    } else if(cat === 'Trend'){
      // Moi lan mo lai tab Trend: coi du lieu hom nay la co the da cu (vd
      // vua nhap/sua OT o tab khac), nen xoa cache cua hom nay va load lai -
      // cac ngay khac van dung cache san co nen khong bi cham lai nhu truoc.
      if(state.trend.unlocked){
        invalidateTrendCacheForToday();
        loadTrendData();
      } else {
        render();
      }
    } else {
      state.loading = true;
      loadData(false);
    }
  }

  function wireTabBar(){
    const tabStaff = document.getElementById('tabStaff');
    if(tabStaff) tabStaff.onclick = ()=>switchTab('Staff');
    const tabWorker = document.getElementById('tabWorker');
    if(tabWorker) tabWorker.onclick = ()=>switchTab('Worker');
    const tabDailySummary = document.getElementById('tabDailySummary');
    if(tabDailySummary) tabDailySummary.onclick = ()=>switchTab('DailySummary');
    const tabWeeklySummary = document.getElementById('tabWeeklySummary');
    if(tabWeeklySummary) tabWeeklySummary.onclick = ()=>switchTab('WeeklySummary');
  }

  if(!tr.unlocked){
    app.innerHTML = `
      <div class="tab-bar">
        <div class="tab-bar-left">
        <button class="tab-btn" id="tabStaff">Staff</button>
        <button class="tab-btn" id="tabWorker">Worker</button>
        <button class="tab-btn" id="tabDailySummary">Daily</button>
        <button class="tab-btn" id="tabWeeklySummary">Weekly</button>
        <button class="tab-btn active" id="tabTrend">Summary</button>
        </div>
      </div>
      <div class="panel trend-lock">
        <div class="lock-icon">&#128274;</div>
        <h3>Trend is password-protected</h3>
        <p>Enter the password to view QA Staff &amp; Worker overtime trend charts.</p>
        <div class="trend-lock-row">
          <input type="password" id="trendPw" placeholder="Password" value="${esc(tr.pwInput)}">
          <button class="btn btn-steel" id="trendUnlockBtn">Unlock</button>
        </div>
        ${tr.pwError ? `<div class="pw-error" style="margin-top:10px;">${esc(tr.pwError)}</div>` : ''}
      </div>
    `;
    wireTabBar();

    function attemptUnlock(){
      if(tr.pwInput === SIGN_PASSWORD){
        tr.unlocked = true;
        tr.pwError = '';
        tr.pwInput = '';
        render();
        loadTrendData();
      } else {
        tr.pwError = 'Incorrect password.';
        render();
      }
    }
    const pwEl = document.getElementById('trendPw');
    if(pwEl){
      pwEl.oninput = (e)=>{ tr.pwInput = e.target.value; };
      pwEl.onkeydown = (e)=>{ if(e.key === 'Enter') attemptUnlock(); };
      pwEl.focus();
    }
    const unlockBtn = document.getElementById('trendUnlockBtn');
    if(unlockBtn) unlockBtn.onclick = attemptUnlock;
    return;
  }

  const showCharts = tr.loaded && !tr.loading;

  // QA(Staff) Trend - Total Hours / Total Amount / Average by Team all share
  // one Year/Month filter (tr.staffPeriod) shown once at the section level.
  const staffDates = trendDatesForYearMonth(tr.staffPeriod.year, tr.staffPeriod.month);
  const staffHourSeries = showCharts ? buildStaffTeamSeries(staffDates, 'hour') : [];
  const staffAmountSeries = showCharts ? buildStaffTeamSeries(staffDates, 'amount') : [];
  const staffHourTotal = staffHourSeries.reduce((s,x)=>s+x.value,0);
  const staffAmountTotal = staffAmountSeries.reduce((s,x)=>s+x.value,0);
  // Average of the team totals themselves (mean of the bars), used for the
  // black dashed reference line on the Total Hours / Total Amount charts.
  const staffHourTeamAvg = staffHourSeries.length ? staffHourTotal / staffHourSeries.length : null;
  const staffAmountTeamAvg = staffAmountSeries.length ? staffAmountTotal / staffAmountSeries.length : null;
  // Average Hour by Team - built from the same shared dates/series.
  const staffAverage = showCharts

  // method as each team's own average - used for the chart's reference line.

document.addEventListener('click', (e)=>{
  if(state.empSuggestOpen && !e.target.closest('.autocomplete-wrap')){
    state.empSuggestOpen = false;
    // Targeted DOM removal instead of a full render() here — render() would
    // replace the ENTIRE #app innerHTML, which destroys and rebuilds every
    // <select> too. Since this listener runs on ANY outside click, clicking
    // a <select> (Factory/Requested by/Remark...) right after the Emp ID
    // autocomplete was open would open that select's native dropdown and
    // then immediately kill it via the innerHTML replacement — the dropdown
    // flashed open then closed, forcing a second click. Removing just the
    // suggestion list node leaves every other element (including whatever
    // was just opened) completely untouched.
    const list = document.getElementById('empSuggestList');
    if(list) list.remove();
  }
});
document.addEventListener('touchend', (e)=>{
  if(state.empSuggestOpen && !e.target.closest('.autocomplete-wrap')){
    state.empSuggestOpen = false;
    const list = document.getElementById('empSuggestList');
    if(list) list.remove();
  }
});

/* Bat co dateInputActive NGAY luc pointerdown/touchstart (truoc khi trinh
   duyet kip blur ngam do mo native date picker) khi nham vao 1 o input date
   bat ky; tat co ngay khi nguoi dung bam ra ngoai moi o date - xem giai
   thich chi tiet o dinh nghia isFormFocused() ben tren. */
function handleDateInputPointer(e){
  dateInputActive = isDateInputEl(e.target) || !!(e.target.closest && e.target.closest('input[type="date"]'));
}
document.addEventListener('pointerdown', handleDateInputPointer);
document.addEventListener('touchstart', handleDateInputPointer);
document.addEventListener('mousedown', handleDateInputPointer);

loadData(false);
prefetchRecentDays();
