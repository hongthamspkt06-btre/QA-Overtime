<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<!-- Firebase (compat build -- global `firebase` object, loads/executes
     synchronously like the libraries above; the app script below runs
     firebase.initializeApp() immediately, before loadData()
     fire at the bottom of the file, so no async/module timing issues).
     Served from cdnjs (same domain as xlsx/Chart.js above) instead of
     gstatic.com, which some corporate networks block -- a blocked/hanging
     <script> tag here would freeze the entire page since it's render-blocking. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.1/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.1/firebase-firestore-compat.min.js"></script>
<style>
  :root{
    --bg:#D5D8DC;
    --panel:#ffffff;
    --panel2:#f2f3f5;
    --border:#d9dce1;
    --text:#20242c;
    --sub:#68707c;
    --amber:#b45309;
    --amber-dim:#fbecd2;
    --green:#15803d;
    --green-dim:#dcf5e3;
    --red:#dc2626;
    --red-dim:#fbe1df;
    --steel:#2f6fed;
    --navy:#1B3A63;
    --export-green:#1E8E5A;
    --mono: inherit;
  }
  *{box-sizing:border-box;font-family:inherit;}
  html{background:#D5D8DC;}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Malgun Gothic",Arial,sans-serif;font-size:12px;margin:0;padding:0;}
  #app{max-width:1225px;margin:0 auto;padding:20px 18px 60px;}

  .topbar{display:flex;align-items:center;flex-wrap:wrap;gap:14px;}
  .app-header{background:var(--navy);color:#fff;height:56.7px;min-height:56.7px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 20px;border-radius:12px;font-size:19px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0 0 18px 0;}
  .app-header .btn{text-transform:none;letter-spacing:normal;}

  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field-inline{display:flex;flex-direction:row;align-items:center;gap:8px;}
  .field-inline label{white-space:nowrap;}
  .field label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);}
  input[type=date], input[type=text], input[type=password], select{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:8px 10px;font-size:12px;outline:none;font-family:inherit;
  }
  input[type=date]:focus, input[type=text]:focus, input[type=password]:focus, select:focus{border-color:var(--steel);background:#fff;}

  .btn{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);border-radius:6px;padding:8px 14px;
    font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.02em;
    transition:all .15s ease;white-space:nowrap;
  }
  .btn:hover{border-color:var(--steel);background:#e8edfc;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-steel{background:var(--steel);border-color:var(--steel);color:#fff;}
  .btn-steel:hover{filter:brightness(1.08);background:var(--steel);border-color:var(--steel);color:#fff;}
  .btn-red{color:var(--red);}
  .btn-green{background:var(--green);border-color:var(--green);color:#fff;}
  .btn-green:hover{filter:brightness(1.08);background:var(--green);border-color:var(--green);color:#fff;}
  .btn-danger{background:var(--red);border-color:var(--red);color:#fff;}
  .btn-danger:hover{filter:brightness(1.08);background:var(--red);border-color:var(--red);color:#fff;}
  .btn-sm{padding:5px 9px;font-size:13px;}
  .btn-export{background:var(--export-green);border-color:var(--export-green);color:#fff;font-weight:700;font-size:13px;height:35.5px;padding:0 16px;}
  .btn-export:hover{filter:brightness(1.08);background:var(--export-green);border-color:var(--export-green);color:#fff;}

  .sync-pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);font-family:var(--mono);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
  .dot.syncing{background:var(--amber);animation:pulse 1s infinite;}
  .dot.err{background:var(--red);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .refresh-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;}
  .refresh-synced{font-size:10px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:3px;letter-spacing:.02em;white-space:nowrap;}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,24,32,.04);}
  .panel-title{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);font-weight:700;margin-bottom:12px;}
  .panel-title-tc{text-transform:none;}

  .entry-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .entry-row .field{flex:1;min-width:130px;}
  .entry-row .field.grow2{flex:1.6;min-width:170px;}
  .entry-row .field.small{flex:0 0 110px;min-width:100px;}

  .inline-msg{margin-top:10px;font-size:12px;padding:8px 12px;border-radius:6px;display:flex;align-items:flex-start;gap:8px;line-height:1.5;}
  .inline-msg.error{background:var(--red-dim);color:var(--red);}
  .inline-msg.info{background:var(--amber-dim);color:var(--amber);}
  .inline-msg code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-family:var(--mono);}
  .sig-stamp-msg{margin-top:0;max-width:320px;}

  .setup-banner{background:#fff7e6;border:1px solid #f0d19c;border-radius:10px;padding:16px 18px;margin-bottom:18px;font-size:12px;line-height:1.7;color:#7a4d09;}
  .setup-banner b{color:#5c3a06;}
  .setup-banner code{background:rgba(0,0,0,.06);padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:12px;}

  table{width:100%;border-collapse:collapse;font-size:12px;}
  .table-scroll{
    overflow:auto;max-height:min(46vh, 420px);
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  .req-scroll{max-height:min(41vh, 373px);}
  thead th{
    text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--sub);border-bottom:1px solid var(--border);padding:9px 8px;font-weight:700;
    background:var(--panel2);position:sticky;top:0;z-index:5;
  }
  tbody td{padding:9px 8px;border-bottom:1px solid #eef0f2;vertical-align:middle;}
  tbody tr:hover{background:#f7f9fc;}
  tbody tr:last-child td{border-bottom:none;}
  td.num{font-family:var(--mono);color:var(--sub);}
  td.name{font-weight:600;}
  td.time{font-family:var(--mono);color:var(--steel);}
  td.by{color:var(--sub);font-size:12px;}
  .empty-state{padding:36px 10px;text-align:center;color:var(--sub);font-size:12px;}

  .status-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.03em;}
  .status-pending{background:var(--amber-dim);color:var(--amber);}
  .status-approved{background:var(--green-dim);color:var(--green);}
  .status-rejected{background:var(--red-dim);color:var(--red);}

  .approval-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
  .approval-left{display:flex;align-items:center;gap:14px;}
  .sig-stamp{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;}
  .sig-stamp img{height:42px;}
  .sig-meta{font-size:12px;color:var(--sub);line-height:1.5;font-family:var(--mono);}
  .sig-meta b{color:var(--text);font-family:inherit;}

  .confirm-box{display:flex;align-items:center;gap:10px;background:var(--amber-dim);border:1px solid #f0d19c;border-radius:8px;padding:8px 12px;flex-wrap:wrap;}
  .confirm-box span{font-size:12px;color:var(--amber);font-weight:600;}
  .confirm-box input[type=password]{width:130px;}
  .confirm-box.reject-box{background:var(--red-dim);border-color:#f3c6c2;flex-direction:column;align-items:stretch;gap:8px;}
  .confirm-box.reject-box span{color:var(--red);}
  .confirm-box textarea{width:100%;min-height:56px;background:#fff;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit;color:var(--text);resize:vertical;}
  .reject-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pw-error{font-size:12px;color:var(--red);font-weight:600;}
  .cancel-link{font-size:12px;color:#9aa1ab;text-decoration:underline;cursor:pointer;font-weight:600;background:none;border:none;padding:6px 4px;}
  .cancel-link:hover{color:#6b7280;}
  .approval-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}

  .footer-note{font-size:12px;color:var(--sub);text-align:center;margin-top:20px;line-height:1.6;}

  .tab-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
  .tab-bar-left{display:flex;gap:10px;flex-wrap:wrap;}
  .tab-btn{
    padding:10px 18px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:14px;font-weight:700;letter-spacing:.01em;
    cursor:pointer;text-transform:none;
  }
  .tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .tab-btn:hover:not(.active){background:#e0e3e7;}

  .autocomplete-wrap{position:relative;}
  .autocomplete-list{
    position:absolute;top:100%;left:0;right:0;z-index:50;margin-top:2px;
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
    max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    box-shadow:0 6px 18px rgba(20,24,32,.12);
  }
  .autocomplete-item{padding:9px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid #f0f1f3;}
  .autocomplete-item:last-child{border-bottom:none;}
  .autocomplete-item:hover, .autocomplete-item.hl{background:var(--panel2);}
  .autocomplete-item b{color:var(--steel);}
  .autocomplete-empty{padding:10px 12px;font-size:12px;color:var(--sub);}
  .count-chip{font-family:var(--mono);font-size:12px;color:var(--sub);background:var(--panel2);border:1px solid var(--border);padding:3px 9px;border-radius:20px;}

  .ds-table{width:100%;border-collapse:collapse;font-size:12px;}
  .ds-table th, .ds-table td{border:1px solid var(--border);padding:7px 8px;text-align:center;vertical-align:middle;}
  .ds-table thead th{background:var(--panel2);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);font-weight:700;position:sticky;top:0;z-index:5;}
  .ds-table td.ds-left{text-align:left;}
  .ds-table td.ds-factory{font-weight:700;background:#f7f9fc;}
  .ds-table .ds-input{width:100%;min-width:60px;border:1px solid transparent;background:transparent;text-align:center;font-size:12px;border-radius:4px;padding:4px 6px;}
  .ds-table .ds-input:hover{border-color:var(--border);}
  .ds-table .ds-input:focus{border-color:var(--steel);background:#fff;}
  .ds-table tfoot td{background:var(--panel2);font-weight:700;}

  .req-table{border-collapse:collapse;}
  .req-table thead th{
    background:#dbe5f1;color:#17395e;text-transform:none;letter-spacing:0;
    text-align:center;font-weight:700;border:1px solid #a9bcd4;padding:8px 8px;
  }
  .req-table tbody td{border:1px solid var(--border);text-align:center;}
  .req-table td.name{text-align:left;}
  .ds-table tfoot select{font-size:12px;padding:4px 6px;}
  .ds-table tfoot .ds-note{width:100%;min-width:140px;font-size:12px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;margin-top:4px;}

  @media (max-width:720px){
    table{font-size:12px;}
    thead th:nth-child(6), tbody td:nth-child(6){display:none;}
    .entry-row .field{min-width:100%;}
  }

  .modal-overlay{position:fixed;inset:0;background:rgba(20,24,32,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
  .modal-box{background:#fff;border-radius:12px;padding:22px 24px;max-width:320px;width:100%;text-align:center;box-shadow:0 10px 34px rgba(20,24,32,.25);}
  .modal-box p{margin:0 0 18px;font-size:12px;color:var(--text);line-height:1.5;}
  .modal-actions{display:flex;gap:10px;justify-content:center;}
  .modal-actions .btn{flex:1;justify-content:center;}

  .trend-lock{max-width:360px;margin:60px auto;text-align:center;}
  .trend-lock .lock-icon{font-size:12px;margin-bottom:10px;}
  .trend-lock h3{margin:0 0 6px;font-size:12px;}
  .trend-lock p{color:var(--sub);font-size:12px;margin:0 0 16px;}
  .trend-lock-row{display:flex;gap:8px;justify-content:center;}
  .trend-lock-row input{width:180px;}
  .trend-section{margin-bottom:22px;}
  .trend-section-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
  .trend-section-title{font-size:12px;font-weight:800;letter-spacing:.02em;}
  .trend-section-sub{font-size:12px;color:var(--sub);margin-top:2px;}
  .gran-toggle{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:3px;}
  .gran-btn{border:none;background:transparent;color:var(--sub);font-size:12px;font-weight:700;padding:6px 14px;border-radius:6px;cursor:pointer;letter-spacing:.02em;}
  .gran-btn.active{background:var(--steel);color:#fff;}
  .trend-charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .trend-charts.single{grid-template-columns:1fr;}
  .trend-charts-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .chart-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;}
  .chart-card-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:700;margin-bottom:2px;}
  .chart-card-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .chart-card-filters{display:flex;gap:6px;flex-wrap:wrap;}
  .chart-card-filters select, .chart-card-filters input[type=date]{font-size:12px;padding:5px 6px;min-width:0;}
  .chart-card-legend{font-size:12px;color:var(--sub);margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap;}
  .chart-card-legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend-swatch{width:14px;height:0;border-top:2px dashed var(--red);display:inline-block;}
  .legend-swatch.avg{border-top-color:var(--steel);}
  .chart-wrap{position:relative;height:240px;}
  .qa-detail-section-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);font-weight:700;margin:12px 0 6px;}
  .qa-detail-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
  .qa-detail-table{border-collapse:collapse;font-size:12px;white-space:nowrap;width:100%;}
  .qa-detail-table th, .qa-detail-table td{padding:5px 9px;border-bottom:1px solid var(--border);border-right:1px solid #f2f3f5;text-align:right;}
  .qa-detail-table thead th{background:var(--panel2);color:var(--sub);font-weight:700;font-size:12px;}
  .qa-detail-table th:first-child, .qa-detail-table td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);font-weight:700;z-index:1;}
  .qa-detail-table thead th:first-child{background:var(--panel2);}
  .qa-detail-sum-col{font-weight:800;border-left:2px solid var(--border);background:var(--panel2);}
  @media (max-width:820px){
    .trend-charts{grid-template-columns:1fr;}
    .trend-charts-3{grid-template-columns:1fr;}
  }
</style>

<div id="app" translate="no" class="notranslate"></div>

function todayStr(){
  const d = new Date();
  const tz = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return tz.toISOString().slice(0,10);
}
function addDaysStr(iso, n){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  const tz = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return tz.toISOString().slice(0,10);
}
function mondayOfCurrentWeek(){
  const d = new Date();
  const day = d.getDay(); // 0=Sun,1=Mon,...6=Sat
  const diffToMonday = day === 0 ? -6 : (1 - day);
  d.setDate(d.getDate() + diffToMonday);
  const tz = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return tz.toISOString().slice(0,10);
}
function hoursDiff(fromStr, toStr){
  const fm = /^(\d{1,2}):(\d{2})$/.exec((fromStr||'').trim());
  const tm = /^(\d{1,2}):(\d{2})$/.exec((toStr||'').trim());
  if(!fm || !tm) return 0;
  const fromMin = parseInt(fm[1],10)*60 + parseInt(fm[2],10);
  const toMin = parseInt(tm[1],10)*60 + parseInt(tm[2],10);
  const diff = (toMin - fromMin) / 60;
  return diff > 0 ? diff : 0;
}
function computeOtAmount(hours){
  const RATE = 50000;
  const halfSteps = [0.5, 1.5, 2.5, 3.5, 4.5];
  if(halfSteps.indexOf(hours) >= 0){
    return (hours + 0.5) * RATE;
  }
  return hours * RATE;
}
function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDateShort(iso){
  const [y,m,d] = (iso||'').split('-');
  if(!y||!m||!d) return '';
  return `${MONTH_ABBR[parseInt(m,10)-1]}-${d}`;
}
function fmtDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleString('en-GB', {hour12:false});
}

}

let dateInputActive = false;
function isDateInputEl(el){
  return !!(el && el.tagName === 'INPUT' && el.type === 'date');
}

function isFormFocused(){
  if(dateInputActive) return true;
  const el = document.activeElement;
  if(!el) return false;
  if(isDateInputEl(el)) return true;
  if(el.classList && el.classList.contains('ds-input')) return true;
  return !!(el.id && el.id.indexOf('f_') === 0);
}

/* Google Apps Script web apps occasionally answer a fresh request with a
   transient HTTP 404/500/503 (e.g. right after a redeploy, or under cold-start
   load) even though the deployment itself is fine - a straight retry a few
   hundred ms later almost always succeeds. fetchWithRetry wraps every GET/POST
   call in up to 3 attempts with exponential backoff so those blips no longer
   surface as a hard "Sync failed: HTTP 404" to the user. cache:'no-store' also
   stops the browser from serving a stale cached 404/redirect response. */
async function fetchWithRetry(url, options, attempts){
  attempts = attempts || 3;
  let lastErr;
  for(let i = 0; i < attempts; i++){
    try{
      const res = await fetch(url, Object.assign({ cache: 'no-store' }, options || {}));
      if(!res.ok){
        // 4xx other than 404/408/429 are not transient - fail fast instead of retrying.
        const retryable = res.status === 404 || res.status === 408 || res.status === 429 || res.status >= 500;
        if(!retryable || i === attempts - 1) throw new Error('HTTP ' + res.status);
        lastErr = new Error('HTTP ' + res.status);
      } else {
        return res;
      }
    }catch(e){
      // Neu request nay bi HUY CHU DONG (xem loadData() - moi lan doi ngay/tab
      // se huy request cu dang cho de nhuong cho ket noi cho request moi),
      // dung lai ngay lap tuc, KHONG retry nua - retry mot request da bi huy
      // chi ton them 1 slot ket noi vo ich, dung nguyen nhan gay xep hang cham
      // dan khi doi ngay nhieu lan lien tiep.
      if(e.name === 'AbortError') throw e;
      lastErr = e;
      if(i === attempts - 1) throw lastErr;
    }
    await new Promise(r => setTimeout(r, 400 * Math.pow(2, i)));
  }
  throw lastErr;
}

/* Google Apps Script web app doi khi tra ve redirect 302 (chuyen sang
   script.googleusercontent.com) cho request POST toi URL /exec. Theo dung
   chuan Fetch API, khi gap redirect 301/302/303 tren MOT REQUEST CO METHOD
   LA POST, trinh duyet TU DONG doi method thanh GET va XOA SACH body - day
   la nguyen nhan chinh xac cua loi "Missing date query param": action va
   payload (nam trong POST body) bi mat tren duong di, server chi con nhan
   duoc 1 GET rong nen roi vao nhanh doGet() thay vi doPost(), va doGet()
   khong biet gi ve action addRow/deleteRow/sign/... - chi bao loi thieu date.
   Trieu chung: doc du lieu (GET) luon on nhung ghi du lieu (Add/Delete/Sign)
   thi luc duoc luc khong, tuy Google co quyet dinh redirect hay khong.

   Fix: gan CUNG 1 noi dung body vao query string (?payload=...) cho moi
   request MUTATE nho gon (delta add/delete/sign/unlock/reject, va luu meta
   DailySummary) - query string luon SONG SONG voi POST body nen KHONG bi
   redirect xoa mat nhu body. Neu POST toi thang doPost() nhu binh thuong,
   phan payload= tren URL don gian bi bo qua, khong anh huong gi. Neu bi ha
   cap thanh GET, doGet() se tu doc duoc payload= tu URL va xu ly y het nhu
   doPost() (xem doGet() da duoc cap nhat trong Code.gs). KHONG ap dung cho
   exportPdf vi file base64 qua lon, khong the nhet vao URL.

   GIOI HAN DO DAI: tab Summary (Trend) co the goi getBulk voi hang TRAM den
   CA NGHIN key cung luc (ca nam x nhieu khoang thoi gian x 2 category - xem
   fetchAllTrendDates), khien JSON.stringify(bodyObj) o day phinh to toi hang
   chuc KB neu nhet het vao URL - chinh no la nguyen nhan tab Summary tu
   nhanh hoa cham toi 5 phut sau khi ham nay duoc ap dung dai tra cho ca
   apiGetBulk. URL qua dai de bi server/trinh duyet tu choi hoac cham bat
   thuong, khien fetchWithRetry phai retry nhieu lan. Vi vay CHI gan
   payload= khi ket qua con nam duoi 1 nguong an toan (~6000 ky tu) - vuot
   qua nguong nay (chi xay ra voi bulk fetch lon cua tab Summary), bo qua
   fallback va tra ve URL nhu cu (POST thuan, dung y het hanh vi truoc khi
   co ham nay) - cac request nho (addRow, sign/unlock/reject, getBulk 3 key
   cua tab Daily/Weekly) khong bao gio cham nguong nay nen van duoc bao ve
   nhu binh thuong. */
function withPayloadFallback_(url, bodyObj){
  const q = 'payload=' + encodeURIComponent(JSON.stringify(bodyObj));
  if(q.length > 6000) return url; // qua dai (vd bulk fetch ca nam cua tab Summary) - bo qua fallback, giu nguyen POST thuan
  return url + (url.indexOf('?') === -1 ? '?' : '&') + q;
}

/* ---------- Firestore data-access layer (thay cho fetch() toi Apps Script)
   ----------
   4 ham nay giu NGUYEN chu ky goi (tham so, gia tri tra ve) nhu truoc -
   moi noi khac trong file (loadData, applyDelta, fetchAllTrendDates...)
   KHONG can sua gi ca.

   Tham so `signal` cua apiGet duoc GIU LAI trong chu ky ham de khong phai
   sua noi goi, nhung KHONG con duoc dung: Firestore SDK khong nhan
   AbortSignal kieu fetch. Dieu nay AN TOAN vi loadData() da co san co che
   doi chieu "requestedKey === storageDateKey()" SAU khi await xong (xem
   loadData() ben duoi) de bo qua ket qua tra ve tre/thua - do moi la thu
   dam bao dung, khong phai viec huy request som. Mat di la mot chut toi uu
   phu (giai phong ket noi ngay lap tuc khi doi tab/ngay lien tuc), khong
   anh huong tinh dung dan. */
async function apiGet(date, signal){
  const snap = await db.collection(OT_COLLECTION).doc(date).get();
  return snap.exists ? snap.data() : {};
}

async function apiSave(date, data){
  const payload = Object.assign({}, data, {
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  await db.collection(OT_COLLECTION).doc(date).set(payload);
  return Object.assign({ success: true }, data);
}

/* Doc-sua-ghi meta trong 1 transaction (thay cho apiGet + apiSave rieng le).
   Tra ve meta moi nhat sau khi ghi nen khong can doc them. mutateFn nhan 1 object
   meta moi doc tu server o moi lan chay (ke ca khi transaction tu retry). */
async function apiUpdateMeta(date, mutateFn){
  const docRef = db.collection(OT_COLLECTION).doc(date);
  return db.runTransaction(async (tx) => {
    const snap = await tx.get(docRef);
    const d = snap.exists ? snap.data() : null;
    const meta = (d && d.meta) ? Object.assign({}, d.meta) : {};
    mutateFn(meta);
    tx.set(docRef, { meta: meta, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    return meta;
  });
}

/* Lay nhieu key trong 1 lan (dung cho tab Trend thay vi goi apiGet() rieng
   cho tung ngay). Tra ve map { key: {rows:[...]} }.
   Khac voi Apps Script/Sheet ban dau (phai quet ca cot Key roi moi doc
   dung dong can), Firestore doc theo dung Document ID nen chi can
   Promise.all(getDoc) song song cho tung key - don gian va nhanh hon han
   thu thuat getRangeList() cu trong Calc.gs. */
async function apiGetBulk(keys){
  if(!keys.length) return {};
  const out = {};
  await Promise.all(keys.map(async (k) => {
    const snap = await db.collection(OT_COLLECTION).doc(k).get();
    if(snap.exists) out[k] = snap.data();
  }));
  return out;
}

/* Bam nut Refresh (thu cong): nut mo di (disabled) trong it nhat 3 giay du
   API tra ve nhanh hay cham, sau do hien "Synced" + dau tick xanh ben duoi
   nut trong 2 giay roi tu dong an di (khong con hien mai cho den lan bam
   Refresh tiep theo nhu truoc). `obj` la state / ds / ws / tr. */
function runManualRefresh(obj, loadFn){
  if(obj.refreshBusy) return;
  // Neu dong "Synced" cua lan bam truoc dang cho de tu an (chua het 2s) ma
  // nguoi dung bam Refresh lan nua ngay, huy bo dong dem cu de tranh no tu
  // an mat dong "Synced" moi truoc thoi han.
  if(obj.refreshSyncedTimer){ clearTimeout(obj.refreshSyncedTimer); obj.refreshSyncedTimer = null; }
  obj.refreshBusy = true;
  obj.refreshSynced = false;
  render();
  const minDelay = new Promise(res => setTimeout(res, 3000));
  Promise.all([loadFn(), minDelay]).then(()=>{
    obj.refreshBusy = false;
    obj.refreshSynced = true;
    render();
    obj.refreshSyncedTimer = setTimeout(()=>{
      obj.refreshSynced = false;
      obj.refreshSyncedTimer = null;
      render();
    }, 2000); // hien "Synced" 2 giay roi tu an, khong hien mai
  });
}

/* ====== Cache du lieu theo ngay (Staff/Worker) ======
   Muc tieu: chon lai mot ngay da xem (hoac da duoc prefetch) thi hien LIEN,
   sau do loadData() van doc lai Firestore ngam de cap nhat neu co thay doi
   (stale-while-revalidate). Luu ban sao (clone) de sua optimistic tren
   state.data khong lam ban cache. */
const dayDataCache = new Map();
const DAY_CACHE_MAX = 80;
const PREFETCH_DAYS = 14; // so ngay gan day duoc nap san (Staff+Worker). Dat 0 de tat.
function emptyDayData(){
  return { rows: [], approved:false, approvedAt:null, approvedBy:null, rejected:false, rejectedAt:null, rejectedBy:null, rejectComment:'' };
}
function cloneDay(o){ return JSON.parse(JSON.stringify(o)); }
function cacheDayData(key, data){
  dayDataCache.delete(key);
  dayDataCache.set(key, cloneDay(data));
  while(dayDataCache.size > DAY_CACHE_MAX){
    dayDataCache.delete(dayDataCache.keys().next().value);
  }
}
/* Neu ngay/tab hien tai da co trong cache: gan vao state.data, tat loading
   va tra ve true (noi goi tu render()). Cung kich hoat tao PDF ngam. */
function showCachedDay(){
  const c = dayDataCache.get(storageDateKey());
  if(!c || state.pendingMutations !== 0) return false;
  state.data = cloneDay(c);
  state.loading = false;
  state.syncError = '';
  pregeneratePdf();
  return true;
}
/* Nap san du lieu cac ngay gan day (1 lan, sau khi trang da len) de chon ngay cu la hien ngay. */
function prefetchRecentDays(){
  if(NOT_CONFIGURED || !PREFETCH_DAYS) return;
  setTimeout(async ()=>{
    try{
      const keys = [];
      for(let i = 1; i <= PREFETCH_DAYS; i++){
        const d = addDaysStr(todayStr(), -i);
        ['Staff','Worker'].forEach(c => { const k = c + '::' + d; if(!dayDataCache.has(k)) keys.push(k); });
      }
      if(!keys.length) return;
      const bulk = await apiGetBulk(keys);
      keys.forEach(k => {
        if(dayDataCache.has(k)) return; // loadData() da nap ban moi hon
        cacheDayData(k, (bulk[k] && bulk[k].rows) ? bulk[k] : emptyDayData());
      });
    }catch(e){ console.warn('Prefetch recent days failed (ignored):', e); }
  }, 2500);
}

async function loadData(showSyncDot){
  if(NOT_CONFIGURED){ state.loading = false; render(); return; }
  // Huy request GET truoc do neu no van con dang cho/dang retry (xem giai
  // thich chi tiet o khai bao loadDataAbort ben tren) - nhuong ngay 1 slot
  // ket noi cho request MOI nay thay vi de request cu tiep tuc chiem giu.
  if(loadDataAbort) loadDataAbort.abort();
  loadDataAbort = new AbortController();
  const mySignal = loadDataAbort.signal;
  // Chup lai key (category+date) NGAY LUC bat dau request nay - dung de doi
  // chieu lai sau khi await xong (xem giai thich ben duoi). storageDateKey()
  // doc state.category/state.date TAI THOI DIEM goi, nen neu nguoi dung
  // chuyen tab (Staff <-> Worker) hoac doi ngay trong luc request nay con
  // dang bay, gia tri storageDateKey() se khac di.
  const requestedKey = storageDateKey();
  // shouldSkipRender() duoc GOI LAI ngay truoc moi lan render(), khong dung
  // 1 gia tri "dong bang" tinh tu dau ham nhu truoc - vi ham nay await goi
  // API mat 200-800ms; neu nguoi dung bam mo lich chon ngay DUNG LUC dang
  // cho API tra ve, gia tri tinh san tu truoc se khong con dung (luc do lich
  // CHUA mo), khien render() sau do vo tinh chay dung nhip va dong mat lich
  // vua mo (loi "lich hien ra roi mat lien").
  const shouldSkipRender = ()=> !showSyncDot && (isFormFocused() || state.confirmingSign || state.confirmingUnlock || state.confirmingReject);
  if(showSyncDot){ state.syncing = true; if(!shouldSkipRender()) render(); }
  try{
    const result = await apiGet(requestedKey, mySignal);
    // Chi ap dung ket qua neu category/date HIEN TAI van con khop voi key da
    // yeu cau luc bat dau (requestedKey). Truong hop can chan: nguoi dung
    // dang o tab Staff, vong poll 2s cu goi loadData() cho "Staff" nhung bi
    // cham (mang chap chon / phai retry vi bi redirect POST->GET o cac call
    // khac) - trong luc do nguoi dung bam qua tab Worker, kich hoat 1
    // loadData() moi cho "Worker" va nhan ket qua VE TRUOC. Sau do request
    // "Staff" cu moi tra ve va neu khong co doi chieu nay, no se ghi de
    // state.data bang du lieu Staff trong khi man hinh dang o tab Worker ->
    // dung nguyen nhan gay hien tuong "nhap nhay qua lai giua gia tri Staff
    // va Worker" nguoi dung gap phai.
    const normResult = (result && result.rows) ? result : emptyDayData();
    cacheDayData(requestedKey, normResult); // ket qua server luon dung cho dung key nay, du user da doi tab/ngay
    if(requestedKey === storageDateKey() && state.pendingMutations === 0){
      state.data = normResult;
    }
    state.syncError = '';
    // Warm the PDF cache for this date/category too (not just after edits),
    // so switching tabs/dates also has Export PDF ready ahead of time.
    // Cung phai chan boi cung dieu kien tren, khong thi PDF cache se bi nap
    // nham du lieu cua tab/ngay cu.
    if(requestedKey === storageDateKey()) pregeneratePdf();
  }catch(e){
    // Request nay bi CHINH loadData() lan sau huy (binh thuong, khong phai
    // loi mang that su) - thoat ngay, KHONG dong bat ky co trang thai nao,
    // vi lan goi moi hon dang xu ly va se tu ket thuc dung cach cua no.
    if(e.name === 'AbortError') return;
    console.error(e);
    if(requestedKey === storageDateKey()) state.syncError = 'Sync failed: ' + e.message;
  }
  // Cung chi cap nhat cac co trang thai nay khi request van con "khop" voi
  // tab/ngay hien tai - neu khong, day la 1 request cu da lac tab (xem giai
  // thich o tren) va khong duoc phep tat co "loading"/"syncing" cua tab MOI
  // (dang co request rieng cua no dang chay) truoc khi request rieng do kip
  // xong, keo theo hien tuong loading tat som/nhap nhay.
  if(requestedKey === storageDateKey()){
    state.loading = false;
    state.syncing = false;
    state.lastSync = new Date();
  }
  if(!shouldSkipRender()) render();
}

async function loadDailySummary(showSyncDot){
  if(NOT_CONFIGURED){ state.dailySummary.loading = false; render(); return; }
  const ds = state.dailySummary;
  // shouldSkipRender() duoc GOI LAI ngay truoc moi lan render() (khong dung
  // gia tri tinh san tu dau ham) - vi apiGetBulk() await mat vai tram ms, neu
  // nguoi dung bam mo lich DUNG LUC dang cho ket qua thi gia tri cu se sai va
  // lam lich vua mo bi dong mat ngay.
  const shouldSkipRender = ()=> !showSyncDot && isFormFocused();
  if(showSyncDot){ ds.syncing = true; if(!shouldSkipRender()) render(); }
  try{
    const d = state.date;
    const bulk = await apiGetBulk(['Staff::' + d, 'Worker::' + d, 'DailySummary::' + d]);
    const staffRes = bulk['Staff::' + d];
    const workerRes = bulk['Worker::' + d];
    const metaRes = bulk['DailySummary::' + d];
    ds.staffRows = (staffRes && staffRes.rows) ? staffRes.rows : [];
    ds.workerRows = (workerRes && workerRes.rows) ? workerRes.rows : [];
    // Bo qua ban meta vua fetch neu dang co 1 luot luu Major Fac OT/Max Fac
    // OT/PIC chua xong (xem pendingMetaSaves trong saveDailySummaryMeta) -
    // ban fetch nay co the la snapshot CU tu truoc khi luot luu do kip ghi
    // len server, ghi de no se lam gia tri vua nhap "hien roi mat" tren man
    // hinh du server da luu dung.
    if(ds.pendingMetaSaves === 0){
      ds.meta = (metaRes && metaRes.meta) ? metaRes.meta : {};
    }
    ds.syncError = '';
  }catch(e){
    console.error(e);
    ds.syncError = 'Sync failed: ' + e.message;
  }
  ds.loading = false;
  ds.syncing = false;
  state.lastSync = new Date();
  if(!shouldSkipRender()) render();
}

async function saveDailySummaryMeta(mutateFn){
  const ds = state.dailySummary;
  ds.syncing = true; ds.pendingMetaSaves++; render();
  try{
    const latestMeta = await apiUpdateMeta('DailySummary::' + state.date, mutateFn);
    ds.meta = latestMeta;
    ds.syncError = '';
  }catch(e){
    console.error('Save DailySummary meta error', e);
    ds.syncError = 'Could not save: ' + e.message;
  }
  ds.pendingMetaSaves = Math.max(0, ds.pendingMetaSaves - 1);
  ds.syncing = false;
  state.lastSync = new Date();
  render();
}

function weeklyDayList(){

}

async function loadWeeklySummary(showSyncDot){
  if(NOT_CONFIGURED){ state.weeklySummary.loading = false; render(); return; }
  const ws = state.weeklySummary;
  // Xem giai thich o loadData()/loadDailySummary() - tinh lai ngay truoc moi
  // lan render() thay vi dung gia tri "dong bang" tu dau ham.
  const shouldSkipRender = ()=> !showSyncDot && isFormFocused();
  if(showSyncDot){ ws.syncing = true; if(!shouldSkipRender()) render(); }
  try{
    const days = weeklyDayList();

    ws.syncError = '';
  }catch(e){
    console.error(e);
    ws.syncError = 'Sync failed: ' + e.message;
  }
  ws.loading = false;
  ws.syncing = false;
  state.lastSync = new Date();
  if(!shouldSkipRender()) render();
}

const WEEKDAY_LABELS = ['Mon','Tue','Wed','Thu','Fri','Sat'];

function buildWeeklySummaryRows(){
  const days = weeklyDayList();
  const ws = state.weeklySummary;
  const byEmp = {};
  days.forEach((d, dayIdx) => {
    (ws.staffByDate[d] || []).forEach(r => {
      const key = (r.idCode && r.idCode.trim()) ? r.idCode.trim() : ('__' + (r.fullName||'').trim());
      if(!byEmp[key]){
        byEmp[key] = {
          idCode: r.idCode || '',
          fullName: r.fullName || '',
          ownTeam: r.ownTeam || '',
          dayTo: ['', '', '', '', '', ''],
          hourTotal: 0,
          amountTotal: 0
        };
      }
      const emp = byEmp[key];
      if(!emp.ownTeam && r.ownTeam) emp.ownTeam = r.ownTeam;
      const h = hoursDiff(r.otFrom, r.otTo);
      emp.hourTotal += h;
      emp.amountTotal += computeOtAmount(h);
      emp.dayTo[dayIdx] = emp.dayTo[dayIdx] ? (emp.dayTo[dayIdx] + ', ' + (r.otTo||'')) : (r.otTo || '');
    });
  });
  const rows = Object.values(byEmp);
  rows.sort((a,b) => {
    const t = (a.ownTeam||'').localeCompare(b.ownTeam||'');
    if(t !== 0) return t;
    return (a.fullName||'').localeCompare(b.fullName||'');
  });
  return rows;
}

function buildWeeklyDayTotals(){
  const days = weeklyDayList();
  const ws = state.weeklySummary;
  return days.map(d => {
    const dayRows = ws.staffByDate[d] || [];
    let hourSum = 0, amountSum = 0;
    dayRows.forEach(r => {
      const h = hoursDiff(r.otFrom, r.otTo);
      hourSum += h;
      amountSum += computeOtAmount(h);
    });
    return { hourSum, amountSum };
  });
}

/* ====== Trend tab: date-range helpers, fetch/aggregate helpers ====== */

function mondayOfWeekContaining(iso){
  const d = new Date(iso + 'T00:00:00');
  const day = d.getDay(); // 0=Sun..6=Sat
  const diffToMonday = (day === 0) ? -6 : (1 - day);
  d.setDate(d.getDate() + diffToMonday);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

/* Every date list below is capped at "today" - future dates are simply
   skipped since there is no OT data for them yet. */
function trendDatesInRange(from, to){
  const today = todayStr();
  if(!from || !to) return [];
  let start = from, end = to;
  if(start > end){ const tmp = start; start = end; end = tmp; }
  const dates = [];
  let d = start;
  let guard = 0;
  while(d <= end && guard < 400){ // guard: sane upper bound on manual From/To range
    if(d <= today) dates.push(d);
    d = addDaysStr(d, 1);
    guard++;
  }
  return dates;
}

function trendDatesInMonth(year, month){
  const today = todayStr();
  const daysInMonth = new Date(year, month, 0).getDate();
  const dates = [];
  for(let day = 1; day <= daysInMonth; day++){
    const ds = year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
    if(ds > today) break;
    dates.push(ds);
  }
  return dates;
}

function trendDatesInYear(year){
  const today = todayStr();
  const curYear = Number(today.slice(0, 4));
  const maxMonth = (year === curYear) ? Number(today.slice(5, 7)) : 12;
  let dates = [];
  for(let m = 1; m <= maxMonth; m++) dates = dates.concat(trendDatesInMonth(year, m));
  return dates;
}

/* month is 1-12, or '' / falsy to aggregate the whole year. */
function trendDatesForYearMonth(year, month){
  return month ? trendDatesInMonth(year, Number(month)) : trendDatesInYear(year);
}

/* Gop toan bo ngay con thieu (ca Staff lan Worker) thanh 1 lan goi POST
   duy nhat (apiGetBulk) thay vi goi apiGet() rieng cho tung ngay. Day la
   nguyen nhan chinh khien tab Trend truoc day mat toi 10 phut: xem ca nam
   co the phai goi GAS toi ~730 lan (365 ngay x 2 category). */
async function fetchAllTrendDates(dates, onDone){
  const missingStaff = dates.filter(d => trendCache.Staff[d] === undefined);
  const missingWorker = dates.filter(d => trendCache.Worker[d] === undefined);
  const keys = missingStaff.map(d => 'Staff::' + d)
    .concat(missingWorker.map(d => 'Worker::' + d));
  if(keys.length){
    const bulk = await apiGetBulk(keys);
    missingStaff.forEach(d => {
      const res = bulk['Staff::' + d];
      // Rejected dates are excluded from Trend entirely — only Pending
      // (not yet signed) or Done (approved) data counts toward the charts.
      trendCache.Staff[d] = (res && res.rows && !res.rejected) ? res.rows : [];
      if(trendCache.Staff[d].length) trendKnownYears.add(Number(d.slice(0,4)));
    });
    missingWorker.forEach(d => {
      const res = bulk['Worker::' + d];
      trendCache.Worker[d] = (res && res.rows && !res.rejected) ? res.rows : [];
      if(trendCache.Worker[d].length) trendKnownYears.add(Number(d.slice(0,4)));
    });
  }
  if(onDone) onDone();
}

/* Loads whatever daily data every visible Trend box currently needs (union of
   the 5 independent filter boxes below), then caches it in trendCache so
   switching a single box's Year/Month/Week filter re-renders instantly
   without a full refetch. */
function trendAllNeededDates(){
  const tr = state.trend;
  const sets = [
    trendDatesForYearMonth(tr.staffPeriod.year, tr.staffPeriod.month),
    trendDatesInYear(tr.staffDetail.year), // covers both its day-in-month and month-in-year rows
    trendDatesInRange(tr.workerWeek.from, tr.workerWeek.to),
    trendDatesForYearMonth(tr.workerMonth.year, tr.workerMonth.month),
    trendDatesInYear(tr.workerYear.year),
    trendDatesInYear(tr.workerDetail.year) // covers both its day-in-month and month-in-year rows
  ];
  return Array.from(new Set(sets.flat()));
}

async function loadTrendData(){
  const tr = state.trend;
  tr.loading = true;
  tr.syncError = '';
  tr.loadProgress = null;
  render();
  try{
    const allDates = trendAllNeededDates();
    await fetchAllTrendDates(allDates);
    tr.loaded = true;
  }catch(e){
    console.error(e);
    tr.syncError = 'Sync failed: ' + e.message;
  }
  tr.loading = false;
  tr.loadProgress = null;
  render();
}

/* Team-name normalization for the Staff Trend charts: some teams are split
   across factories/brands in the raw data (e.g. "MW Lab" vs "F7 Lab", or
   "MW Colorist" vs "F6/F7 Colorist") but should be reported as one combined
   team ("Lab" / "Colorist") rather than as separate bars. */
function normalizeTeamName(team){
  const t = (team || '').trim();
  if(!t) return '(No team)';
  if(/colorist/i.test(t)) return 'Colorist';
  if(/\blab\b/i.test(t)) return 'Lab';
  return t;
}

/* Fixed x-axis order for the "Average Hour & Amount by Team" chart, per the
   business-requested layout (support teams first, then factory teams, then
   Colorist/Lab/Office). Teams not found in this list (shouldn't normally
   happen) are appended alphabetically after it, so nothing silently
   disappears from the chart. */
const STAFF_AVERAGE_TEAM_ORDER = ['A&F', 'AEO', 'CostCo', 'Cotton On', 'Pink', 'Target', 'Wal-Mart', 'F6 Uniqlo', 'F7 Uniqlo', 'Colorist', 'Lab', 'Office'];
function staffAverageTeamSort(a, b){
  const ia = STAFF_AVERAGE_TEAM_ORDER.indexOf(a);
  const ib = STAFF_AVERAGE_TEAM_ORDER.indexOf(b);
  if(ia === -1 && ib === -1) return a.localeCompare(b);
  if(ia === -1) return 1;
  if(ib === -1) return -1;
  return ia - ib;
}

/* Position normalization for QA(Worker): each Worker's Own Team string
   encodes a factory prefix plus a position (e.g. "F6/F7 PSC", "F1/F2 PSC",
   "F6 FQC", "F7 SOP") - the QA(Worker) Detail box filters by the position
   only (PSC / SOP / FQC), regardless of which factory it's paired with. */
function normalizeWorkerPosition(team){
  const t = (team || '').trim();
  if(!t) return '(No position)';
  if(/PSC/i.test(t)) return 'PSC';
  if(/SOP/i.test(t)) return 'SOP';
  if(/FQC/i.test(t)) return 'FQC';
  return t;
}

/* Aggregates QA(Staff) rows across `dates`, grouped by team. metric is
   'hour' or 'amount'. Returns series sorted by value desc for charting.

   Quy tắc chung (giống buildDailySummaryGroups): khi nhân viên chọn Support
   Team (requestedBy) khác với Own Team gốc của họ và khác "Own", thì OT đó
   được TÍNH vào team hỗ trợ (Support Team), không phải Own Team gốc. Nếu
   requestedBy trống hoặc bằng "Own" (hoặc trùng Own Team gốc), thì lấy theo
   Own Team như bình thường. */
function buildStaffTeamSeries(dates, metric){
  const cache = trendCache.Staff;
  const map = new Map();
  dates.forEach(d => (cache[d] || []).forEach(r => {
    const originalOwnTeam = (r.ownTeam || '').trim();
    const requestedBy = (r.requestedBy || '').trim();
    const effectiveTeam = (requestedBy && requestedBy !== 'Own' && requestedBy !== originalOwnTeam)
      ? requestedBy
      : originalOwnTeam;
    const team = normalizeTeamName(effectiveTeam);
    const h = hoursDiff(r.otFrom, r.otTo);
    const val = metric === 'hour' ? h : computeOtAmount(h);
    map.set(team, (map.get(team) || 0) + val);
  }));
  return Array.from(map.entries())
    .map(([label, value]) => ({ label, value }))
    .sort((a, b) => b.value - a.value);
}

/* Số lượt người tăng ca theo từng team trong `dates` (mỗi dòng OT = 1 lượt),
   dùng cùng quy tắc gom team (effectiveTeam) như buildStaffTeamSeries, để có
   thể ghép 1-1 với series đó theo team label. */
function buildStaffTeamTurnCounts(dates){
  const cache = trendCache.Staff;
  const map = new Map();
  (dates || []).forEach(d => (cache[d] || []).forEach(r => {
    const originalOwnTeam = (r.ownTeam || '').trim();
    const requestedBy = (r.requestedBy || '').trim();
    const effectiveTeam = (requestedBy && requestedBy !== 'Own' && requestedBy !== originalOwnTeam)
      ? requestedBy
      : originalOwnTeam;
    const team = normalizeTeamName(effectiveTeam);
    map.set(team, (map.get(team) || 0) + 1);
  }));
  return map;
}

/* Giờ (hoặc Amount) trung bình / 1 lượt người tăng ca, theo TỪNG team:
     = Tổng số giờ (hoặc Amount) tăng ca của team / Σ(Số người tăng ca của team đó từng ngày)
   Trả về mảng song song với `series` (cùng thứ tự team), mỗi phần tử là số
   trung bình của team đó, hoặc null nếu team không có lượt nào. */
function trendAveragePerTurnByTeam(series, dates){
  const turnCounts = buildStaffTeamTurnCounts(dates);
  return series.map(s => {
    const cnt = turnCounts.get(s.label) || 0;
    return cnt ? s.value / cnt : null;
  });
}

/* Weighted overall average per turn (hour or amount) across ALL teams
   combined - i.e. total value / total turns for every team together -
   using the exact same "total / turns" method as trendAveragePerTurnByTeam
   above, just summed over the whole population instead of one team. Used
   for the black dashed "Average of All Teams" reference line on the
   Average Hour chart. */
function trendOverallAveragePerTurn(series, dates){
  const totalValue = series.reduce((s, x) => s + x.value, 0);
  const turnCounts = buildStaffTeamTurnCounts(dates);
  const totalTurns = Array.from(turnCounts.values()).reduce((s, x) => s + x, 0);
  return totalTurns ? totalValue / totalTurns : null;
}

/* Builds the per-team Average Hour and Average Amount series for the
   "Average Hour & Amount by Team" chart, which now has its own single
   Year/Month filter (hourSeries/amountSeries are built from the same
   dates). Kept as two separate series/dates parameters since the
   underlying per-team average math is identical either way; the team list
   is the union of both, in the fixed STAFF_AVERAGE_TEAM_ORDER order, with a
   team missing from one side getting a null (no point/bar drawn) there. */
function buildStaffAverageByTeam(hourSeries, hourDates, amountSeries, amountDates){
  const hourAvgs = trendAveragePerTurnByTeam(hourSeries, hourDates);
  const amountAvgs = trendAveragePerTurnByTeam(amountSeries, amountDates);
  const hourMap = new Map(hourSeries.map((s, i) => [s.label, hourAvgs[i]]));
  const amountMap = new Map(amountSeries.map((s, i) => [s.label, amountAvgs[i]]));
  const teams = Array.from(new Set([...hourMap.keys(), ...amountMap.keys()])).sort(staffAverageTeamSort);
  return {
    teams,
    hourValues: teams.map(t => hourMap.has(t) ? hourMap.get(t) : null),
    amountValues: teams.map(t => amountMap.has(t) ? amountMap.get(t) : null)
  };
}

/* Aggregates QA(Worker) hours across `dates`, grouped by person (keyed by
   Emp ID when available, to keep two same-named workers separate) but
   labeled by Full Name for display, falling back to Emp ID only if the name
   is blank. Returns series sorted by value desc. */
/* Gio tang ca cua WORKER, dung cho tab Summary > QA (Worker): 3 bieu do Hour va QA Detail.
   neu (To - From) >= 2.0 thi gio tang ca = To - From - 0.5, nguoc lai giu
   nguyen To - From. Staff KHONG
   dung ham nay (giu nguyen hoursDiff). */
function workerOtHours(fromStr, toStr){
  const h = hoursDiff(fromStr, toStr);
  return h >= 2.0 ? h - 0.5 : h;
}

function buildWorkerEmpSeries(dates){
  const cache = trendCache.Worker;
  const map = new Map();
  dates.forEach(d => (cache[d] || []).forEach(r => {
    const idCode = (r.idCode || '').trim();
    const fullName = (r.fullName || '').trim();
    const key = idCode || ('__' + fullName);
    const posTag = idCode ? (TEAM_MAP[idCode] || '') : '';
    const baseName = fullName || idCode || '?';
    const label = posTag ? (baseName + ' (' + posTag + ')') : baseName;
    const h = workerOtHours(r.otFrom, r.otTo);
    const words = baseName.trim().split(/\s+/);
    const shortLabel = posTag ? posTag.trim().split(/\s+/) : (words.length > 2 ? words.slice(-2) : words); // truc X: chi chu trong ngoac (vi tri), tach dong theo khoang trang
    if(!map.has(key)) map.set(key, { label, shortLabel, value: 0 });
    map.get(key).value += h;
  }));
  return Array.from(map.values()).sort((a, b) => b.value - a.value);
}

/* Aggregates one person's OT for a QA Detail box: hour+amount for every day
   of `month` in `year` (capped at today), and hour+amount for every month of
   `year` (capped at the current month if `year` is this year). A day or
   month that hasn't happened yet is `null` (rendered as "-") rather than 0,
   to distinguish "no OT" from "not reached yet". personKey matches the same
   Emp ID / Full Name key scheme used by buildWorkerEmpSeries. `cache` is
   either trendCache.Staff or trendCache.Worker, so this same helper backs
   both the QA(Staff) and QA(Worker) Detail boxes. */
function buildPersonDetailData(cache, personKey, year, month, hoursFn){
  hoursFn = hoursFn || hoursDiff;
  const today = todayStr();
  const curYear = Number(today.slice(0, 4));

  function sumForDate(ds){
    let hour = 0, amount = 0;
    (cache[ds] || []).forEach(r => {
      const idCode = (r.idCode || '').trim();
      const fullName = (r.fullName || '').trim();
      const key = idCode || ('__' + fullName);
      if(key !== personKey) return;
      const h = hoursFn(r.otFrom, r.otTo);
      hour += h;
      amount += computeOtAmount(h);
    });
    return { hour, amount };
  }

  const daysInMonth = new Date(year, month, 0).getDate();
  const dayHours = [], dayAmounts = [];
  for(let day = 1; day <= daysInMonth; day++){
    const ds = year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
    if(ds > today){ dayHours.push(null); dayAmounts.push(null); continue; }
    const r = sumForDate(ds);
    dayHours.push(r.hour);
    dayAmounts.push(r.amount);
  }

  const maxMonth = year < curYear ? 12 : (year === curYear ? Number(today.slice(5, 7)) : 0);
  const monthHours = [], monthAmounts = [];
  for(let m = 1; m <= 12; m++){
    if(m > maxMonth){ monthHours.push(null); monthAmounts.push(null); continue; }
    let hour = 0, amount = 0;
    const dim = new Date(year, m, 0).getDate();
    for(let day = 1; day <= dim; day++){
      const ds = year + '-' + String(m).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      if(ds > today) break;
      const r = sumForDate(ds);
      hour += r.hour;
      amount += r.amount;
    }
    monthHours.push(hour);
    monthAmounts.push(amount);
  }

  return {
    dayHours, dayAmounts, monthHours, monthAmounts,
    daySumHour: sumOrNull(dayHours), daySumAmount: sumOrNull(dayAmounts),
    monthSumHour: sumOrNull(monthHours), monthSumAmount: sumOrNull(monthAmounts)
  };
}

/* Sums an array of numbers/nulls (skipping nulls, i.e. days/months not yet
   reached). Returns null only when every entry is null (nothing to sum). */
function sumOrNull(arr){
  const vals = arr.filter(v => v !== null && v !== undefined);
  if(!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0);
}

/* Thay cho handleRequestBody_ ben code.gs (doc-sua-ghi trong 1 request,
   bao ve boi LockService). Firestore transaction lam dung viec tuong tu:
   doc lai document NGAY BEN TRONG transaction, ap dung switch(action), roi
   ghi lai - neu co request khac ghi de document nay giua chung, Firestore
   TU DONG phat hien xung dot va chay lai callback nay (retry), dam bao
   khong bao gio 2 addRow cung luc lam mat du lieu cua nhau (tuong duong
   LockService.waitLock nhung khong can tu quan ly lock/timeout). */
async function apiDelta(date, action, payload){
  const docRef = db.collection(OT_COLLECTION).doc(date);
  try {
    const result = await db.runTransaction(async (tx) => {
      const snap = await tx.get(docRef);
      let data = snap.exists ? snap.data() : null;
      if(!data || !Array.isArray(data.rows)){
        data = { rows: [], approved: false, approvedAt: null, approvedBy: null, rejected: false, rejectedAt: null, rejectedBy: null, rejectComment: '' };
      }
      switch(action){
        case 'addRow':
          // Chot an toan phia client (tuong duong ben code.gs): bo qua neu
          // trung id (retry/bam 2 lan) thay vi them dong trung lap.
          if(!data.rows.some(r => r.id === payload.row.id)){
            data.rows = data.rows.concat([payload.row]);
          }
          break;
        case 'deleteRow':
          data.rows = data.rows.filter(r => r.id !== payload.id);
          break;
        case 'sign':
          data.approved = true;
          data.approvedAt = new Date().toISOString();
          data.approvedBy = payload.approvedBy || 'Kim Joo Shik';
          break;
        case 'unlock':
          data.approved = false;
          data.approvedAt = null;
          data.rejected = false;
          data.rejectedAt = null;
          data.rejectedBy = null;
          data.rejectComment = '';
          break;
        case 'reject':
          data.approved = false;
          data.approvedAt = null;
          data.rejected = true;
          data.rejectedAt = new Date().toISOString();
          data.rejectedBy = payload.rejectedBy || 'Kim Joo Shik';
          data.rejectComment = payload.rejectComment || '';
          break;
      }
      data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
      tx.set(docRef, data);
      // Tra ve BAN SAO khong co updatedAt cho noi goi (applyDelta -> state.data):
      // gia tri serverTimestamp() con la 1 "sentinel" object noi bo, CHUA phai
      // Timestamp that (Firestore resolve no o server sau khi ghi) - dua thang
      // sentinel nay vao state.data se lam hong moi cho dung updatedAt (render,
      // pregeneratePdf...) sau nay. Cau truc data goc (truoc gio) chua bao gio
      // co field nay lo ra ngoai UI nen giu nguyen hanh vi do.
      const { updatedAt, ...dataForCaller } = data;
      return dataForCaller;
    });
    return Object.assign({ success: true }, result);
  } catch(err){
    return { success: false, error: err.message };
  }
}

/* Gửi 1 action delta (addRow/deleteRow/sign/unlock/reject) trong ĐÚNG 1 lần
   POST — server tự đọc-sửa-ghi trong cùng request (xem backend calc.gs) —
   thay vì cách cũ fetchLatest() (GET) rồi persist() (POST) tốn 2 lượt round
   trip cho mỗi thao tác, vừa chậm gấp đôi vừa dễ bị polling 2s ghi đè lên
   phần vừa optimistic-update trong lúc còn đang chờ round trip thứ 2. */
/* Tra ve true/false de noi goi (vi du addRow) biet chac request co thanh
   cong hay khong va rollback optimistic update tuong ung khi that bai -
   truoc day ham nay khong tra ve gi, khien addRow() khong co cach nao biet
   da that bai de xoa dong vua optimistic-insert, dan den nguoi dung bam lai
   nut Add va tao ra dong trung lap tren man hinh. */
async function applyDelta(action, payload){
  // Chup lai key (category+date) TRUOC khi goi mang - giai thich chi tiet
  // xem trong loadData() o tren, ap dung y het logic o day: day chinh la
  // cho bi sot o lan sua truoc, khien tab Worker van con hien nham du lieu
  // Staff (hoac nguoc lai) MOI KHI nguoi dung Add/Delete/Sign/Unlock/Reject
  // tren 1 tab roi doi tab TRUOC KHI request nay kip tra loi - luc do
  // "state.data = newData" (dong cu) se ghi de len dung du lieu tab moi da
  // duoc loadData() nap dung truoc do.
  const requestedKey = storageDateKey();
  state.syncing = true; state.formError=''; state.pendingMutations++; render();
  let ok = false;
  try{
    const result = await apiDelta(requestedKey, action, payload);
    if(!result || result.success === false){
      throw new Error((result && result.error) || 'Server rejected the request');
    }
    // Server da luu thanh cong cho dung tab/ngay luc goi (requestedKey), nen
    // van tinh la "ok" du sau do nguoi dung co the da doi sang tab khac.
    ok = true;
    state.syncError = '';
    // CHI ghi de state.data (va lam moi PDF cache) neu tab/ngay hien tai
    // VAN CON khop voi luc goi request nay. Neu khong khop (da doi tab
    // trong luc cho) - bo qua, KHONG dung rollback vi optimistic row cua
    // tab cu da bi loadData() cua tab moi thay the hoan toan roi, ghi de
    // them o day chi lam sai du lieu tab dang xem.
    if(requestedKey === storageDateKey()){
      const newData = Object.assign({}, result);
      delete newData.success;
      state.data = newData;
      cacheDayData(requestedKey, newData);
      // Background trigger: every time data actually changes (add/delete row,
      // sign/unlock/reject), silently re-fill the template, recalc formulas and
      // convert to PDF now, so the PDF is already sitting in cache and Export
      // PDF just serves it instantly instead of rebuilding on click.
      pregeneratePdf();
    }
  }catch(e){
    console.error('Save error', e);
    if(requestedKey === storageDateKey()){
      state.formError = 'Could not save: ' + e.message + ' (check your internet connection or the backend URL setup)';
    }
  }
  state.pendingMutations = Math.max(0, state.pendingMutations - 1);
  state.syncing = false;
  state.lastSync = new Date();
  render();
  return ok;
}

async function addRow(){
  // Guard #1: neu 1 request addRow truoc do van dang bay (chua xong), bo
  // qua het cac lan goi them - chan double-tap/double-click tren tablet va
  // truong hop bam nhieu lan lien tuc vi tuong lan bam truoc chua an.
  if(state.addingRow) return;
  state.formError = '';
  if(!state.form.fullName.trim()){ state.formError = 'Please select an Emp ID or enter a Full Name.'; render(); return; }
  const newRow = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
    idCode: state.form.idCode.trim(),
    fullName: state.form.fullName.trim(),
    otFrom: state.form.otFrom.trim(),
    otTo: state.form.otTo.trim(),
    requestedBy: state.form.requestedBy.trim(),
    remark: state.form.remark.trim(),
    factory: state.form.factory.trim(),
    ownTeam: state.form.ownTeam.trim(),
    ts: new Date().toISOString()
  };
  const savedForm = state.form;
  // Guard #2: khoa nut Add ngay lap tuc (render() ben duoi se disable nut
  // qua state.addingRow) trong suot thoi gian cho server phan hoi.
  state.addingRow = true;
  // Optimistic update: show the new row in the Request list immediately
  // (no waiting on the network) instead of only after the save round-trip
  // completes; the save below then reconciles with the server in the
  // background.
  state.data = Object.assign({}, state.data, { rows: (state.data.rows||[]).concat([newRow]) });
  state.form = { idCode:'', fullName:'', otFrom:'', otTo:'', requestedBy:'', remark:'', factory:'', ownTeam:'' };
  state.empSuggestOpen = false;
  render();

  const ok = await applyDelta('addRow', { row: newRow });
  if(!ok){
    // Rollback: xoa dong optimistic vua them va tra lai noi dung form, vi
    // request that bai that su (server khong co dong nay). Truoc day dong
    // nay bi bo lai tren man hinh du that bai, khien nguoi dung tuong chua
    // luu va bam Add lai cho cung 1 nguoi -> tao ra 2-3 dong trung lap y het
    // nhau (dung trieu chung dang gap).
    state.data = Object.assign({}, state.data, { rows: (state.data.rows||[]).filter(r => r.id !== newRow.id) });
    state.form = savedForm;
  }
  state.addingRow = false;
  render();
}

async function deleteRow(id){
  // Optimistic update too, same reasoning as addRow above.
  state.data = Object.assign({}, state.data, { rows: (state.data.rows||[]).filter(r=>r.id!==id) });
  render();
  await applyDelta('deleteRow', { id });
}

/* ---------- Excel export: fills the official company template ---------- */

function b64ToUint8(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

function excelDateSerial(dateStr){
  const d = new Date(dateStr + 'T00:00:00Z');
  const epoch = Date.UTC(1899,11,30);
  return Math.round((d.getTime() - epoch) / 86400000);
}

function timeToExcelFraction(hhmm){
  const m = /^(\d{1,2}):(\d{2})$/.exec((hhmm||'').trim());
  if(!m) return null;
  const h = parseInt(m[1],10), mi = parseInt(m[2],10);
  return (h*60+mi)/1440;
}

function setCellXml(xml, ref, buildCellTag, fallbackAttrs){
  const rowNum = ref.match(/\d+/)[0];

  const re = new RegExp('<c r="' + ref + '"([^/>]*)/>');
  if(re.test(xml)) return xml.replace(re, (m, attrs) => buildCellTag(attrs));

  const re2 = new RegExp('<c r="' + ref + '"([^>]*)>.*?</c>');
  if(re2.test(xml)) return xml.replace(re2, (m, attrs) => buildCellTag(attrs));

  // Ô chưa tồn tại trong template -> tạo mới, dùng fallbackAttrs (định dạng giờ) nếu có
  const cellTag = buildCellTag(fallbackAttrs || '');
  const rowSelfClose = new RegExp('<row r="' + rowNum + '"([^/>]*)/>');
  if(rowSelfClose.test(xml)) return xml.replace(rowSelfClose, (m, attrs) => `<row r="${rowNum}"${attrs}>${cellTag}</row>`);

  const rowOpenClose = new RegExp('(<row r="' + rowNum + '"[^>]*>)([\\s\\S]*?)(</row>)');
  if(rowOpenClose.test(xml)) return xml.replace(rowOpenClose, (m, open, inner, close) => `${open}${inner}${cellTag}${close}`);

  return xml;
}

function setInlineStrCell(xml, ref, value){
  return setCellXml(xml, ref, (attrs) => `<c r="${ref}"${attrs} t="inlineStr"><is><t>${escXml(value)}</t></is></c>`);
}

function setNumberCell(xml, ref, num, forcedStyleId){
  return setCellXml(xml, ref, (attrs) => {
    let newAttrs = attrs || '';
    if(forcedStyleId){
      if(/\ss="\d+"/.test(newAttrs)){
        newAttrs = newAttrs.replace(/\ss="\d+"/, ' s="' + forcedStyleId + '"');
      } else {
        newAttrs = newAttrs + ' s="' + forcedStyleId + '"';
      }
    }
    return `<c r="${ref}"${newAttrs}><v>${num}</v></c>`;
  });
}

// Lấy đúng style-index (định dạng giờ h:mm) từ dòng mẫu chuẩn STT 1 (E11/F11),
// rồi ép áp dụng style này cho MỌI dòng, kể cả dòng vốn có định dạng sai sẵn trong template
function getStyleId(xml, ref){
  const re = new RegExp('<c r="' + ref + '"[^/>]*?\\ss="(\\d+)"');
  const m = re.exec(xml);
  return m ? m[1] : null;
}

function setInlineStrCellStyled(xml, ref, value, forcedStyleId){
  return setCellXml(xml, ref, (attrs) => {
    let newAttrs = attrs || '';
    if(/\ss="\d+"/.test(newAttrs)){
      newAttrs = newAttrs.replace(/\ss="\d+"/, ' s="' + forcedStyleId + '"');
    } else {
      newAttrs = newAttrs + ' s="' + forcedStyleId + '"';
    }
    return `<c r="${ref}"${newAttrs} t="inlineStr"><is><t>${escXml(value)}</t></is></c>`;
  });
}

/* Đóng băng (freeze) hàng 1..splitRow của sheet, để khi Google Sheets xuất
   PDF nhiều trang, phần tiêu đề (Company/Form title, ngày, v.v. ở hàng
   1-10) được LẶP LẠI ở đầu mỗi trang thay vì chỉ hiện ở trang 1. */
function addFreezeHeaderRows(xml, splitRow){
  const paneTag = `<pane ySplit="${splitRow}" topLeftCell="A${splitRow+1}" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A${splitRow+1}" sqref="A${splitRow+1}"/>`;
  const selfClosing = /<sheetView([^>]*)\/>/.exec(xml);
  if(selfClosing) return xml.replace(selfClosing[0], `<sheetView${selfClosing[1]}>${paneTag}</sheetView>`);
  const withChildren = /<sheetView([^>]*)>([\s\S]*?)<\/sheetView>/.exec(xml);
  if(!withChildren) return xml; // cấu trúc template không như kỳ vọng -> bỏ qua, không đánh liều làm hỏng file
  if(/<pane\s/.test(withChildren[2])) return xml; // đã freeze sẵn rồi, không thêm trùng
  return xml.replace(withChildren[0], `<sheetView${withChildren[1]}>${paneTag}${withChildren[2]}</sheetView>`);
}

/* ====== PDF ngam: snapshot + hang doi + cache nhieu ngay ======
   - Snapshot: buildFilledPdfBytes() chi doc tu snapshot (category/date/data
     chup luc len lich), KHONG doc state.* trong luc await -> doi ngay giua
     chung khong lam PDF bi tron du lieu.
   - Hang doi 1 luong: chi 1 request len Apps Script moi luc; job nen cu chua
     chay bi bo khi co job nen moi (lướt nhieu ngay khong dồn request).
   - Cache nhieu PDF (LRU) theo fingerprint: quay lai ngay da tao thi xuat ngay.
   - Debounce 700ms: chi tao PDF cho ngay nguoi dung DUNG lai. */
const PDF_CACHE_MAX = 12;
const pdfCacheMap = new Map();      // fingerprint -> { pdfBytes, fileName, overflow }
const pdfJobs = new Map();          // fingerprint -> job dang cho/dang chay
let pdfPending = [];
let pdfRunning = false;
let pdfDebounceTimer = null;
const pdfYield = () => new Promise(r => setTimeout(r, 0));

function takePdfSnapshot(){
  const d = state.data || {};
  return {
    category: state.category,
    date: state.date,
    data: Object.assign({}, d, { rows: (d.rows || []).map(r => Object.assign({}, r)) })
  };
}
/* Fingerprint: moi thu anh huong noi dung PDF (gom noi dung tung dong, khong chi so dong). */
function snapshotFingerprint(snap){
  const rows = snap.data.rows || [];
  const str = rows.map(r => [r.idCode, r.otFrom, r.otTo, r.ownTeam, r.remark, r.ts].join('~')).join('|');
  let h = 5381;
  for(let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
  return [snap.category, snap.date, rows.length, h,
          snap.data.approved ? ('A' + (snap.data.approvedAt || '')) : '',
          snap.data.rejected ? 'R' : ''].join('|');
}
function currentPdfFingerprint(){ return snapshotFingerprint(takePdfSnapshot()); }

function pdfCacheSet(fp, built){
  pdfCacheMap.delete(fp);
  pdfCacheMap.set(fp, built);
  while(pdfCacheMap.size > PDF_CACHE_MAX) pdfCacheMap.delete(pdfCacheMap.keys().next().value);
}

async function buildFilledPdfBytes(snap){
  const rows = (snap.data.rows || []).slice(0, TEMPLATE_MAX_ROWS);
  const overflow = (snap.data.rows || []).length - rows.length;

  const zip = await JSZip.loadAsync(b64ToUint8(TEMPLATE_B64));
  await pdfYield();
  let sheetXml = await zip.file('xl/worksheets/sheet1.xml').async('string');

  // Widen column B (Emp/ID Code) so codes like "USV000026" are not clipped
  sheetXml = sheetXml.replace(
    /<col min="2" max="2" width="[\d.]+"/,
    '<col min="2" max="2" width="14"'
  );
  // Widen column C (Full Name) so Vietnamese names with diacritics are not clipped
  sheetXml = sheetXml.replace(
    /<col min="3" max="3" width="[\d.]+"/,
    '<col min="3" max="3" width="32"'
  );

  // Lặp lại tiêu đề (hàng 1-10) ở mọi trang PDF, kể cả trang 2 trở đi
  sheetXml = addFreezeHeaderRows(sheetXml, 10);

  // Date (J8)
  sheetXml = setNumberCell(sheetXml, 'J8', excelDateSerial(snap.date));
  const styleIdE = getStyleId(sheetXml, 'E11');
  const styleIdF = getStyleId(sheetXml, 'F11');

  // Data rows -> template rows 11..70
  rows.forEach((r, i) => {
    const rn = 11 + i;
    sheetXml = setInlineStrCell(sheetXml, 'B'+rn, r.idCode || '');
    const fromFrac = timeToExcelFraction(r.otFrom);
    const toFrac = timeToExcelFraction(r.otTo);
    if(fromFrac !== null) sheetXml = setNumberCell(sheetXml, 'E'+rn, fromFrac, styleIdE);
    if(toFrac !== null) sheetXml = setNumberCell(sheetXml, 'F'+rn, toFrac, styleIdF);
    sheetXml = setInlineStrCellStyled(sheetXml, 'H'+rn, r.ownTeam || '', '14');
    // Remark: cỡ chữ cố định 10pt (style 51, đã thêm sẵn trong file mẫu ở trên).
    sheetXml = setInlineStrCellStyled(sheetXml, 'J'+rn, r.remark || '', '51');
  });
  // Công thức Total (G71) đã đúng sẵn trong file mẫu: SUM(G11:G70)
  // (không cần patch runtime nữa)

  // Worker tab: remove the Recheck (column G) formula entirely across all
  // template rows. Staff tab keeps the original formula untouched.
  if(snap.category === 'Worker'){
    for(let rn = 11; rn <= 70; rn++){
      const reG = new RegExp('<c r="G' + rn + '"([^>]*)>.*?</c>');
      sheetXml = sheetXml.replace(reG, (m, attrs) => `<c r="G${rn}"${attrs}/>`);
    }
  }

  // Signed caption text in I84 (cell value, separate from the floating signature image)
  if(snap.data.approved){
    const signedText = 'Signed ' + fmtDateTime(snap.data.approvedAt);
    sheetXml = setInlineStrCell(sheetXml, 'I84', signedText);
  }

  zip.file('xl/worksheets/sheet1.xml', sheetXml);

  // Increase row 83's height so the enlarged signature image fits without
  // overlapping the "Signed ..." text on row 84
  let sheetXml2 = await zip.file('xl/worksheets/sheet1.xml').async('string');
  sheetXml2 = sheetXml2.replace(/<row r="83"([^>]*)ht="15"([^>]*)>/, '<row r="83"$1ht="44" customHeight="1"$2>');
  zip.file('xl/worksheets/sheet1.xml', sheetXml2);

  // Force Excel to recalculate all formulas (C, D, G columns) automatically on open,
  // instead of showing stale/blank cached formula results
  let workbookXml = await zip.file('xl/workbook.xml').async('string');
  const calcStart = workbookXml.indexOf('<calcPr');
  if(calcStart >= 0){
    const calcEnd = workbookXml.indexOf('/>', calcStart) + 2;
    workbookXml = workbookXml.slice(0, calcStart) + '<calcPr calcId="162913" fullCalcOnLoad="1" forceFullCalc="1"/>' + workbookXml.slice(calcEnd);
  } else {
    workbookXml = workbookXml.replace('</workbook>', '<calcPr calcId="162913" fullCalcOnLoad="1" forceFullCalc="1"/></workbook>');
  }
  zip.file('xl/workbook.xml', workbookXml);

  // Signature image, only if signed off - placed just above I84 (row 83) so the
  // "Signed ..." text in I84 stays visible underneath/beside it
  if(snap.data.approved){
    const sigBytes = b64ToUint8(SIG_IMG.split(',')[1]);
    zip.file('xl/media/image2.png', sigBytes);

    let rels = await zip.file('xl/drawings/_rels/drawing1.xml.rels').async('string');
    rels = rels.replace('</Relationships>',
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image2.png"/></Relationships>');
    zip.file('xl/drawings/_rels/drawing1.xml.rels', rels);

    let drawingXml = await zip.file('xl/drawings/drawing1.xml').async('string');
    const anchor = '<xdr:oneCellAnchor>'
      + '<xdr:from><xdr:col>8</xdr:col><xdr:colOff>15000</xdr:colOff><xdr:row>82</xdr:row><xdr:rowOff>4000</xdr:rowOff></xdr:from>'
      + '<xdr:ext cx="990000" cy="540000"/>'
      + '<xdr:pic>'
      + '<xdr:nvPicPr><xdr:cNvPr id="99" name="ChuKyDienTu" descr="ChuKyDienTu"/>'
      + '<xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>'
      + '<xdr:blipFill><a:blip xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:embed="rId2" cstate="print"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>'
      + '<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="990000" cy="540000"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr>'
      + '</xdr:pic><xdr:clientData/></xdr:oneCellAnchor>';
    drawingXml = drawingXml.replace('</xdr:wsDr>', anchor + '</xdr:wsDr>');
    zip.file('xl/drawings/drawing1.xml', drawingXml);
  }

  // Build the filled xlsx in-memory (not downloaded directly) then send it to
  // the Apps Script backend, which uploads it to Google Sheets (so formulas
  // are actually calculated) and converts it to a locked, non-editable PDF.
  await pdfYield();
  const outBase64 = await zip.generateAsync({ type: 'base64' });

  const pdfRes = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: 'exportPdf',
      fileName: 'Overtime_Form_' + snap.category + '_' + snap.date + '.xlsx',
      fileBase64: outBase64
    })
  });
  if(!pdfRes.ok) throw new Error('HTTP ' + pdfRes.status);
  const pdfResult = await pdfRes.json();
  if(!pdfResult.success) throw new Error(pdfResult.error || 'PDF conversion failed on the server');

  return {
    pdfBytes: b64ToUint8(pdfResult.pdfBase64),
    fileName: 'Overtime_Form_' + snap.category + '_' + snap.date + '.pdf',
    overflow
  };
}


async function pdfPump(){
  if(pdfRunning) return;
  pdfRunning = true;
  try{
    while(pdfPending.length){
      const job = pdfPending.shift();
      try{
        await pdfYield(); // nhuong UI truoc khi lam viec nang
        const built = await buildFilledPdfBytes(job.snap);
        pdfCacheSet(job.fp, built);
        job.resolve(built);
      }catch(e){
        console.error('PDF generation failed:', e);
        job.reject(e);
      }finally{
        pdfJobs.delete(job.fp);
      }
    }
  }finally{
    pdfRunning = false;
  }
}

/* Dua 1 snapshot vao hang doi. urgent=true (nguoi dung vua bam Export): chen len dau, khong bi bo. */
function pdfEnqueue(snap, urgent){
  const fp = snapshotFingerprint(snap);
  if(pdfCacheMap.has(fp)) return Promise.resolve(pdfCacheMap.get(fp));
  const existing = pdfJobs.get(fp);
  if(existing){
    if(urgent && !existing.urgent){
      existing.urgent = true;
      const i = pdfPending.indexOf(existing);
      if(i > 0){ pdfPending.splice(i, 1); pdfPending.unshift(existing); }
    }
    return existing.promise; // JOIN vao job y het dang cho/dang chay
  }
  const job = { fp, snap, urgent: !!urgent };
  job.promise = new Promise((res, rej) => { job.resolve = res; job.reject = rej; });
  job.promise.catch(() => {}); // job nen that bai khong gay "unhandled rejection"; export van nhan loi qua await
  if(urgent){
    pdfPending.unshift(job);
  } else {
    // chi giu 1 job nen dang cho (moi nhat); bo cac job nen cu chua chay
    pdfPending = pdfPending.filter(j => {
      if(j.urgent) return true;
      pdfJobs.delete(j.fp);
      j.resolve(null);
      return false;
    });
    pdfPending.push(job);
  }
  pdfJobs.set(fp, job);
  pdfPump();
  return job.promise;
}

/* Trigger nen (debounce): goi sau khi du lieu ngay hien tai da san sang. */
function pregeneratePdf(){
  if(NOT_CONFIGURED) return;
  if(state.category !== 'Staff' && state.category !== 'Worker') return;
  clearTimeout(pdfDebounceTimer);
  pdfDebounceTimer = setTimeout(() => {
    if(state.category !== 'Staff' && state.category !== 'Worker') return;
    if(state.loading) return; // state.data chua phai cua ngay nay; loadData() xong se goi lai
    pdfEnqueue(takePdfSnapshot(), false);
  }, 700);
}

async function exportExcel(){
  state.exporting = true; state.exportMsg = ''; render();
  try{
    if(state.loading) throw new Error('Data is still loading — please try again in a moment');
    const snap = takePdfSnapshot();
    const fp = snapshotFingerprint(snap);
    let built = pdfCacheMap.get(fp);
    if(!built){
      // Chua co san: dua len dau hang doi (JOIN neu job y het dang chay) va cho.
      state.exportMsg = 'Preparing PDF — this only happens right after opening a new date, later exports of the same date are instant...';
      render();
      built = await pdfEnqueue(snap, true);
      if(!built || !built.pdfBytes) throw new Error('PDF preparation did not complete — please try again');
    }

    const pdfBlob = new Blob([built.pdfBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(pdfBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = built.fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);

    state.exportMsg = built.overflow > 0
      ? `Exported as PDF. Note: this date has ${snap.data.rows.length} entries but the template only fits ${TEMPLATE_MAX_ROWS} rows — the last ${built.overflow} were not included.`
      : 'Exported successfully as a non-editable PDF in the official company format.';
  }catch(e){
    console.error(e);
    state.exportMsg = 'Export failed: ' + e.message;
  }
  state.exporting = false;
  render();
}

function buildDailySummaryGroups(){
  // Tag each row with its source category so Staff and Worker can be kept in
  // separate blocks (Staff on top, Worker below) within the same Factory,
  // even when both categories share the same Own Team name.
  const staffRows = (state.dailySummary.staffRows || []).map(r => Object.assign({}, r, { _cat: 'Staff' }));
  const workerRows = (state.dailySummary.workerRows || []).map(r => Object.assign({}, r, { _cat: 'Worker' }));
  const allRows = staffRows.concat(workerRows);

  // Quy tắc chung: khi nhân viên chọn Support Team (requestedBy) khác với Own Team gốc của họ (không phải "Own"),
  // thì OT đó được TÍNH vào Own Team = Support Team đã chọn (đội được hỗ trợ),
  // còn cột Support Team sẽ hiển thị Own Team gốc của nhân viên đó, và tách thành 1 dòng riêng.
  // (Ví dụ: Nguyễn Thị Ngọc Mai (CostCo) chọn Support Team = Target -> Own Team hiển thị Target, Support Team hiển thị CostCo)
  const adjustedRows = allRows.map(r => {
    const originalOwnTeam = (r.ownTeam || '').trim();
    const requestedBy = (r.requestedBy || '').trim();
    if(requestedBy && requestedBy !== 'Own' && requestedBy !== originalOwnTeam){
      return Object.assign({}, r, { ownTeam: requestedBy, requestedBy: originalOwnTeam || '(Không có)' });
    }
    return r;
  });

  function buildTeams(rowsForCat){
    const teamNames = Array.from(new Set(rowsForCat.map(r => r.ownTeam || '(Chưa có Own Team)'))).sort((a,b)=>a.localeCompare(b));
    return teamNames.map(ownTeam => {
      const teamRows = rowsForCat.filter(r => (r.ownTeam || '(Chưa có Own Team)') === ownTeam);
      const supportKeys = Array.from(new Set(teamRows.map(r => r.requestedBy || '(Không có)'))).sort((a,b)=>{
        if(a === 'Own' && b !== 'Own') return -1;
        if(b === 'Own' && a !== 'Own') return 1;
        return a.localeCompare(b);
      });
      const supportGroups = supportKeys.map(supportTeam => {
        const subRows = teamRows.filter(r => (r.requestedBy || '(Không có)') === supportTeam);
        // Tách OT ra nhiều dòng, mỗi dòng liệt kê 1 giá trị OT khác nhau
        const otKeys = Array.from(new Set(subRows.map(r => r.otTo).filter(Boolean))).sort((a,b)=>a.localeCompare(b));
        let otRows = otKeys.map(ot => {
          const otSubRows = subRows.filter(r => r.otTo === ot);
          const reasonVals = Array.from(new Set(otSubRows.map(r => r.remark).filter(Boolean)));
          return { ot, qty: otSubRows.length, reason: reasonVals.join(', ') };
        });
        if(otRows.length === 0){
          const reasonVals = Array.from(new Set(subRows.map(r => r.remark).filter(Boolean)));
          otRows = [{ ot: '', qty: subRows.length, reason: reasonVals.join(', ') }];
        }
        const qty = subRows.length;
        const reasonVals = Array.from(new Set(subRows.map(r => r.remark).filter(Boolean)));
        return { supportTeam, qty, otRows, reason: reasonVals.join(', ') };
      });
      const total = supportGroups.reduce((s,g)=>s+g.qty, 0);
      const distinctReasons = Array.from(new Set(supportGroups.map(g=>g.reason)));
      const mergedReason = distinctReasons.length === 1 ? distinctReasons[0] : null;
      return { ownTeam, supportGroups, total, mergedReason };
    });
  }

  const factories = FACTORY_LIST.filter(f => adjustedRows.some(r => (r.factory || '') === f));
  return factories.map(factory => {
    const factoryRows = adjustedRows.filter(r => (r.factory || '') === factory);
    const staffTeams = buildTeams(factoryRows.filter(r => r._cat === 'Staff'));
    const workerTeams = buildTeams(factoryRows.filter(r => r._cat === 'Worker'));
    // Staff teams first, Worker teams below, within the same Factory block.
    const teams = staffTeams.concat(workerTeams);
    return { factory, teams };
  });
}


function syncLabel(){
  if(state.syncing) return 'Syncing...';
  if(state.syncError) return state.syncError;
  if(!state.lastSync) return '';
  const secs = Math.floor((Date.now() - state.lastSync.getTime())/1000);
  if(secs < 3) return 'Just synced';
  return 'Synced ' + secs + 's ago';
}
